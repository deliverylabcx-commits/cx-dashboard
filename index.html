  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

/* ===================== 주간 리포트 ===================== */
function renderWeekly(data){
  const { dates, sections, outcall, delay30, schedule, rawLog, onboardCalls, skuRow, survey } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);
  const weeks = buildWeekList(dates);
  const app = document.getElementById("app");
  if (!weeks.length){ app.innerHTML = '<div class="loading">주간 데이터가 없습니다.</div>'; return; }

  const completeWeeks = weeks.filter(w => w.dates.length === 6);
  const defaultWeek = completeWeeks.length ? completeWeeks[completeWeeks.length-1] : weeks[weeks.length-1];
  if (!selectedWeekMonday || !weeks.find(w => w.monday === selectedWeekMonday)){
    selectedWeekMonday = defaultWeek.monday;
  }
  const wIdx = weeks.findIndex(w => w.monday === selectedWeekMonday);
  const week = weeks[wIdx];
  const prevWeek = wIdx > 0 ? weeks[wIdx-1] : null;

  function wowText(cur, prev, unit, pctPoint, invert){
    if (cur==null || prev==null) return '<span style="color:var(--ink-dim);">전주 데이터 없음</span>';
    const diff = cur - prev;
    const arrow = diff>=0 ? '▲' : '▼';
    const isGood = invert ? diff<=0 : diff>=0;
    const color = isGood ? 'var(--good)' : 'var(--bad)';
    const diffTxt = pctPoint ? `${Math.abs(Math.round(diff*100))}%p` : `${fmtNum(Math.abs(diff))}${unit||'건'}`;
    const curTxt = pctPoint ? fmtPct(cur) : fmtNum(cur);
    const prevTxt = pctPoint ? fmtPct(prev) : fmtNum(prev);
    return `WoW 비교: 전주 ${prevTxt} → 이번 주 ${curTxt} (<span style="color:${color};">${arrow} ${diffTxt}</span>)`;
  }

  const depMapW = departedInboundByDate(rawLog, sections);
  const depCompMapW = departedCompletedByDate(rawLog, sections);
  function cxStats(w){
    if (!w) return null;
    const inbound = sum(w.dates.map(d => totalInboundOn(d, data.totalRow, sections, agents, depMapW)));
    const completed = sum(w.dates.map(d => totalCompletedOn(d, sections, agents, depCompMapW)));
    return { inbound, completed, rate: inbound>0 ? completed/inbound : null };
  }
  const cx = cxStats(week);
  const cxPrev = cxStats(prevWeek);
  const callSecW = buildCallSection(data, week.dates, prevWeek?.dates, { periodLabel: dateRangeLabel(week.monday, week.saturday), prevLabel: "전주", canvasId: "chartCallWeek" });

  function outcallWeekStats(w){
    if (!w || !outcall?.categories?.length) return [];
    return outcall.categories.map(c => {
      const t = outcall.data[c]?.["Total"];
      const inbound = sum(w.dates.map(d => t?.["인입"]?.[d] || 0));
      const completed = sum(w.dates.map(d => t?.["통화완료"]?.[d] || 0));
      const absent = sum(w.dates.map(d => t?.["미처리"]?.[d] || 0));
      return { category:c, inbound, completed, completedRate: inbound>0?completed/inbound:null, absent, absentRate: inbound>0?absent/inbound:null };
    });
  }
  const outcallWeek = outcallWeekStats(week);
  const outcallWeekPrev = outcallWeekStats(prevWeek);

  function delayWeekStats(w){
    if (!w) return { total:0, byReason:[], rows:[] };
    const weekSet = new Set(w.dates);
    const rows = (delay30||[]).filter(r => weekSet.has(r.date));
    const reasonCount = {};
    rows.forEach(r => { const key = r.reason || "미분류"; reasonCount[key] = (reasonCount[key]||0)+1; });
    const byReason = Object.entries(reasonCount).map(([reason,count]) => ({reason,count})).sort((a,b)=>b.count-a.count);
    return { total: rows.length, byReason, rows };
  }
  const delayWeek = delayWeekStats(week);
  const delayWeekPrev = delayWeekStats(prevWeek);

  // 카테고리별 이슈 주간 집계
  const issueSection = rawIssueSection(rawLog) || sections["카테고리별 이슈"] || {}; // 클레임 VOC와 같은 RAW 기준
  const issueCategories = Object.keys(issueSection);
  function issueWeekStats(w){
    if (!w) return [];
    return issueCategories.map(c => ({ category:c, total: sum(w.dates.map(d => issueSection[c][d] || 0)) }));
  }
  const issueWeek = issueWeekStats(week).sort((a,b)=>b.total-a.total);
  const issueWeekPrevMap = Object.fromEntries(issueWeekStats(prevWeek).map(x=>[x.category,x.total]));

  // 부재율 주간 집계 (CS_Tracking 부재율 섹션 - 목표 미설정, 참고 지표)
  const absentSectionW = sections["부재율"] || {};
  function absentWeekStats(w){
    if (!w) return { total: 0, rate: null };
    const total = sum(w.dates.map(d => absentSectionW["부재건수"]?.[d] || 0));
    const inbound = sum(w.dates.map(d => totalInboundOn(d, data.totalRow, sections, agents, depMapW)));
    return { total, rate: inbound>0 ? total/inbound : null };
  }
  const absentWeek = absentWeekStats(week);
  const absentWeekPrev = absentWeekStats(prevWeek);

  // 품질/센터/VOC 주간 집계 (월간과 동일 로직 재사용)
  const weekDateSetQ = new Set(week.dates);
  const centerOfW = (r) => (r.center && r.center.trim()) ? r.center.trim() : null;
  const qualityWeek = analyzeQualityIssues(rawLog, weekDateSetQ);
  const qualityWeekPrev = prevWeek ? analyzeQualityIssues(rawLog, new Set(prevWeek.dates)) : null;
  const issueKwWeek = analyzeIssueKeywords(rawLog, weekDateSetQ, centerOfW, DELIVERY_ISSUE_KEYWORDS);
  const kwSortedW = Object.entries(issueKwWeek.byKeyword).sort((a,b)=>b[1]-a[1]);
  const surveyWeek = analyzeSurvey(survey, weekDateSetQ);
  const surveyWeekPrev = prevWeek ? analyzeSurvey(survey, new Set(prevWeek.dates)) : null;

  // SKU 배송물량 주간 집계 + 요일별 목표 처리량
  const skuWeekTotal = sum(week.dates.map(d => skuRow?.[d] || 0));
  const skuWeekPrevTotal = prevWeek ? sum(prevWeek.dates.map(d => skuRow?.[d] || 0)) : null;
  const weekdayTargetsW = computeWeekdayInboundTargets(dates, sections, agents);
  const agentAchWeek = agentTargetAchievement(agents, week.dates, sections, schedule, weekdayTargetsW);
  const agentAchWeekPrev = prevWeek ? agentTargetAchievement(agents, prevWeek.dates, sections, schedule, weekdayTargetsW) : {};
  const inboundOfDateW = (d) => totalInboundOn(d, data.totalRow, sections, agents, depMapW);
  const skuCorrWeek = skuInboundCorrelation(week.dates, skuRow, inboundOfDateW);

  // 아웃콜 카테고리별 담당자 목표 달성 (주간)
  const outcallCatsW = outcall?.categories || [];
  const outcallAchWeek = {};
  const outcallRateWeek = {};
  outcallCatsW.forEach(cat => {
    const t = computeWeekdayOutcallTargets(dates, outcall, cat, agents);
    outcallAchWeek[cat] = agentOutcallTargetAchievement(agents, week.dates, outcall, cat, schedule, t);
    outcallRateWeek[cat] = agentOutcallRateForPeriod(agents, week.dates, outcall, cat, schedule);
  });

  // 담당자별 생산성 주간 지표
  function agentWeekProductivity(w){
    if (!w) return {};
    const out = {};
    agents.forEach(a => { out[a] = { scores: [], unprocessed: 0 }; });
    w.dates.forEach(d => {
      const dayScores = dailyProductivityScores(sections, schedule, agents, d);
      agents.forEach(a => { if (dayScores[a] != null) out[a].scores.push(dayScores[a]); });
    });
    agents.forEach(a => {
      out[a].avg = out[a].scores.length ? sum(out[a].scores)/out[a].scores.length : null;
    });
    const weekSet = new Set(w.dates);
    (rawLog||[]).forEach(r => {
      if (weekSet.has(r.date) && r.direction === "INBOUND" && r.state && UNPROCESSED_STATES.includes(r.state.toLowerCase()) && out[r.agent]){
        out[r.agent].unprocessed++;
      }
    });
    return out;
  }
  const agentWeek = agentWeekProductivity(week);
  const agentWeekPrev = agentWeekProductivity(prevWeek);

  // MBO 공통 목표 주간 달성 현황 (일별 달성률의 주간 평균)
  const mboAgents = agents.filter(a => MBO_WEIGHTS[a]);
  function mboWeekStats(w){
    if (!w) return {};
    const out = {};
    mboAgents.forEach(a => {
      const daily = w.dates.map(d => mboScoresForAgent(sections, delay30, outcall, a, d)).filter(s => s.weighted!=null);
      out[a] = daily.length ? sum(daily.map(s=>s.weighted))/daily.length : null;
    });
    return out;
  }
  const mboWeek = mboWeekStats(week);
  const mboDetailWeek = Object.fromEntries(mboAgents.map(a => [a, mboDetailForAgentPeriod(sections, delay30, outcall, a, week.dates)]));
  const weekDateSet = new Set(week.dates);
  const hourlyStatsWeek = outcallHourlyStats(onboardCalls, d => weekDateSet.has(d.dateMD));
  const conversionAllW = onboardConversion(onboardCalls);
  const conversionWeek = onboardConversion(onboardCalls, d => weekDateSet.has(d.dateMD));
  const conversionWeekPrev = prevWeek ? onboardConversion(onboardCalls, d => new Set(prevWeek.dates).has(d.dateMD)) : null;
  const mboWeekPrev = mboWeekStats(prevWeek);

  const weeklyInsights = [];
  if (cx && cxPrev){
    const diff = cx.inbound - cxPrev.inbound;
    weeklyInsights.push(`전주(${dateLabel(prevWeek.monday)}~${dateLabel(prevWeek.saturday)}) 인입 ${fmtNum(cxPrev.inbound)}건 → 이번 주 ${fmtNum(cx.inbound)}건 (${diff>=0?'▲':'▼'} ${fmtNum(Math.abs(diff))}건)`);
  }
  if (cx && cx.rate!=null){
    weeklyInsights.push(`이번 주 응대율은 ${fmtPct(cx.rate)}입니다.`);
  }
  if (absentWeek.rate != null){
    const diff = (absentWeekPrev.rate!=null) ? absentWeek.rate - absentWeekPrev.rate : null;
    const trendTxt = diff==null ? '' : (diff<=0 ? ` (전주 대비 ▼ ${Math.abs(Math.round(diff*100))}%p 개선)` : ` (전주 대비 ▲ ${Math.abs(Math.round(diff*100))}%p 증가)`);
    weeklyInsights.push(`이번 주 부재율은 <b>${fmtPct(absentWeek.rate)}</b>입니다${trendTxt}.`);
  }
  {
    const achNames = Object.keys(agentAchWeek);
    const met = achNames.filter(a => agentAchWeek[a].rateMin != null && agentAchWeek[a].rateMin >= 1);
    const missed = achNames.filter(a => agentAchWeek[a].rateMin != null && agentAchWeek[a].rateMin < 1)
      .sort((x,y) => agentAchWeek[x].rateMin - agentAchWeek[y].rateMin);
    if (met.length) weeklyInsights.push(`이번 주 목표 CS처리량을 달성한 상담원은 <b>${met.join(", ")}</b>입니다.`);
    if (missed.length){
      const w = missed[0];
      weeklyInsights.push(`목표 미달 상담원은 <b>${missed.join(", ")}</b>이며, 그중 <b>${w}</b>가 ${Math.round(agentAchWeek[w].rateMin*100)}%로 가장 낮습니다 (근무 ${agentAchWeek[w].workDays}일 기준).`);
    }
  }
  if (delayWeek.byReason.length){
    const top = delayWeek.byReason[0];
    const pct = delayWeek.total>0 ? Math.round((top.count/delayWeek.total)*100) : 0;
    weeklyInsights.push(`이번 주 30분 응대지연 총 ${delayWeek.total}건 중 "${top.reason}"가 ${top.count}건(${pct}%)으로 가장 많습니다.`);
  }
  if (outcallWeek.length){
    const worst = outcallWeek.slice().sort((a,b)=>(b.absentRate||0)-(a.absentRate||0))[0];
    if (worst && worst.absentRate!=null) weeklyInsights.push(`아웃콜 중 부재율이 가장 높은 카테고리는 <b>${catLabel(worst.category)}</b> (${fmtPct(worst.absentRate)})입니다.`);
    const wMet = outcallWeek.filter(o => o.completedRate!=null && o.completedRate >= OUTCALL_TARGET_RATE).map(o=>o.category);
    const wMiss = outcallWeek.filter(o => o.completedRate!=null && o.completedRate < OUTCALL_TARGET_RATE);
    if (wMet.length) weeklyInsights.push(`이번 주 아웃콜 성공률 타겟(${Math.round(OUTCALL_TARGET_RATE*100)}%)을 달성한 카테고리는 <b>${wMet.map(catLabel).join(", ")}</b>입니다.`);
    if (wMiss.length){
      const w = wMiss.reduce((a,b)=>b.completedRate<a.completedRate?b:a);
      const needed = Math.max(0, Math.ceil(w.inbound*OUTCALL_TARGET_RATE) - w.completed);
      weeklyInsights.push(`<b>${catLabel(w.category)}</b>은 성공률 ${fmtPct(w.completedRate)}로 타겟 미달이며, ${needed}건을 더 완료해야 타겟에 도달합니다.`);
    }
  }
  if (issueWeek.length && issueWeek[0].total>0){
    weeklyInsights.push(`이번 주 가장 많이 발생한 이슈 카테고리는 <b>${issueWeek[0].category}</b> (${fmtNum(issueWeek[0].total)}건)입니다.`);
  }
  {
    const productivityDiffs = agents
      .filter(a => agentWeek[a]?.avg!=null && agentWeekPrev[a]?.avg!=null)
      .map(a => ({ agent:a, diff: agentWeek[a].avg - agentWeekPrev[a].avg }));
    if (productivityDiffs.length){
      const best = productivityDiffs.reduce((x,y)=>y.diff>x.diff?y:x);
      const worst = productivityDiffs.reduce((x,y)=>y.diff<x.diff?y:x);
      if (best.diff > 0) weeklyInsights.push(`전주 대비 생산성이 가장 많이 오른 상담원은 <b>${best.agent}</b> (▲ ${best.diff.toFixed(1)}점)입니다.`);
      if (worst.diff < 0) weeklyInsights.push(`전주 대비 생산성이 가장 많이 떨어진 상담원은 <b>${worst.agent}</b> (▼ ${Math.abs(worst.diff).toFixed(1)}점)입니다.`);
    }
  }
  {
    const completedByAgent = agents.map(a => ({ agent:a, total: sum(week.dates.map(d => sections["상담완료"]?.[a]?.[d] || 0)) }));
    const topHandler = completedByAgent.filter(x=>x.total>0).sort((a,b)=>b.total-a.total)[0];
    if (topHandler) weeklyInsights.push(`이번 주 상담인입을 가장 많이 처리한 상담원은 <b>${topHandler.agent}</b> (${fmtNum(topHandler.total)}건)입니다.`);
  }
  (outcall?.categories||[]).forEach(c => {
    const perAgent = agents.map(a => {
      const completed = sum(week.dates.map(d => outcall.data[c]?.[a]?.["통화완료"]?.[d] || 0));
      const inbound = sum(week.dates.map(d => outcall.data[c]?.[a]?.["인입"]?.[d] || 0));
      return { agent:a, completed, rate: inbound>0 ? completed/inbound : null };
    });
    const topVolume = perAgent.filter(x=>x.completed>0).sort((a,b)=>b.completed-a.completed)[0];
    const topRate = perAgent.filter(x=>x.rate!=null && x.completed>0).sort((a,b)=>b.rate-a.rate)[0];
    if (topVolume) weeklyInsights.push(`${catLabel(c)} 아웃콜을 가장 많이 담당한 상담원은 <b>${topVolume.agent}</b> (통화완료 ${fmtNum(topVolume.completed)}건)이고, 완료율이 가장 높은 상담원은 <b>${topRate?topRate.agent:topVolume.agent}</b> (${fmtPct(topRate?topRate.rate:null)})입니다.`);
  });

  const weekOptions = weeks.map(w => `<option value="${w.monday}" ${w.monday===selectedWeekMonday?'selected':''}>${dateRangeLabel(w.monday, w.saturday)}</option>`).join("");

  app.innerHTML = `
    <header>
      <div>
        <h1>CX 생산성 · 주간 리포트</h1>
        <div class="sub">${dateLabel(week.monday)} ~ ${dateLabel(week.saturday)} (월~토 · 일요일 제외)</div>
      </div>
      <div class="status">
        <select id="weekPicker" onchange="onWeekChange(this.value)" style="background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;">
          ${weekOptions}
        </select>
        <button onclick="switchToClaim()" style="background:#F0555B;color:#fff;font-weight:700;border:none;">🧾 클레임 VOC</button>
        <button onclick="switchToVip()" class="vip-btn">👑 VIP CS 현황</button>
        <button onclick="switchToCost()" style="background:#4C6EF5;color:#fff;font-weight:700;border:none;">💳 채널톡 비용</button>
        <button onclick="switchToMonthly()" style="background:#748FFC;color:#0F1420;font-weight:600;border:none;">월별 보기</button>
        <button onclick="switchToDaily()">일간 보기로 돌아가기</button>
      </div>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <h2>주간 인사이트</h2>
      <ul class="insight-list">
        ${renderInsightList(weeklyInsights)}
      </ul>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>채널톡 인입 및 응대현황</h2>
      <div class="kpis">
        <div class="kpi"><div class="label">상담인입 (채팅+CALL)</div><div class="val">${fmtNum((cx?.inbound||0) + callSecW.callIn)}</div><div style="font-size:11.5px;color:var(--ink-dim);margin-top:4px;">💬 채팅 ${fmtNum(cx?.inbound)} · 📞 CALL ${fmtNum(callSecW.callIn)}</div>${(() => { const cur = (cx?.inbound||0) + callSecW.callIn, pv = callSecW.ptotal; if (pv == null) return ''; const d = cur - pv; return `<div class="delta ${d>=0?'up':'down'}">전주 대비 ${d>=0?'▲':'▼'} ${fmtNum(Math.abs(d))}건${pv?` (${d>=0?'+':'-'}${Math.abs(Math.round(d/pv*100))}%)`:''} · 전주 ${fmtNum(pv)}건</div>`; })()}</div>
        <div class="kpi"><div class="label">응대현황 (상담완료)</div><div class="val">${fmtNum(cx?.completed)}</div></div>
        <div class="kpi"><div class="label">응대율</div><div class="val">${fmtPct(cx?.rate)}</div></div>
      </div>
      <div style="margin-top:14px;font-size:13px;color:var(--ink-dim);line-height:1.9;">
        인입 ${wowText(cx?.inbound, cxPrev?.inbound)}<br>
        완료 ${wowText(cx?.completed, cxPrev?.completed)}<br>
        응대율 ${wowText(cx?.rate, cxPrev?.rate, null, true)}
      </div>
      <div style="margin-top:16px;">
        <canvas id="chartWeekDaily"></canvas>
      </div>
    </div>

    ${callSecW.html}
    ${buildClaimSummaryCard(rawLog, week.dates, dateRangeLabel(week.monday, week.saturday))}

    <div class="card" style="margin-bottom:16px;">
      <h2>CX 아웃콜 운영현황 <span class="tag">성공률 타겟 ${Math.round(OUTCALL_TARGET_RATE*100)}%</span></h2>
      <div class="kpis">
        ${outcallWeek.map((o,i) => {
          const p = outcallWeekPrev[i];

/* ===================== 월별 리포트 ===================== */
function renderMonthly(data){
  const { dates, sections, outcall, delay30, onboardCalls, rawLog, skuRow, schedule, survey } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);
  const months = buildMonthList(dates);
  const app = document.getElementById("app");
  if (!months.length){ app.innerHTML = '<div class="loading">월간 데이터가 없습니다.</div>'; return; }

  if (!selectedMonthKey || !months.find(m => m.key === selectedMonthKey)){
    selectedMonthKey = months[months.length-1].key;
  }
  const mIdx = months.findIndex(m => m.key === selectedMonthKey);
  const month = months[mIdx];
  const prevMonth = mIdx > 0 ? months[mIdx-1] : null;

  function wowText(cur, prev, unit, pctPoint, invert){
    if (cur==null || prev==null) return '<span style="color:var(--ink-dim);">전월 데이터 없음</span>';
    const diff = cur - prev;
    const arrow = diff>=0 ? '▲' : '▼';
    const isGood = invert ? diff<=0 : diff>=0;
    const color = isGood ? 'var(--good)' : 'var(--bad)';
    const diffTxt = pctPoint ? `${Math.abs(Math.round(diff*100))}%p` : `${fmtNum(Math.abs(diff))}${unit||'건'}`;
    const curTxt = pctPoint ? fmtPct(cur) : fmtNum(cur);
    const prevTxt = pctPoint ? fmtPct(prev) : fmtNum(prev);
    return `전월 대비: ${prevTxt} → ${curTxt} (<span style="color:${color};">${arrow} ${diffTxt}</span>)`;
  }

  const depMapM = departedInboundByDate(rawLog, sections);
  const depCompMapM = departedCompletedByDate(rawLog, sections);
  function cxStats(dSet){
    if (!dSet || !dSet.length) return null;
    const inbound = sum(dSet.map(d => totalInboundOn(d, data.totalRow, sections, agents, depMapM)));
    const completed = sum(dSet.map(d => totalCompletedOn(d, sections, agents, depCompMapM)));
    return { inbound, completed, rate: inbound>0 ? completed/inbound : null };
  }
  const cx = cxStats(month.dates);
  const cxPrev = cxStats(prevMonth?.dates);
  const callSecM = buildCallSection(data, month.dates, prevMonth?.dates, { periodLabel: month.label, prevLabel: "전월", canvasId: "chartCallMonth" });

  function outcallStats(dSet){
    if (!dSet || !outcall?.categories?.length) return [];
    return outcall.categories.map(c => {
      const t = outcall.data[c]?.["Total"];
      const inbound = sum(dSet.map(d => t?.["인입"]?.[d] || 0));
      const completed = sum(dSet.map(d => t?.["통화완료"]?.[d] || 0));
      const absent = sum(dSet.map(d => t?.["미처리"]?.[d] || 0));
      return { category:c, inbound, completed, completedRate: inbound>0?completed/inbound:null, absent, absentRate: inbound>0?absent/inbound:null };
    });
  }
  const outcallMonth = outcallStats(month.dates);
  const outcallMonthPrev = outcallStats(prevMonth?.dates);

  const mboAgents = agents.filter(a => MBO_WEIGHTS[a]);
  function mboMonthStats(dSet){
    if (!dSet) return {};
    const out = {};
    mboAgents.forEach(a => {
      const daily = dSet.map(d => mboScoresForAgent(sections, delay30, outcall, a, d)).filter(s => s.weighted!=null);
      out[a] = daily.length ? sum(daily.map(s=>s.weighted))/daily.length : null;
    });
    return out;
  }
  const mboMonth = mboMonthStats(month.dates);
  const mboDetailMonth = Object.fromEntries(mboAgents.map(a => [a, mboDetailForAgentPeriod(sections, delay30, outcall, a, month.dates)]));
  const mboMonthPrev = mboMonthStats(prevMonth?.dates);

  // 모바일 레터링 도입(8/11) 전후 아웃콜 성과 비교 - 전체 기간 기준
  function mdKey(md){ if (!md) return 0; const [m,d] = md.split("/").map(Number); return m*100+d; }
  const letteringKey = mdKey(LETTERING_START);
  const beforeDates = dates.filter(d => mdKey(d) < letteringKey);
  const afterDates = dates.filter(d => mdKey(d) >= letteringKey);
  const letteringCompare = (outcall?.categories||[]).map(c => {
    const t = outcall.data[c]?.["Total"];
    const agg = (ds) => {
      const inbound = sum(ds.map(d => t?.["인입"]?.[d] || 0));
      const completed = sum(ds.map(d => t?.["통화완료"]?.[d] || 0));
      return { inbound, completed, rate: inbound>0 ? completed/inbound : null };
    };
    const b = agg(beforeDates), a = agg(afterDates);
    return {
      category: c,
      beforeInbound: b.inbound, beforeRate: b.rate,
      afterInbound: a.inbound, afterRate: a.rate,
      diff: (b.rate!=null && a.rate!=null) ? a.rate - b.rate : null
    };
  });

  function delayStats(dSet){
    if (!dSet) return { total:0, byReason:[] };
    const set = new Set(dSet);
    const rows = (delay30||[]).filter(r => set.has(r.date));
    const reasonCount = {};
    rows.forEach(r => { const key = r.reason || "미분류"; reasonCount[key] = (reasonCount[key]||0)+1; });
    return { total: rows.length, byReason: Object.entries(reasonCount).map(([reason,count])=>({reason,count})).sort((a,b)=>b.count-a.count) };
  }
  const delayMonth = delayStats(month.dates);
  const delayMonthPrev = delayStats(prevMonth?.dates);

  const issueSection = rawIssueSection(rawLog) || sections["카테고리별 이슈"] || {}; // 클레임 VOC와 같은 RAW 기준
  const issueCategories = Object.keys(issueSection);
  function issueStats(dSet){
    if (!dSet) return [];
    return issueCategories.map(c => ({ category:c, total: sum(dSet.map(d => issueSection[c][d] || 0)) }));
  }
  const issueMonth = issueStats(month.dates).sort((a,b)=>b.total-a.total);
  const issueMonthPrevMap = Object.fromEntries(issueStats(prevMonth?.dates).map(x=>[x.category,x.total]));

  // 부재율 월간 집계 (CS_Tracking 부재율 섹션 - 목표 미설정, 참고 지표)
  const absentSectionM = sections["부재율"] || {};
  function absentMonthStats(dSet){
    if (!dSet) return { total: 0, rate: null };
    const total = sum(dSet.map(d => absentSectionM["부재건수"]?.[d] || 0));
    const inbound = sum(dSet.map(d => totalInboundOn(d, data.totalRow, sections, agents, depMapM)));
    return { total, rate: inbound>0 ? total/inbound : null };
  }
  const absentMonth = absentMonthStats(month.dates);
  const absentMonthPrev = absentMonthStats(prevMonth?.dates);

  // SKU 배송물량 월간 집계 + 요일별 목표 처리량 + 상관도
  const skuMonthTotal = sum(month.dates.map(d => skuRow?.[d] || 0));
  const skuMonthPrevTotal = prevMonth ? sum(prevMonth.dates.map(d => skuRow?.[d] || 0)) : null;
  const weekdayTargetsM = computeWeekdayInboundTargets(dates, sections, agents);

// 가로 막대 차트 공용 헬퍼 (품질/센터/VOC 시각화)
function drawBarChart(canvasId, labels, values, color, horizontal){
  const el = document.getElementById(canvasId);
  if (!el || !labels.length) return null;
  return new Chart(el, {
    type: "bar",
    data: { labels, datasets: [{ data: values, backgroundColor: color, borderRadius: 4 }] },
    options: {
      indexAxis: horizontal ? "y" : "x",
      plugins: { legend: { display:false } },
      scales: { x:{ grid:{color:"#28324D"}, ticks:{font:{size:10}} }, y:{ grid:{display:false}, ticks:{font:{size:10}} } }
    }
  });
}
function drawStackedScoreChart(canvasId, dist){
  const el = document.getElementById(canvasId);
  if (!el) return null;
  return new Chart(el, {
    type: "bar",
    data: {
      labels: ["1점","2점","3점","4점","5점"],
      datasets: [{
        data: [dist[1],dist[2],dist[3],dist[4],dist[5]],
        backgroundColor: ["#F0555B","#F0555B99","#E8A33D","#2FBF8F99","#2FBF8F"],
        borderRadius: 4
      }]
    },
    options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:"#28324D"}, beginAtZero:true}, x:{grid:{display:false}} } }
  });
}

function drawCharts({ dates, sections, agents, today, outcall, weekKeys, weeklyByCategory, issueTodayRanking, weeklyByIssue, issueWeekKeys, hourlyToday, productivityScores, mboTrend, recentTotalsWithDep }){
  destroyCharts();
  Chart.defaults.color = "#8B96AD";
  Chart.defaults.borderColor = "#28324D";
  Chart.defaults.font.family = "Pretendard, sans-serif";

  const totals = recentTotalsWithDep || dates.map(d => sum(agents.map(a => sections["상담인입"][a][d])));
  const peakIdx = totals.indexOf(Math.max(...totals));
  const dateTickColor = (ctx) => { const d = dates[ctx.index]; return d && weekdayOf(d)===0 ? "#F0555B" : "#8B96AD"; };
  const dateLabels = dates.map(d => dateLabel(d));

  charts.inbound = new Chart(document.getElementById("chartInbound"), {
    type: "bar",
    data: { labels: dateLabels, datasets: [{
      data: totals,
      backgroundColor: dates.map((_,i)=> i===peakIdx ? "#E8A33D" : "#4C6EF555"),
      borderRadius: 4
    }]},
    options: { plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:"#28324D"} }, x:{ grid:{display:false}, ticks:{color:dateTickColor} } } }
  });

  const shareToday = agents.map(a => sections["상담인입"][a][today] || 0);
  const rankOrder = agents.map((a,i) => ({ agent:a, val: shareToday[i] }))
    .sort((a,b) => b.val - a.val);
  const TIER_COLORS = ["#E8A33D","#C9CDD6","#B08D57"]; // 금/은/동
  charts.share = new Chart(document.getElementById("chartShare"), {
    type: "bar",
    data: {
      labels: rankOrder.map((r,i) => `${i+1}위 ${r.agent}`),
      datasets: [{
        data: rankOrder.map(r => r.val),
        backgroundColor: rankOrder.map((r,i) => i<3 ? TIER_COLORS[i] : AGENT_COLORS[r.agent]+"AA"),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: "y",
      plugins: { legend: { display:false } },
      scales: { x:{ grid:{color:"#28324D"} }, y:{ grid:{display:false} } }
    }
  });

  const hourlyCanvas = document.getElementById("chartHourlyToday");
  if (hourlyCanvas){
    charts.hourlyToday = new Chart(hourlyCanvas, {
      type: "bar",
      data: { labels: Array.from({length:24}, (_,h)=>`${h}시`), datasets: [{
        data: hourlyToday || [],
        backgroundColor: "#4C6EF588",
        borderRadius: 4
      }]},
      options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:"#28324D"}}, x:{grid:{display:false}} } }
    });
  }

  charts.agentStack = new Chart(document.getElementById("chartAgentStack"), {
    type: "bar",
    data: { labels: dateLabels, datasets: agents.map(a => ({
      label: a, data: dates.map(d => sections["상담인입"][a][d] || 0),
      backgroundColor: AGENT_COLORS[a], stack: "s"
    }))},
    options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
      scales:{ x:{stacked:true, grid:{display:false}, ticks:{color:dateTickColor}}, y:{stacked:true, grid:{color:"#28324D"}} } }
  });

  const isClosedDay = (d) => sum(agents.map(a => sections["상담인입"]?.[a]?.[d] || 0)) === 0;
  charts.rates = new Chart(document.getElementById("chartRates"), {

function toggleAgent(agent){
  if (!lastCtx) return;
  const wasOpen = openAgentPanel === agent;

  // 다른 패널 모두 닫기
  document.querySelectorAll(".acc-body").forEach(b => { b.style.display = "none"; b.innerHTML = ""; });
  document.querySelectorAll(".acc-header").forEach(h => h.classList.remove("active"));
  if (agentDetailChart){ agentDetailChart.destroy(); agentDetailChart = null; }

  if (wasOpen){ openAgentPanel = null; return; }

  openAgentPanel = agent;
  const header = document.getElementById("acc-header-" + agent);
  const body = document.getElementById("acc-body-" + agent);
  header.classList.add("active");
  body.style.display = "block";
  body.innerHTML = buildAgentDetailHTML(agent);
}

function buildAgentDetailHTML(agent){
  const { sections, today, schedule, dates, delay30, delayHold, targetCompletedToday, DELAY_PENALTY, rawLog } = lastCtx;
  const inb = sections["상담인입"]?.[agent]?.[today];
  const comp = sections["상담완료"]?.[agent]?.[today];
  const procRate = clampPct(sections["상담처리율_%"]?.[agent]?.[today]);
  const compRate = clampPct(sections["상담완료율_%"]?.[agent]?.[today]);
  const delay = sections["30분 이상 지연"]?.[agent]?.[today];
  const cph = sections["CPH(생산성)"]?.[agent]?.[today];
  const cast = sections["Cast(평점)"]?.[agent]?.[today];
  const workStatus = schedule?.schedule?.[agent]?.[today];
  const isOff = workStatus && OFF_STATUSES.includes(workStatus);
  const unprocessedTickets = (rawLog||[]).filter(r => r.agent === agent && r.date === today && r.direction === "INBOUND" && r.state && UNPROCESSED_STATES.includes(r.state.toLowerCase()));
  const unprocessed = unprocessedTickets.length;

  // 근무일 기반 생산성: 최근 기간 중 근무일수 대비 평균 처리 건수
  const workDays = dates.filter(d => {
    const st = schedule?.schedule?.[agent]?.[d];
    return st && !OFF_STATUSES.includes(st);
  }).length;
  const totalCompleted = sum(dates.map(d => sections["상담완료"]?.[agent]?.[d] || 0));
  const productivity = workDays > 0 ? totalCompleted / workDays : null;

  // 생산성 점수(목표 기반) - 처리량(60%) + 신속성(40%), 휴무자는 대상 제외
  const scoreVolume = isOff ? null : (targetCompletedToday>0 ? Math.min(100, ((comp||0) / targetCompletedToday) * 100) : 0);
  const scoreSpeed = isOff ? null : Math.max(0, 100 - (delay||0)*DELAY_PENALTY);
  const scoreTotal = isOff ? null : (scoreVolume*0.6 + scoreSpeed*0.4);
  const castRefScore = (cast!=null) ? Math.min(100, (cast / 5.0) * 100) : null; // 참고용, 종합점수에는 미반영

  function mdSortKey(md){ if (!md) return 0; const [m,d] = md.split("/").map(Number); return m*100+d; }
  const delay30Rows = delay30.filter(r => r.agent === agent && r.date === today).sort((a,b) => mdSortKey(b.date) - mdSortKey(a.date));
  const delayHoldRows = delayHold.filter(r => r.agent === agent && r.date === today).sort((a,b) => mdSortKey(b.date) - mdSortKey(a.date));

  function subTable(rows, emptyMsg){
    if (!rows.length) return `<div style="color:var(--ink-dim);font-size:12px;padding:8px 0;">${emptyMsg}</div>`;
    const shown = rows.slice(0, 10);
    return `
      <table style="font-size:12px;">
        <thead><tr><th>날짜</th><th>사업장</th><th>소요시간</th><th>사유</th><th>링크</th></tr></thead>
        <tbody>
          ${shown.map(r => `<tr>
            <td>${dateWithDay(r.date)}</td><td style="text-align:left;">${r.store||'-'}</td><td>${r.duration||'-'}</td>
            <td style="text-align:left;">${r.reason||'-'}</td>
            <td>${r.url ? `<a href="${r.url}" target="_blank" style="color:var(--accent);">보기</a>` : '-'}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      ${rows.length > 10 ? `<div style="color:var(--ink-dim);font-size:11.5px;margin-top:6px;">전체 ${rows.length}건 중 최근 10건 표시</div>` : ""}
    `;
  }

  const agentDelayRate = (comp!=null && comp>0 && delay!=null) ? delay/comp : null;
  const agentOverTarget = agentDelayRate!=null && agentDelayRate > 0.03;

  return `
    ${workStatus ? `<div style="margin-bottom:12px;font-size:12.5px;color:var(--ink-dim);">오늘 근무 상태: <span style="color:${scheduleStatusColor(workStatus)};font-weight:600;">${workStatus}</span></div>` : ""}
    <div class="acc-kpis">
      <div class="acc-kpi"><div class="l">상담인입</div><div class="v">${fmtNum(inb)}</div></div>
      <div class="acc-kpi"><div class="l">상담완료</div><div class="v">${fmtNum(comp)}</div></div>
      <div class="acc-kpi"><div class="l">미처리</div><div class="v">${fmtNum(unprocessed)}</div></div>
      <div class="acc-kpi"><div class="l">처리율</div><div class="v">${fmtPct(procRate)}</div></div>
      <div class="acc-kpi"><div class="l">완료율</div><div class="v">${fmtPct(compRate)}</div></div>
      <div class="acc-kpi"><div class="l">30분 이상 지연</div><div class="v">${fmtNum(delay)}</div></div>
      <div class="acc-kpi"><div class="l">지연율 (목표 3%)</div><div class="v" style="color:${agentDelayRate==null?'inherit':(agentOverTarget?'var(--bad)':'var(--good)')};">${agentDelayRate!=null ? fmtPct(agentDelayRate) : "-"}</div></div>
      <div class="acc-kpi"><div class="l">CPH(원본)</div><div class="v">${cph!=null ? fmtNum(cph) : "-"}</div></div>
      <div class="acc-kpi"><div class="l">근무일 기준 생산성</div><div class="v">${productivity!=null ? productivity.toFixed(1)+'건/일' : '-'}</div></div>
    </div>

    <div style="margin-top:6px;font-size:13px;font-weight:600;">생산성 점수 (목표 기반) <span style="font-weight:400;color:var(--ink-dim);font-size:11.5px;">· ${dateLabel(today)} 기준</span></div>
    ${isOff ? `
      <div style="margin-top:10px;padding:14px;background:var(--panel-2);border-radius:8px;color:var(--accent);font-size:13px;">오늘은 "${workStatus}"로 근무일이 아니라 생산성 점수 대상에서 제외됩니다.</div>
    ` : `
      <div class="acc-kpis" style="margin-top:10px;">
        <div class="acc-kpi"><div class="l">처리량 점수 (60%)</div><div class="v">${scoreVolume.toFixed(0)}</div></div>
        <div class="acc-kpi"><div class="l">신속성 점수 (40%)</div><div class="v">${scoreSpeed.toFixed(0)}</div></div>
        <div class="acc-kpi" style="background:var(--panel-2);"><div class="l">종합 점수</div><div class="v" style="color:var(--accent);">${scoreTotal.toFixed(1)}</div></div>
        <div class="acc-kpi"><div class="l">평점(Cast) <span style="font-size:9.5px;">참고·미반영</span></div><div class="v">${castRefScore!=null?castRefScore.toFixed(0):'-'}</div></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-dim);margin-top:8px;line-height:1.6;">
        처리량 = 완료건수 ÷ 근무자 평균 완료건수(${targetCompletedToday.toFixed(1)}, 목표) × 100 (최대 100) · 신속성 = 100 − (지연 건수 × ${DELAY_PENALTY})
      </div>
    `}

    <div style="margin-top:18px;font-size:13px;font-weight:600;">30분 이상 지연 상세</div>
    ${subTable(delay30Rows, "해당 상담원의 30분 이상 지연 기록이 없습니다.")}
    <div style="margin-top:18px;font-size:13px;font-weight:600;">응대지연(2시간 이상) 상세</div>
    ${subTable(delayHoldRows, "해당 상담원의 2시간 이상 응대지연 기록이 없습니다.")}

    <div style="margin-top:18px;font-size:13px;font-weight:600;">미처리 상세 <span style="font-weight:400;color:var(--ink-dim);font-size:11.5px;">(인바운드 · 미종결 건)</span></div>
    ${unprocessedTickets.length ? `
      <table style="font-size:12px;">
        <thead><tr><th>사업장</th><th>상태</th><th>시간</th><th>링크</th></tr></thead>
        <tbody>
          ${unprocessedTickets.slice(0,20).map(t => `<tr><td style="text-align:left;">${t.store||'-'}</td><td style="text-align:left;">${STATE_LABELS[t.state?.toLowerCase()] || t.state || '-'}</td><td>${String(t.hour).padStart(2,'0')}시</td>
            <td>${t.url ? `<a href="${t.url}" target="_blank" style="color:var(--accent);">보기</a>` : '-'}</td></tr>`).join("")}
        </tbody>
      </table>
      ${unprocessedTickets.length > 20 ? `<div style="color:var(--ink-dim);font-size:11.5px;margin-top:6px;">전체 ${unprocessedTickets.length}건 중 20건 표시</div>` : ""}
    ` : `<div style="color:var(--ink-dim);font-size:12px;padding:8px 0;">오늘 미처리 건이 없습니다.</div>`}
  `;
}

/* ===================== 갱신 로직 ===================== */
// 원칙: 화면은 "데이터가 실제로 바뀌었을 때만" 다시 그린다. 주기적으로 시트를 확인하되 변경이 없으면 화면을 건드리지 않음.
let lastCheckedAt = null, lastChangedAt = null, mainRefreshing = false, rawRefreshing = false, mainSig = null, rawSig = null, firstPaintDone = false;
function hhmm(d){ return d ? d.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" }) : "-"; }
function updateStatusLabel(){
  const el = document.getElementById("lastUpdated");
  if (el) el.textContent = `최근 확인 ${hhmm(lastCheckedAt)} · 데이터 반영 ${hhmm(lastChangedAt)} (변경 시에만 화면 갱신)`;
}
function startCountdown(){ updateStatusLabel(); } // (구 카운트다운) - 렌더 때 상태 문구만 갱신
function sigOf(str){ let h = 0; for (let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; } return str.length + ":" + h; }
function rawSigOf(rawLog){ return sigOf(rawLog.map(r => r.date + r.hour + r.agent + r.state + r.vip + (r.utags||"")).join("|")); }
// 백그라운드 갱신: 스크롤 위치 유지 + 그래프 애니메이션 없이 조용히 교체
function quietRender(){
  if (!lastLoadedData) return;
  const y = window.scrollY;
  const prevAnim = Chart.defaults.animation;
  Chart.defaults.animation = false;
  try { render(lastLoadedData); } finally { Chart.defaults.animation = prevAnim; }
  window.scrollTo(0, y);
}

/* ---- 브라우저 캐시 (IndexedDB): 재방문 시 직전 데이터를 즉시 표시하고, 최신 데이터는 뒤에서 받아 교체 ---- */
const CACHE_DB = "cx-dashboard-cache", CACHE_STORE = "kv";
function cacheDb(){
  return new Promise((res, rej) => {
    try {
      const req = indexedDB.open(CACHE_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(CACHE_STORE);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    } catch(e){ rej(e); }
  });
}
async function cacheGet(key){
  try { const db = await cacheDb(); return await new Promise(res => { const r = db.transaction(CACHE_STORE).objectStore(CACHE_STORE).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }
  catch(e){ return null; }
}
async function cacheSet(key, val){
  try { const db = await cacheDb(); db.transaction(CACHE_STORE, "readwrite").objectStore(CACHE_STORE).put(val, key); }
  catch(e){ /* 캐시는 편의 기능 - 실패해도 무시 */ }
}

async function refresh(manual){
  if (mainRefreshing) return;
  mainRefreshing = true;
  try{
    const main = await loadMainData();
    const sig = sigOf(JSON.stringify(main));
    lastCheckedAt = new Date();
    if (manual || sig !== mainSig){
      mainSig = sig; lastChangedAt = new Date();
      lastLoadedData = { ...main, rawLog: lastLoadedData?.rawLog || [] };
      manual ? render(lastLoadedData) : quietRender();
      cacheSet("main", main);
    }
  }catch(e){
    console.error(e);
    if (manual && !lastLoadedData) alert("데이터를 불러오지 못했습니다: " + e.message);
  }finally{ mainRefreshing = false; updateStatusLabel(); }
}

async function refreshRawLog(manual){
  if (rawRefreshing) return;
  rawRefreshing = true;
  try {
    const rawLog = await loadRawLog();
    if (!rawLog.length && lastLoadedData?.rawLog?.length) return; // 실패 시 기존 데이터 유지
    const sig = rawSigOf(rawLog);
    if (manual || sig !== rawSig){
      rawSig = sig; lastChangedAt = new Date();
      if (lastLoadedData){ lastLoadedData.rawLog = rawLog; manual ? render(lastLoadedData) : quietRender(); }
      cacheSet("raw_v2", { rows: rawLog.slice(), hasVipTags: rawLog.hasVipTags });
    }
    return rawLog;
  } finally { rawRefreshing = false; updateStatusLabel(); }
}

async function initialLoad(){
  // 1) RAW(대용량)와 메인 시트를 동시에 요청 시작
  const rawPromise = loadRawLog();
  const mainPromise = loadMainData();
  // 2) 직전 방문 데이터가 있으면 먼저 화면에 표시
  const [cMain, cRaw] = await Promise.all([cacheGet("main"), cacheGet("raw_v2")]);
  if (cMain && !lastLoadedData){
    const rl = cRaw && cRaw.rows ? cRaw.rows : [];
    if (cRaw) rl.hasVipTags = cRaw.hasVipTags;
    lastLoadedData = { ...cMain, rawLog: rl };
    try { render(lastLoadedData); firstPaintDone = true; } catch(e){ console.warn("캐시 렌더 실패", e); lastLoadedData = null; }
  }
  // 3) 최신 메인 데이터 반영 (캐시와 같으면 다시 그리지 않음)
  try {
    const main = await mainPromise;
    const sig = sigOf(JSON.stringify(main));
    const cacheSame = cMain && sigOf(JSON.stringify(cMain)) === sig;
    mainSig = sig; lastCheckedAt = new Date(); lastChangedAt = new Date();
    lastLoadedData = { ...main, rawLog: lastLoadedData?.rawLog || [] };
    if (!firstPaintDone){ render(lastLoadedData); firstPaintDone = true; }
    else if (!cacheSame) quietRender();
    cacheSet("main", main);
  } catch(e){ console.error(e); if (!lastLoadedData) alert("데이터를 불러오지 못했습니다: " + e.message); }
  // 4) 최신 RAW 반영 (바뀐 경우에만)
  const rawLog = await rawPromise;
  if (lastLoadedData && (rawLog.length || !lastLoadedData.rawLog.length)){
    const sig = rawSigOf(rawLog);
    const prevSig = lastLoadedData.rawLog.length ? rawSigOf(lastLoadedData.rawLog) : null;
    rawSig = sig;
    if (sig !== prevSig){ lastLoadedData.rawLog = rawLog; quietRender(); cacheSet("raw_v2", { rows: rawLog.slice(), hasVipTags: rawLog.hasVipTags }); }
  }
  updateStatusLabel();
  // 5) 주기 확인: 창이 보일 때만 (백그라운드 탭에서는 쉬고, 다시 볼 때 오래됐으면 1회 확인)
  setInterval(() => { if (!document.hidden) refresh(false); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden) refreshRawLog(false); }, RAWLOG_REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && lastCheckedAt && Date.now() - lastCheckedAt.getTime() > REFRESH_MS) refresh(false);
  });
}

initialLoad();
</script>

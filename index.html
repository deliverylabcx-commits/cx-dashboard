<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CX 생산성 · CS/아웃콜 트래킹 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0F1729; --panel:#16213A; --panel-2:#1C2A47;
    --ink:#E8ECF4; --ink-dim:#8B96AD; --line:#28324D;
    --accent:#E8A33D; --good:#2FBF8F; --bad:#F0555B;
    --c-punisher:#4C6EF5; --c-maru:#12B886; --c-zenze:#F76707;
    --c-tsuna:#BE4BDB; --c-hugo:#FA5252; --c-carol:#748FFC;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);}
  .wrap{max-width:1320px;margin:0 auto;padding:28px 20px 60px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-0.02em;}
  .sub{color:var(--ink-dim);font-size:13px;margin-top:4px;}
  .status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-dim);flex-wrap:wrap;}
  input[type="date"]{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;font-family:inherit;color-scheme:dark;}
  .badge{padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-good{background:#123A2E;color:var(--good);}
  .badge-bad{background:#3A1A1C;color:var(--bad);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
  button:hover{border-color:var(--accent);}
  .banner{background:#3A2A14;border:1px solid #6B4A1E;color:#F2C57C;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:18px;line-height:1.6;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .kpi .label{font-size:12px;color:var(--ink-dim);margin-bottom:8px;}
  .kpi .val{font-size:26px;font-weight:700;letter-spacing:-0.02em;}
  .kpi .delta{font-size:12px;margin-top:6px;}
  .delta.up{color:var(--good);} .delta.down{color:var(--bad);}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
  .grid1{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;}
  .card h2{font-size:14px;margin:0 0 14px;font-weight:600;color:var(--ink);}
  .card h2 .tag{font-size:11px;color:var(--ink-dim);font-weight:400;margin-left:6px;}
  canvas{max-height:280px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;color:var(--ink-dim);}
  th{color:var(--ink-dim);font-weight:500;font-size:12px;}
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab{padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--ink-dim);border:1px solid transparent;}
  .tab.active{background:var(--panel-2);color:var(--ink);border-color:var(--line);}
  .footer-note{color:var(--ink-dim);font-size:11.5px;margin-top:30px;line-height:1.7;}
  .loading{padding:60px;text-align:center;color:var(--ink-dim);}
  .acc-item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .acc-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s;}
  .acc-header:hover{background:var(--panel-2);}
  .acc-header.active{background:var(--panel-2);}
  .acc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .acc-name{font-weight:600;font-size:13.5px;min-width:80px;}
  .acc-summary{color:var(--ink-dim);font-size:12px;flex:1;}
  .acc-chev{color:var(--ink-dim);font-size:12px;transition:transform .15s;}
  .acc-header.active .acc-chev{transform:rotate(180deg);}
  .acc-body{display:none;padding:16px;border-top:1px solid var(--line);background:#121C33;}
  .acc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
  .acc-kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .acc-kpi .l{font-size:11px;color:var(--ink-dim);margin-bottom:4px;}
  .acc-kpi .v{font-size:17px;font-weight:700;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">데이터를 불러오는 중입니다…</div>
</div>

<script>
/* ===================== 설정 ===================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMH_aldIZFeAf8wQJYSdZjnRVdn-WrXt2j3Yw984DdJf1It0FPyRCruUyE1Vli6mDMeuCtev_52_LR/pub?output=csv";
const SCHEDULE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTjti7FdTYQVky3fer7jhzdfQxh5AXJeFWNi-Nt6WkomVsBRbf-NsheB4KLnJ1EpYY97an7--YqNn7I/pub?gid=0&single=true&output=csv";
const OUTCALL_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMH_aldIZFeAf8wQJYSdZjnRVdn-WrXt2j3Yw984DdJf1It0FPyRCruUyE1Vli6mDMeuCtev_52_LR/pub?gid=25550252&single=true&output=csv";
const DELAY30_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMH_aldIZFeAf8wQJYSdZjnRVdn-WrXt2j3Yw984DdJf1It0FPyRCruUyE1Vli6mDMeuCtev_52_LR/pub?gid=1307884512&single=true&output=csv";
const DELAYHOLD_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMH_aldIZFeAf8wQJYSdZjnRVdn-WrXt2j3Yw984DdJf1It0FPyRCruUyE1Vli6mDMeuCtev_52_LR/pub?gid=634573420&single=true&output=csv";
const RAWLOG_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMH_aldIZFeAf8wQJYSdZjnRVdn-WrXt2j3Yw984DdJf1It0FPyRCruUyE1Vli6mDMeuCtev_52_LR/pub?gid=0&single=true&output=csv";
const SCHEDULE_NAME_MAP = { Sense: "Zenze", Maru: "maru" }; // 스케줄 시트 표기 → CS_Tracking 표기로 정규화
const OFF_STATUSES = ["휴무","연차","오후 반차","오후 반반차","대체휴무"]; // 근무 아닌 상태로 취급
const UNPROCESSED_STATES = ["missed","opened","snoozed"]; // 미처리로 집계할 상태값 (closed=종료, initial=미배정 대기는 제외)
const STATE_LABELS = { closed:"종료", missed:"미처리 상담", initial:"인입 대기", opened:"처리중", snoozed:"보류" };
const REFRESH_MS = 3 * 60 * 1000; // 3분마다 자동 갱신 (CS/스케줄/아웃콜/지연 시트)
const RAWLOG_REFRESH_MS = 30 * 60 * 1000; // RAW 로그는 용량이 커서 30분마다만 갱신
const HEADER_ROW = 3; // 0-indexed row containing 담당자/ETC + 실제 M/D 날짜
const KNOWN_SECTIONS = ["상담인입","상담완료","상담처리율_%","상담완료율_%","30분 이상 지연","CPH(생산성)","Cast(평점)","카테고리별 이슈"];
const AGENT_COLORS = { Punisher:"#4C6EF5", maru:"#12B886", Zenze:"#F76707", Tsuna:"#BE4BDB", Hugo:"#FA5252", Carol:"#748FFC" };
const AGENT_ORDER = ["Punisher","maru","Zenze","Tsuna","Hugo","Carol"];

let charts = {}; // keep instances to destroy on refresh
let countdownTimer = null;
let lastCtx = null; // { dates, sections, agents, today, yday } for accordion drill-down
let agentDetailChart = null;
let openAgentPanel = null;
let selectedDateOverride = null; // 캘린더에서 사용자가 고른 날짜 (M/D). null이면 최신 활동일 사용
let lastLoadedData = null; // 마지막으로 fetch한 원본 데이터 (재렌더용, refetch 없이)
let viewMode = "daily"; // "daily" | "weekly"
let selectedWeekMonday = null; // 주간 리포트에서 선택된 주의 월요일 날짜 (M/D)

/* ===================== 파싱 ===================== */
function parseCSV(text){
  const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
  const rows = parsed.data;
  const header = rows[HEADER_ROW] || [];
  const dateRe = /^\d{1,2}\/\d{1,2}$/;
  const dateCols = [];
  header.forEach((cell, idx) => {
    const v = (cell || "").trim();
    if (dateRe.test(v)) dateCols.push({ col: idx, date: v });
  });

  const sections = {};
  let totalRow = null;
  let currentSection = null;
  const SECTION_ROW_LIMITS = { "카테고리별 이슈": 8 }; // 이 섹션은 정확히 8개 카테고리로 끝남 - 이후 행(예: WOW 델타 등)이 같은 라벨을 재사용해도 오염되지 않도록 위치 기반으로 차단
  let sectionRowCount = 0;

  for (let r = HEADER_ROW + 1; r < rows.length; r++){
    const row = rows[r];
    if (!row || row.length < 3) continue;
    const col1 = (row[1] || "").trim();
    const col2 = (row[2] || "").trim();

    if (col1 === "Catagory" && col2 === "상담인입_Total"){
      totalRow = {};
      dateCols.forEach(({col,date}) => { totalRow[date] = toNum(row[col]); });
      continue;
    }
    if (/wow/i.test(col1)) break; // WOW_Tarcking 부속 섹션은 상담인입/30분 이상 지연/카테고리별 이슈 라벨을 재사용해 델타값을 적어두므로, 여기부터는 파싱을 완전히 중단해 실제 데이터가 델타값으로 덮어써지는 것을 막는다
    if (col1){
      if (KNOWN_SECTIONS.includes(col1)){ currentSection = col1; sectionRowCount = 0; }
      else if (col1 !== "완료건 대비 3%") currentSection = null; // 알려진 주석 행은 무시, 그 외 미확인 라벨은 새 섹션 시작으로 간주
    }
    if (!currentSection || !col2) continue;

    const limit = SECTION_ROW_LIMITS[currentSection];
    if (limit != null && sectionRowCount >= limit){
      currentSection = null; // 정해진 행 수를 넘어서면 이후 같은 라벨의 다른 섹션(WOW 델타 등)으로 간주해 더 이상 수집하지 않음
      continue;
    }

    sections[currentSection] = sections[currentSection] || {};
    sections[currentSection][col2] = {};
    dateCols.forEach(({col,date}) => { sections[currentSection][col2][date] = toNum(row[col]); });
    if (limit != null) sectionRowCount++;
  }

  return { dates: dateCols.map(d=>d.date), sections, totalRow };
}

function toNum(v){
  v = (v||"").trim();
  if (v === "" || v === "-") return null;
  if (v.endsWith("%")) return parseFloat(v)/100;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

/* ===================== 스케줄 시트 파싱 ===================== */
function parseSchedule(text){
  const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
  const rows = parsed.data;
  const headerIdx = rows.findIndex(r => (r[1] || "").trim() === "Name");
  if (headerIdx < 0) return { dates: [], schedule: {}, minStaff: {}, totalStaff: {}, issueStatus: {} };

  const header = rows[headerIdx];
  const dateRe = /^\d{1,2}\/\d{1,2}$/;
  const dateCols = [];
  header.forEach((cell, idx) => {
    const v = (cell || "").trim();
    if (dateRe.test(v)) dateCols.push({ col: idx, date: v });
  });

  const schedule = {}, minStaff = {}, totalStaff = {}, issueStatus = {};
  let expectIssueNext = false;

  for (let r = headerIdx + 1; r < rows.length; r++){
    const row = rows[r];
    if (!row) continue;
    const label = (row[1] || "").trim();
    if (label === "최소 근무인원"){
      dateCols.forEach(({col,date}) => { minStaff[date] = toNum(row[col]); });
      continue;
    }
    if (label === "총 근무인원"){
      dateCols.forEach(({col,date}) => { totalStaff[date] = toNum(row[col]); });
      expectIssueNext = true;
      continue;
    }
    if (expectIssueNext){
      dateCols.forEach(({col,date}) => { issueStatus[date] = (row[col]||"").trim(); });
      break; // Lunch rotation 등 이후 섹션은 사용하지 않음
    }
    if (label){
      const norm = SCHEDULE_NAME_MAP[label] || label;
      schedule[norm] = {};
      dateCols.forEach(({col,date}) => { schedule[norm][date] = (row[col]||"").trim(); });
    }
  }

  return { dates: dateCols.map(d=>d.date), schedule, minStaff, totalStaff, issueStatus };
}

/* ===================== Out Call_Tracking 파싱 (카테고리 > Total/상담원 > 인입/통화완료/미처리) ===================== */
function parseOutCall(text){
  const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
  const rows = parsed.data;
  const headerIdx = rows.findIndex(r => (r[1] || "").trim() === "Catagory");
  if (headerIdx < 0) return { dates: [], categories: [], data: {} };

  const header = rows[headerIdx];
  const dateRe = /^\d{1,2}\/\d{1,2}$/;
  const dateCols = [];
  header.forEach((cell, idx) => {
    const v = (cell || "").trim();
    if (dateRe.test(v)) dateCols.push({ col: idx, date: v });
  });

  const data = {};
  const categories = [];
  let currentCategory = null, currentEntity = null;

  for (let r = headerIdx + 1; r < rows.length; r++){
    const row = rows[r];
    if (!row || row.length < 3) continue;
    const col1 = (row[1] || "").trim();
    const col2 = (row[2] || "").trim();
    if (!col1 && !col2) continue;
    if (col1){ currentCategory = col1; if (!categories.includes(col1)) categories.push(col1); }
    if (!currentCategory || !col2) continue;

    let metric;
    if (col2.startsWith("ㄴ")){
      metric = col2.replace("ㄴ", "").replace(/\(.+\)/, "").trim(); // 통화완료 / 통화완료_% / 미처리 / 미처리_%
    } else {
      currentEntity = col2; // Total 또는 상담원 이름
      metric = "인입";
    }
    data[currentCategory] = data[currentCategory] || {};
    data[currentCategory][currentEntity] = data[currentCategory][currentEntity] || {};
    data[currentCategory][currentEntity][metric] = {};
    dateCols.forEach(({col,date}) => { data[currentCategory][currentEntity][metric][date] = toNum(row[col]); });
  }

  return { dates: dateCols.map(d=>d.date), categories, data };
}

/* ===================== 지연 로우데이터 파싱 (30분 지연 체크 / 응대지연_보류 공용) ===================== */
function parseDelayRows(text){
  const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
  const rows = parsed.data;
  const headerIdx = rows.findIndex(r => (r[0] || "").trim() === "Date");
  if (headerIdx < 0) return [];
  const header = rows[headerIdx].map(h => (h||"").trim());
  const idx = {
    date: header.indexOf("Date"),
    agent: header.indexOf("당당자") >= 0 ? header.indexOf("당당자") : header.indexOf("담당자"),
    store: header.indexOf("사업장"),
    tag: header.indexOf("태그"),
    duration: header.indexOf("소요시간"),
    url: header.indexOf("채널톡 Url"),
    reason: header.indexOf("사유") >= 0 ? header.indexOf("사유") : header.indexOf("이슈"),
  };
  const dateRe = /^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})$/;
  const out = [];
  for (let r = headerIdx + 1; r < rows.length; r++){
    const row = rows[r];
    if (!row) continue;
    const raw = (row[idx.date] || "").trim();
    const m = raw.match(dateRe);
    if (!m) continue;
    out.push({
      date: `${parseInt(m[2])}/${parseInt(m[3])}`,
      agent: (row[idx.agent] || "").trim(),
      store: (row[idx.store] || "").trim(),
      tag: (row[idx.tag] || "").trim(),
      duration: (row[idx.duration] || "").trim(),
      url: (row[idx.url] || "").trim(),
      reason: (row[idx.reason] || "").trim(),
    });
  }
  return out;
}

/* ===================== 원본 이벤트 로그 파싱 (시간대별 인입 분석용) ===================== */
function parseRawLog(text){
  const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
  const rows = parsed.data;
  const headerIdx = rows.findIndex(r => r.includes("createdAt"));
  if (headerIdx < 0) return [];
  const header = rows[headerIdx].map(h => (h||"").trim());
  const idx = {
    agent: header.indexOf("담당자"),
    createdAt: header.indexOf("createdAt"),
    name: header.indexOf("name"),
    state: header.indexOf("state"),
    direction: header.indexOf("direction"),
  };
  const URL_COL_INDEX = 97; // 98번째 컬럼(1-indexed) = 채널톡 URL
  const createdAtRe = /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/;
  const out = [];
  for (let r = headerIdx + 1; r < rows.length; r++){
    const row = rows[r];
    if (!row) continue;
    const raw = (row[idx.createdAt] || "").trim();
    const m = raw.match(createdAtRe);
    if (!m) continue;
    out.push({
      date: `${parseInt(m[2])}/${parseInt(m[3])}`,
      hour: parseInt(m[4]),
      agent: (row[idx.agent] || "").trim(),
      store: idx.name>=0 ? (row[idx.name] || "").trim() : "",
      state: idx.state>=0 ? (row[idx.state] || "").trim() : "",
      direction: idx.direction>=0 ? (row[idx.direction] || "").trim() : "",
      url: (row[URL_COL_INDEX] || "").trim(),
    });
  }
  return out;
}

/* ===================== 데이터 로드 ===================== */
async function fetchCSV(url){
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("시트를 불러오지 못했습니다 (" + res.status + ")");
  return res.text();
}

async function loadMainData(){
  const csText = await fetchCSV(CSV_URL);
  let schedule = { dates: [], schedule: {}, minStaff: {}, totalStaff: {}, issueStatus: {} };
  let outcall = { dates: [], categories: [], data: {} };
  let delay30 = [];
  let delayHold = [];

  try { schedule = parseSchedule(await fetchCSV(SCHEDULE_CSV_URL)); }
  catch(e){ console.warn("스케줄 시트를 불러오지 못했습니다:", e.message); }

  try { outcall = parseOutCall(await fetchCSV(OUTCALL_CSV_URL)); }
  catch(e){ console.warn("Out Call_Tracking 시트를 불러오지 못했습니다:", e.message); }

  try { delay30 = parseDelayRows(await fetchCSV(DELAY30_CSV_URL)); }
  catch(e){ console.warn("30분 지연 체크 시트를 불러오지 못했습니다:", e.message); }

  try { delayHold = parseDelayRows(await fetchCSV(DELAYHOLD_CSV_URL)); }
  catch(e){ console.warn("응대지연_보류 시트를 불러오지 못했습니다:", e.message); }

  return { ...parseCSV(csText), schedule, outcall, delay30, delayHold };
}

async function loadRawLog(){
  try { return parseRawLog(await fetchCSV(RAWLOG_CSV_URL)); }
  catch(e){ console.warn("RAW 로그 시트를 불러오지 못했습니다 (시간대별 분석 제외):", e.message); return []; }
}

/* ===================== 유틸 ===================== */
function lastActiveDateIdx(dates, sections){
  // 그날 최소 한 명이라도 상담인입이 있으면 "활동일"로 간주 (일요일 등 휴무일 제외)
  for (let i = dates.length - 1; i >= 0; i--){
    const d = dates[i];
    const anyActivity = AGENT_ORDER.some(a => (sections["상담인입"]?.[a]?.[d] || 0) > 0);
    if (anyActivity) return i;
  }
  return dates.length - 1;
}
function fmtPct(v){ return v==null ? "-" : Math.round(v*100) + "%"; }
function fmtNum(v){ return v==null ? "-" : Math.round(v).toLocaleString(); }
function sum(arr){ return arr.reduce((a,b)=>a+(b||0),0); }
function clampPct(v){ return v==null ? null : Math.max(0, Math.min(1, v)); } // 0~100% 범위를 벗어난 이상치 값을 조용히 보정

function lerpColor(hex1, hex2, t){
  const c1 = [1,3,5].map(i => parseInt(hex1.slice(i,i+2),16));
  const c2 = [1,3,5].map(i => parseInt(hex2.slice(i,i+2),16));
  const c = c1.map((v,i) => Math.round(v + (c2[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function buildHeatmapHTML(counts, max, rowLabels, labelWidth){
  labelWidth = labelWidth || 28;
  const cellW = 34;
  const hourHeader = Array.from({length:24}, (_,h) => `<div style="width:${cellW}px;text-align:center;font-size:10px;color:var(--ink-dim);flex-shrink:0;">${h}</div>`).join("");
  const rows = rowLabels.map((label, ri) => {
    const cells = counts[ri].map(v => {
      const t = max>0 ? v/max : 0;
      const bg = v>0 ? lerpColor("#241B3A","#8B5CF6", Math.min(1, 0.15+t*0.85)) : "transparent";
      const fg = t>0.55 ? "#fff" : (v>0 ? "#D9D2F0" : "var(--ink-dim)");
      return `<div style="width:${cellW}px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <div style="width:28px;height:22px;border-radius:6px;background:${bg};color:${fg};font-size:10.5px;display:flex;align-items:center;justify-content:center;">${v>0?v:'·'}</div>
      </div>`;
    }).join("");
    return `<div style="display:flex;align-items:center;gap:0;">
      <div style="width:${labelWidth}px;flex-shrink:0;font-size:11px;color:var(--ink-dim);">${label}</div>
      ${cells}
    </div>`;
  }).join("");
  return `
    <div style="overflow-x:auto;padding-bottom:6px;">
      <div style="min-width:${labelWidth+cellW*24}px;">
        <div style="display:flex;align-items:center;gap:0;margin-bottom:4px;">
          <div style="width:${labelWidth}px;flex-shrink:0;"></div>
          ${hourHeader}
        </div>
        ${rows}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--ink-dim);">
      <span>0</span>
      <div style="width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg, ${lerpColor("#241B3A","#8B5CF6",0.15)}, #8B5CF6);"></div>
      <span>${max}</span>
    </div>
  `;
}

const DATA_YEAR = 2026; // 날짜 문자열(M/D)에는 연도가 없어 대시보드가 다루는 2026년으로 고정
const WEEKDAY_KO = ["일","월","화","수","목","금","토"];
function weekdayOf(md){
  const [m,d] = md.split("/").map(Number);
  return new Date(DATA_YEAR, m-1, d).getDay(); // 0=일 ... 6=토
}
function dateLabel(md, opts){
  // opts.html=true면 일요일을 빨간색으로 강조한 span 마크업 반환, 아니면 순수 텍스트
  if (!md) return "-";
  const wd = weekdayOf(md);
  const isSun = wd === 0;
  const text = `${md}(${WEEKDAY_KO[wd]})`;
  if (opts && opts.html){
    return isSun ? `<span style="color:var(--bad);font-weight:600;">${text}</span>` : text;
  }
  return text;
}
function mdToISO(md){
  const [m,d] = md.split("/").map(Number);
  return `${DATA_YEAR}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function addDaysMD(md, n){
  const [m,d] = md.split("/").map(Number);
  const dt = new Date(DATA_YEAR, m-1, d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}
function isoToMD(iso){
  const [,m,d] = iso.split("-").map(Number);
  return `${m}/${d}`;
}
function onDateChange(iso){
  if (!iso || !lastLoadedData) return;
  selectedDateOverride = isoToMD(iso);
  render(lastLoadedData);
}
function resetToLatest(){
  selectedDateOverride = null;
  if (lastLoadedData) render(lastLoadedData);
}

function switchToWeekly(){
  viewMode = "weekly";
  if (lastLoadedData) render(lastLoadedData);
}
function switchToDaily(){
  viewMode = "daily";
  if (lastLoadedData) render(lastLoadedData);
}
function onWeekChange(monday){
  selectedWeekMonday = monday;
  if (lastLoadedData) render(lastLoadedData);
}

// 일요일을 제외한 월~토 단위로 주를 묶는다
function buildWeekList(dates){
  const map = new Map();
  dates.forEach(d => {
    const wd = weekdayOf(d);
    if (wd === 0) return; // 일요일 제외
    const monday = addDaysMD(d, -(wd-1));
    if (!map.has(monday)) map.set(monday, []);
    map.get(monday).push(d);
  });
  const list = [...map.entries()].map(([monday, ds]) => ({
    monday,
    saturday: addDaysMD(monday, 5),
    dates: ds.sort((a,b) => { const [am,ad]=a.split("/").map(Number),[bm,bd]=b.split("/").map(Number); return (am*100+ad)-(bm*100+bd); })
  }));
  list.sort((a,b) => { const [am,ad]=a.monday.split("/").map(Number),[bm,bd]=b.monday.split("/").map(Number); return (am*100+ad)-(bm*100+bd); });
  return list;
}

/* ===================== 렌더 ===================== */
function render(data){
  if (viewMode === "weekly"){ renderWeekly(data); return; }
  const { dates, sections, totalRow, schedule, outcall, delay30, delayHold, rawLog } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);

  let todayIdx;
  if (selectedDateOverride && dates.includes(selectedDateOverride)){
    todayIdx = dates.indexOf(selectedDateOverride);
  } else {
    todayIdx = lastActiveDateIdx(dates, sections);
    selectedDateOverride = null;
  }
  const today = dates[todayIdx];
  const ydayIdx = Math.max(0, todayIdx - 1);
  const yday = dates[ydayIdx];

  // recent window for charts
  const N = 14;
  const start = Math.max(0, todayIdx - N + 1);
  const recentDates = dates.slice(start, todayIdx + 1);
  const weekDates = [-2,-1,0,1,2,3,4,5].map(n => addDaysMD(today, n)); // 근무 스케줄: D-2 ~ D+5

  // 스케줄 정보 (오늘 기준)
  const issueToday = schedule?.issueStatus?.[today];
  const minStaffToday = schedule?.minStaff?.[today];
  const totalStaffToday = schedule?.totalStaff?.[today];
  const isUnderstaffed = issueToday === "정원 미달";

  // 음수 이상치는 조용히 0으로 보정 (경영진 화면이라 경고 문구는 노출하지 않음)
  function clampNeg(raw){ return (raw != null && raw < 0) ? 0 : raw; }

  const inboundAgentsSum = clampNeg(sum(agents.map(a => sections["상담인입"][a][today])));
  const inboundYdayAgentsSum = sum(agents.map(a => sections["상담인입"][a][yday]));
  const inboundToday = inboundAgentsSum; // 담당자(5명) 합산 기준 - Carol/송송/미배정 등은 제외
  const inboundYday = inboundYdayAgentsSum;
  const completeToday = clampNeg(sum(agents.map(a=>sections["상담완료"]?.[a]?.[today])));
  const completeRateToday = clampPct(sections["상담완료율_%"]?.["Total"]?.[today]);
  const delayToday = clampNeg(sum(agents.map(a=>sections["30분 이상 지연"]?.[a]?.[today])));
  const DELAY_TARGET_RATE = 0.03; // 완료건 대비 3% 목표
  const delayRateToday = (completeToday!=null && completeToday>0) ? delayToday/completeToday : null;
  const delayOverTarget = delayRateToday!=null && delayRateToday > DELAY_TARGET_RATE;
  const avgProcessToday = clampPct(sections["상담처리율_%"]?.["AVG"]?.[today]);

  // WoW: 오늘 vs 7일 전 같은 요일 (전체 인입 합계 기준)
  const wowIdx = todayIdx - 7;
  const wowDate = dates[wowIdx];
  const inboundWow = wowDate!=null ? sum(agents.map(a=>sections["상담인입"][a][wowDate])) : null;
  const wowDelta = inboundWow!=null && inboundWow>0 ? ((inboundToday-inboundWow)/inboundWow) : null;

  // 통화완료율 WoW
  const completeRateWow = wowDate!=null ? clampPct(sections["상담완료율_%"]?.["Total"]?.[wowDate]) : null;
  const completeRateDelta = (completeRateToday!=null && completeRateWow!=null) ? (completeRateToday - completeRateWow) : null;

  // 평균 담당자별 인입량 (개별 상담원 배정 건 기준 / 오늘 / 전주 동요일)
  const inboundAgentsWow = wowDate!=null ? sum(agents.map(a=>sections["상담인입"][a][wowDate])) : null;
  const avgPerAgentToday = agents.length ? inboundAgentsSum / agents.length : null;
  const avgPerAgentWow = (inboundAgentsWow!=null && agents.length) ? inboundAgentsWow / agents.length : null;
  const avgPerAgentDelta = (avgPerAgentWow!=null && avgPerAgentWow>0) ? ((avgPerAgentToday-avgPerAgentWow)/avgPerAgentWow) : null;

  // 아웃콜 완료율 (오늘 / 전주 동요일) - 전 카테고리 합산 가중평균
  function outcallCompletionRate(date){
    if (!outcall || !outcall.data) return { rate: null, inbound: 0, completed: 0 };
    let inbound = 0, completed = 0;
    Object.values(outcall.data).forEach(entities => {
      const t = entities["Total"];
      if (!t) return;
      inbound += t["인입"]?.[date] || 0;
      completed += t["통화완료"]?.[date] || 0;
    });
    return { rate: inbound>0 ? completed/inbound : null, inbound, completed };
  }
  const outcallToday = outcallCompletionRate(today);

  // 팀원당 평균 지표
  const avgCompletePerAgent = agents.length ? completeToday/agents.length : null;
  const avgOutcallPerAgent = agents.length ? outcallToday.completed/agents.length : null;

  // 30분 이상 지연 WoW (Total 기준, 감소가 개선이므로 색상 반대로 적용)
  const delayWowRaw = wowDate!=null ? (sections["30분 이상 지연"]?.["Total"]?.[wowDate] ?? sum(agents.map(a=>sections["30분 이상 지연"]?.[a]?.[wowDate]))) : null;
  const delayWow = (delayWowRaw != null && delayWowRaw < 0) ? 0 : delayWowRaw;
  let delayDelta = null;
  let delayDeltaText = "전주 데이터 없음";
  let delayDeltaClass = "";
  if (delayWow != null){
    if (delayWow === 0){
      if (delayToday === 0){ delayDelta = 0; delayDeltaText = "전주 대비 변화 없음 (0건)"; delayDeltaClass = "up"; }
      else { delayDelta = null; delayDeltaText = `전주 0건 → 금주 ${fmtNum(delayToday)}건`; delayDeltaClass = "down"; }
    } else {
      delayDelta = (delayToday-delayWow)/delayWow;
      delayDeltaText = (delayDelta<=0?"▼ ":"▲ ")+Math.abs(Math.round(delayDelta*100))+"% (전주 동요일 대비)";
      delayDeltaClass = delayDelta<=0 ? "up" : "down";
    }
  }

  // 아웃콜 주별 트래킹 (월요일 시작 기준 주 단위, 카테고리별 집계)
  function weekKeyOf(md){
    const [m,d] = md.split("/").map(Number);
    const dt = new Date(DATA_YEAR, m-1, d);
    const day = dt.getDay();
    const diffToMonday = (day===0 ? -6 : 1-day);
    const monday = new Date(dt); monday.setDate(dt.getDate()+diffToMonday);
    return `${monday.getMonth()+1}/${monday.getDate()}`;
  }
  const weeklyByCategory = {}; // category -> weekKey -> {inbound, completed}
  (outcall.categories||[]).forEach(c => { weeklyByCategory[c] = {}; });
  (outcall.dates||[]).forEach(d => {
    const wk = weekKeyOf(d);
    (outcall.categories||[]).forEach(c => {
      weeklyByCategory[c][wk] = weeklyByCategory[c][wk] || { inbound:0, completed:0 };
      const t = outcall.data[c]?.["Total"];
      if (!t) return;
      weeklyByCategory[c][wk].inbound += t["인입"]?.[d] || 0;
      weeklyByCategory[c][wk].completed += t["통화완료"]?.[d] || 0;
    });
  });
  const allWeekKeys = [...new Set((outcall.dates||[]).map(weekKeyOf))].sort((a,b) => {
    const [am,ad] = a.split("/").map(Number), [bm,bd] = b.split("/").map(Number);
    return (am*100+ad) - (bm*100+bd);
  });

  // 카테고리별 이슈 (배송문의/배송클레임/서비스이용문의 등) 랭킹 + WoW + 주별 트렌드
  const issueSection = sections["카테고리별 이슈"] || {};
  const issueCategories = Object.keys(issueSection);
  const issueTodayClamped = {}; // 중복 카운트 방지를 위해 카테고리별로 한 번만 클램프
  issueCategories.forEach(c => { issueTodayClamped[c] = clampNeg(issueSection[c][today] || 0); });
  const issueTodayRanking = issueCategories
    .map(c => ({ category:c, val: issueTodayClamped[c] }))
    .sort((a,b) => b.val - a.val);
  const issueWow = issueCategories.map(c => {
    const t = issueTodayClamped[c];
    const wRaw = wowDate!=null ? (issueSection[c][wowDate] || 0) : null;
    const w = (wRaw != null && wRaw < 0) ? 0 : wRaw;
    const delta = (w!=null && w>0) ? (t-w)/w : null;
    return { category:c, today:t, wow:w, delta };
  });
  const weeklyByIssue = {}; // category -> weekKey -> count
  issueCategories.forEach(c => { weeklyByIssue[c] = {}; });
  dates.forEach(d => {
    const wk = weekKeyOf(d);
    issueCategories.forEach(c => {
      weeklyByIssue[c][wk] = (weeklyByIssue[c][wk] || 0) + (issueSection[c][d] || 0);
    });
  });
  const issueWeekKeys = [...new Set(dates.map(weekKeyOf))].sort((a,b) => {
    const [am,ad] = a.split("/").map(Number), [bm,bd] = b.split("/").map(Number);
    return (am*100+ad) - (bm*100+bd);
  });

  // 시간대별 인입 분포 (오늘 / 최근 기간 평균) - RAW 로그의 createdAt 기준
  const recentDatesSet = new Set(recentDates);
  const hourlyToday = new Array(24).fill(0);
  const hourly2wSum = new Array(24).fill(0);
  const daysWithDataSet = new Set();
  const WEEKDAY_LABELS = ["일","월","화","수","목","금","토"];
  const heatmapSums = Array.from({length:7}, () => new Array(24).fill(0));
  const weekdayDateCount = new Array(7).fill(0); // 요일별로 window 내 며칠이 있었는지 (평균 분모)
  recentDates.forEach(d => { weekdayDateCount[weekdayOf(d)]++; });
  (rawLog||[]).forEach(r => {
    if (r.date === today) hourlyToday[r.hour]++;
    if (recentDatesSet.has(r.date)){
      hourly2wSum[r.hour]++;
      daysWithDataSet.add(r.date);
      const wd = weekdayOf(r.date);
      heatmapSums[wd][r.hour]++;
    }
  });
  const daysWithData = daysWithDataSet.size || 1;
  const hourly2wAvg = hourly2wSum.map(v => v/daysWithData);
  const peakHourToday = hourlyToday.indexOf(Math.max(...hourlyToday));
  const peakHour2w = hourly2wAvg.indexOf(Math.max(...hourly2wAvg));
  const heatmapCounts = heatmapSums.map((row,wd) => row.map(v => weekdayDateCount[wd] > 0 ? Math.round((v/weekdayDateCount[wd])*10)/10 : 0));
  const heatmapMax = Math.max(1, ...heatmapCounts.flat());
  let spikeHour = -1, spikeDiff = 0;
  hourlyToday.forEach((v,h) => {
    const diff = v - hourly2wAvg[h];
    if (diff > spikeDiff){ spikeDiff = diff; spikeHour = h; }
  });

  // 인사이트 카드 자동 생성
  const insights = [];
  {
    const rateEntries = agents
      .filter(a => {
        const workStatus = schedule?.schedule?.[a]?.[today];
        const isOff = workStatus && OFF_STATUSES.includes(workStatus);
        const hasInbound = (sections["상담인입"]?.[a]?.[today] || 0) > 0;
        return !isOff && hasInbound;
      })
      .map(a => [a, sections["상담완료율_%"]?.[a]?.[today]])
      .filter(([,v]) => v!=null);
    if (rateEntries.length){
      const best = rateEntries.reduce((a,b) => b[1]>a[1] ? b : a);
      insights.push(`오늘 완료율 최고 상담원은 <b>${best[0]}</b> (${fmtPct(best[1])})입니다. (근무 중 · 인입 있는 상담원 기준)`);
    }
    const delayByAgent = {};
    delay30.filter(r => r.date === today).forEach(r => { delayByAgent[r.agent] = (delayByAgent[r.agent]||0)+1; });
    const delayEntries = Object.entries(delayByAgent);
    if (delayEntries.length){
      const worst = delayEntries.reduce((a,b) => b[1]>a[1] ? b : a);
      insights.push(`오늘 30분 이상 지연이 가장 많은 상담원은 <b>${worst[0]}</b> (${worst[1]}건)입니다.`);
    } else {
      insights.push(`오늘 30분 이상 지연 건은 없습니다.`);
    }
    if (delayRateToday != null){
      insights.push(delayOverTarget
        ? `오늘 지연율은 완료건 대비 <b>${fmtPct(delayRateToday)}</b>로 목표(3%)를 초과했습니다.`
        : `오늘 지연율은 완료건 대비 <b>${fmtPct(delayRateToday)}</b>로 목표(3%) 이내입니다.`);
    }
    if (outcall && outcall.categories?.length){
      const catRates = outcall.categories.map(c => {
        const t = outcall.data[c]?.["Total"];
        const rate = clampPct(t?.["통화완료_%"]?.[today]);
        return [c, rate];
      }).filter(([,v]) => v!=null);
      if (catRates.length){
        const bestCat = catRates.reduce((a,b) => b[1]>a[1] ? b : a);
        insights.push(`아웃콜 카테고리 중 완료율이 가장 높은 항목은 <b>${bestCat[0]}</b> (${fmtPct(bestCat[1])})입니다.`);
      }
      const unprocessed = outcall.categories.map(c => {
        const t = outcall.data[c]?.["Total"];
        return [c, t?.["미처리"]?.[today]];
      }).filter(([,v]) => v!=null && v>0);
      if (unprocessed.length){
        const worstUnprocessed = unprocessed.reduce((a,b) => b[1]>a[1] ? b : a);
        insights.push(`아웃콜 부재(서베이발송)가 가장 많은 카테고리는 <b>${worstUnprocessed[0]}</b> (${worstUnprocessed[1]}건)입니다.`);
      }
    }
    const inboundRanking = agents.map(a => [a, sections["상담인입"][a][today] || 0]).sort((x,y) => y[1]-x[1]);
    if (inboundRanking.length && inboundRanking[0][1] > 0){
      insights.push(`오늘 인입이 가장 많은 상담원은 <b>${inboundRanking[0][0]}</b> (${fmtNum(inboundRanking[0][1])}건)입니다.`);
    }
    if (isUnderstaffed){
      insights.push(`오늘은 <b>정원 미달</b> 상태입니다 (근무 ${totalStaffToday}명 / 최소 ${minStaffToday}명).`);
    }
    if (issueTodayRanking.length && issueTodayRanking[0].val > 0){
      insights.push(`오늘 가장 많이 발생한 이슈 카테고리는 <b>${issueTodayRanking[0].category}</b> (${fmtNum(issueTodayRanking[0].val)}건)입니다.`);
    }
    const risingIssues = issueWow.filter(x => x.delta!=null && x.delta>0).sort((a,b)=>b.delta-a.delta);
    if (risingIssues.length){
      const r = risingIssues[0];
      insights.push(`전주 동요일 대비 가장 많이 증가한 이슈는 <b>${r.category}</b> (▲ ${Math.round(r.delta*100)}%)입니다.`);
    }
    if (peakHour2w >= 0 && hourly2wAvg[peakHour2w] > 0){
      insights.push(`최근 ${daysWithData}일 평균 기준 인입이 가장 몰리는 시간대는 <b>${peakHour2w}시</b>입니다 (평균 ${hourly2wAvg[peakHour2w].toFixed(1)}건).`);
    }
    if (spikeHour >= 0 && spikeDiff >= 1){
      insights.push(`오늘은 평소보다 <b>${spikeHour}시</b>에 인입이 유독 많았습니다 (오늘 ${hourlyToday[spikeHour]}건 · 평균 ${hourly2wAvg[spikeHour].toFixed(1)}건).`);
    }
  }

  if (agentDetailChart){ agentDetailChart.destroy(); agentDetailChart = null; }
  openAgentPanel = null;

  const app = document.getElementById("app");

/* ===================== 주간 리포트 ===================== */
function renderWeekly(data){
  const { dates, sections, outcall, delay30 } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);
  const weeks = buildWeekList(dates);
  const app = document.getElementById("app");
  if (!weeks.length){ app.innerHTML = '<div class="loading">주간 데이터가 없습니다.</div>'; return; }

  const completeWeeks = weeks.filter(w => w.dates.length === 6);
  const defaultWeek = completeWeeks.length ? completeWeeks[completeWeeks.length-1] : weeks[weeks.length-1];
  if (!selectedWeekMonday || !weeks.find(w => w.monday === selectedWeekMonday)){
    selectedWeekMonday = defaultWeek.monday;
  }
  const wIdx = weeks.findIndex(w => w.monday === selectedWeekMonday);
  const week = weeks[wIdx];
  const prevWeek = wIdx > 0 ? weeks[wIdx-1] : null;

  function cxStats(w){
    if (!w) return null;
    const inbound = sum(w.dates.map(d => sum(agents.map(a => sections["상담인입"][a][d] || 0))));
    const completed = sum(w.dates.map(d => sum(agents.map(a => sections["상담완료"]?.[a]?.[d] || 0))));
    return { inbound, completed, rate: inbound>0 ? completed/inbound : null };
  }
  const cx = cxStats(week);
  const cxPrev = cxStats(prevWeek);
  const cxDiff = (cx && cxPrev) ? cx.inbound - cxPrev.inbound : null;

  function outcallWeekStats(w){
    if (!w || !outcall?.categories?.length) return [];
    return outcall.categories.map(c => {
      const t = outcall.data[c]?.["Total"];
      const inbound = sum(w.dates.map(d => t?.["인입"]?.[d] || 0));
      const completed = sum(w.dates.map(d => t?.["통화완료"]?.[d] || 0));
      const absent = sum(w.dates.map(d => t?.["미처리"]?.[d] || 0));
      return { category:c, inbound, completed, completedRate: inbound>0?completed/inbound:null, absent, absentRate: inbound>0?absent/inbound:null };
    });
  }
  const outcallWeek = outcallWeekStats(week);

  function delayWeekStats(w){
    if (!w) return { total:0, byReason:[] };
    const weekSet = new Set(w.dates);
    const rows = (delay30||[]).filter(r => weekSet.has(r.date));
    const reasonCount = {};
    rows.forEach(r => { const key = r.reason || "미분류"; reasonCount[key] = (reasonCount[key]||0)+1; });
    const byReason = Object.entries(reasonCount).map(([reason,count]) => ({reason,count})).sort((a,b)=>b.count-a.count);
    return { total: rows.length, byReason };
  }
  const delayWeek = delayWeekStats(week);

  const weeklyInsights = [];
  if (cx && cxPrev){
    weeklyInsights.push(`전주(${dateLabel(prevWeek.monday)}~${dateLabel(prevWeek.saturday)}) 인입 ${fmtNum(cxPrev.inbound)}건 → 이번 주 ${fmtNum(cx.inbound)}건 (${cxDiff>=0?'▲':'▼'} ${fmtNum(Math.abs(cxDiff))}건)`);
  }
  if (cx && cx.rate!=null){
    weeklyInsights.push(`이번 주 응대율은 ${fmtPct(cx.rate)}입니다.`);
  }
  if (delayWeek.byReason.length){
    const top = delayWeek.byReason[0];
    const pct = delayWeek.total>0 ? Math.round((top.count/delayWeek.total)*100) : 0;
    weeklyInsights.push(`이번 주 30분 응대지연 총 ${delayWeek.total}건 중 "${top.reason}"가 ${top.count}건(${pct}%)으로 가장 많습니다.`);
  }
  if (outcallWeek.length){
    const worst = outcallWeek.slice().sort((a,b)=>(b.absentRate||0)-(a.absentRate||0))[0];
    if (worst && worst.absentRate!=null) weeklyInsights.push(`아웃콜 중 부재율이 가장 높은 카테고리는 <b>${worst.category}</b> (${fmtPct(worst.absentRate)})입니다.`);
  }

  const weekOptions = weeks.map(w => `<option value="${w.monday}" ${w.monday===selectedWeekMonday?'selected':''}>${w.monday} ~ ${w.saturday}</option>`).join("");

  app.innerHTML = `
    <header>
      <div>
        <h1>CX 생산성 · 주간 리포트</h1>
        <div class="sub">${dateLabel(week.monday)} ~ ${dateLabel(week.saturday)} (월~토 · 일요일 제외)</div>
      </div>
      <div class="status">
        <select id="weekPicker" onchange="onWeekChange(this.value)" style="background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;">
          ${weekOptions}
        </select>
        <button onclick="switchToDaily()">일간 보기로 돌아가기</button>
      </div>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <h2>주간 인사이트</h2>
      <ul style="margin:0;padding-left:18px;font-size:13px;line-height:2;color:var(--ink);">
        ${weeklyInsights.map(i=>`<li>${i}</li>`).join("") || '<li style="color:var(--ink-dim);">인사이트를 생성할 데이터가 부족합니다.</li>'}
      </ul>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>채널톡 인입 및 응대현황</h2>
      <div class="kpis">
        <div class="kpi"><div class="label">상담인입 (채널톡/Call)</div><div class="val">${fmtNum(cx?.inbound)}</div></div>
        <div class="kpi"><div class="label">응대현황 (상담완료)</div><div class="val">${fmtNum(cx?.completed)}</div></div>
        <div class="kpi"><div class="label">응대율</div><div class="val">${fmtPct(cx?.rate)}</div></div>
      </div>
      ${cxPrev ? `<div style="margin-top:14px;font-size:13px;color:var(--ink-dim);">WoW 비교: 전주 ${fmtNum(cxPrev.inbound)}건 → 이번 주 ${fmtNum(cx.inbound)}건 (<span style="color:${cxDiff>=0?'var(--good)':'var(--bad)'};">${cxDiff>=0?'▲':'▼'} ${fmtNum(Math.abs(cxDiff))}건</span>)</div>` : ''}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>CX 아웃콜 운영현황</h2>
      <div class="kpis">
        ${outcallWeek.map(o => `<div class="kpi"><div class="label">${o.category} 아웃 Call 응대현황</div><div class="val">${fmtNum(o.inbound)}건</div>
          <div class="delta">완료율 · ${fmtNum(o.completed)}건 ${fmtPct(o.completedRate)}</div>
          <div class="delta">부재율(서베이발송) · ${fmtNum(o.absent)}건 ${fmtPct(o.absentRate)}</div></div>`).join("") || '<div style="color:var(--ink-dim);font-size:13px;">아웃콜 데이터 없음</div>'}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>30분 응대지연 현황</h2>
      <div class="kpis" style="margin-bottom:16px;">
        <div class="kpi"><div class="label">총 지연 건수</div><div class="val">${fmtNum(delayWeek.total)}</div></div>
      </div>
      <table>
        <thead><tr><th>사유</th><th>건수</th><th>비중</th></tr></thead>
        <tbody>
          ${delayWeek.byReason.map(r => `<tr><td style="text-align:left;">${r.reason}</td><td>${fmtNum(r.count)}</td><td>${delayWeek.total>0?Math.round((r.count/delayWeek.total)*100):0}%</td></tr>`).join("") || '<tr><td colspan="3" style="color:var(--ink-dim);">데이터 없음</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      월~토 기준 주간 리포트 (일요일 휴무 제외) · CS_Tracking · Out Call_Tracking · 30분 지연 체크 데이터 기준
    </div>
  `;
}

function drawCharts({ dates, sections, agents, today, outcall, weekKeys, weeklyByCategory, issueTodayRanking, weeklyByIssue, issueWeekKeys, hourlyToday, productivityScores }){
  destroyCharts();
  Chart.defaults.color = "#8B96AD";
  Chart.defaults.borderColor = "#28324D";
  Chart.defaults.font.family = "Pretendard, sans-serif";

  const totals = dates.map(d => sum(agents.map(a => sections["상담인입"][a][d])));
  const peakIdx = totals.indexOf(Math.max(...totals));
  const dateTickColor = (ctx) => { const d = dates[ctx.index]; return d && weekdayOf(d)===0 ? "#F0555B" : "#8B96AD"; };
  const dateLabels = dates.map(d => dateLabel(d));

  charts.inbound = new Chart(document.getElementById("chartInbound"), {
    type: "bar",
    data: { labels: dateLabels, datasets: [{
      data: totals,
      backgroundColor: dates.map((_,i)=> i===peakIdx ? "#E8A33D" : "#4C6EF555"),
      borderRadius: 4
    }]},
    options: { plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:"#28324D"} }, x:{ grid:{display:false}, ticks:{color:dateTickColor} } } }
  });

  const shareToday = agents.map(a => sections["상담인입"][a][today] || 0);
  const rankOrder = agents.map((a,i) => ({ agent:a, val: shareToday[i] }))
    .sort((a,b) => b.val - a.val);
  const TIER_COLORS = ["#E8A33D","#C9CDD6","#B08D57"]; // 금/은/동
  charts.share = new Chart(document.getElementById("chartShare"), {
    type: "bar",
    data: {
      labels: rankOrder.map((r,i) => `${i+1}위 ${r.agent}`),
      datasets: [{
        data: rankOrder.map(r => r.val),
        backgroundColor: rankOrder.map((r,i) => i<3 ? TIER_COLORS[i] : AGENT_COLORS[r.agent]+"AA"),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: "y",
      plugins: { legend: { display:false } },
      scales: { x:{ grid:{color:"#28324D"} }, y:{ grid:{display:false} } }
    }
  });

  const hourlyCanvas = document.getElementById("chartHourlyToday");
  if (hourlyCanvas){
    charts.hourlyToday = new Chart(hourlyCanvas, {
      type: "bar",
      data: { labels: Array.from({length:24}, (_,h)=>`${h}시`), datasets: [{
        data: hourlyToday || [],
        backgroundColor: "#4C6EF588",
        borderRadius: 4
      }]},
      options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:"#28324D"}}, x:{grid:{display:false}} } }
    });
  }

  charts.agentStack = new Chart(document.getElementById("chartAgentStack"), {
    type: "bar",
    data: { labels: dateLabels, datasets: agents.map(a => ({
      label: a, data: dates.map(d => sections["상담인입"][a][d] || 0),
      backgroundColor: AGENT_COLORS[a], stack: "s"
    }))},
    options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
      scales:{ x:{stacked:true, grid:{display:false}, ticks:{color:dateTickColor}}, y:{stacked:true, grid:{color:"#28324D"}} } }
  });

  const isClosedDay = (d) => sum(agents.map(a => sections["상담인입"]?.[a]?.[d] || 0)) === 0;
  charts.rates = new Chart(document.getElementById("chartRates"), {
    type: "line",
    data: { labels: dateLabels, datasets: [
      { label:"처리율(AVG)", data: dates.map(d=>{ if (isClosedDay(d)) return null; const v=sections["상담처리율_%"]?.["AVG"]?.[d]; return v==null?null:Math.max(0,Math.min(1,v))*100;}), borderColor:"#4C6EF5", borderWidth:2, tension:.3, pointRadius:3, spanGaps:true, order:2 },
      { label:"완료율(Total)", data: dates.map(d=>{ if (isClosedDay(d)) return null; const v=sections["상담완료율_%"]?.["Total"]?.[d]; return v==null?null:Math.max(0,Math.min(1,v))*100;}), borderColor:"#12B886", borderWidth:3, borderDash:[5,3], tension:.3, pointRadius:2, pointStyle:"rect", spanGaps:true, order:1 }
    ]},
    options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
      scales:{ y:{ min:0, max:105, ticks:{callback:v=>v<=100?v+"%":""}, grid:{color:"#28324D"} }, x:{grid:{display:false}, ticks:{color:dateTickColor}} } }
  });

  const delayAgentVals = agents.map(a => sections["30분 이상 지연"]?.[a]?.[today] || 0);
  charts.delay = new Chart(document.getElementById("chartDelay"), {
    type: "bar",
    data: { labels: agents, datasets: [{
      data: delayAgentVals,
      backgroundColor: agents.map(a=>AGENT_COLORS[a]),
      borderRadius: 4
    }]},
    options: {
      indexAxis: "y",
      plugins: { legend: { display:false } },
      scales: { x:{ grid:{color:"#28324D"} }, y:{ grid:{display:false} } }
    }
  });

  if (productivityScores){
    const workingIdx = agents.map((a,i) => productivityScores[i] != null);
    const validScores = productivityScores.filter(v => v!=null);
    const overallAvg = validScores.length ? sum(validScores)/validScores.length : 0;
    const offAgents = agents.filter((a,i) => productivityScores[i] == null);

    charts.cph = new Chart(document.getElementById("chartCPH"), {
      data: {
        labels: agents,
        datasets: [
          {
            type: "bar",
            data: productivityScores.map(v => v == null ? 0 : v),
            backgroundColor: agents.map((a,i) => {
              if (productivityScores[i] == null) return "#4A5568"; // 휴무 - 회색
              return productivityScores[i] < overallAvg ? "#F0555B99" : "#2FBF8F99";
            }),
            borderRadius: 4,
            order: 2
          },
          {
            type: "line",
            label: `근무자 평균 (${overallAvg.toFixed(1)})`,
            data: agents.map(() => overallAvg),
            borderColor: "#E8A33D",
            borderWidth: 2,
            borderDash: [6,4],
            pointRadius: 0,
            order: 1
          }
        ]
      },
      options: {
        indexAxis: "y",
        plugins: { legend: { display:true, position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}} } },
        scales: { x:{grid:{color:"#28324D"}, max:100}, y:{grid:{display:false}} }
      }
    });
    const noteEl = document.getElementById("cphBelowAvgNote");
    if (noteEl){
      const belowAvg = agents.filter((a,i) => productivityScores[i] != null && productivityScores[i] < overallAvg);
      const parts = [];
      if (belowAvg.length) parts.push(`평균(${overallAvg.toFixed(1)}) 미만: ${belowAvg.join(", ")}`);
      if (offAgents.length) parts.push(`휴무: ${offAgents.join(", ")}`);
      noteEl.textContent = parts.length ? parts.join(" · ") : "전 상담원이 평균 이상입니다.";
    }
  }

  const outcallCanvas = document.getElementById("chartOutcall");
  if (outcallCanvas && outcall?.categories?.length){
    const cats = outcall.categories;
    charts.outcall = new Chart(outcallCanvas, {
      data: {
        labels: cats,
        datasets: [
          { type:"bar", label:"인입", data: cats.map(c => outcall.data[c]?.["Total"]?.["인입"]?.[today] ?? 0), backgroundColor:"#4C6EF588", borderRadius:4 },
          { type:"bar", label:"통화완료", data: cats.map(c => outcall.data[c]?.["Total"]?.["통화완료"]?.[today] ?? 0), backgroundColor:"#12B88688", borderRadius:4 },
          { type:"bar", label:"부재", data: cats.map(c => outcall.data[c]?.["Total"]?.["미처리"]?.[today] ?? 0), backgroundColor:"#F0555B88", borderRadius:4 }
        ]
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{grid:{display:false}}, y:{grid:{color:"#28324D"}} } }
    });
  }

  const weeklyCanvas = document.getElementById("chartOutcallWeekly");
  if (weeklyCanvas && weekKeys?.length && weeklyByCategory){
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC"];
    const cats = Object.keys(weeklyByCategory);
    charts.outcallWeekly = new Chart(weeklyCanvas, {
      type: "line",
      data: {
        labels: weekKeys.map(w => `${w} 주`),
        datasets: cats.map((c,i) => ({
          label: c,
          data: weekKeys.map(w => weeklyByCategory[c][w]?.inbound ?? 0),
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          tension: .3,
          pointRadius: 3
        }))
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{grid:{display:false}}, y:{grid:{color:"#28324D"}, title:{display:true,text:"인입 건수",font:{size:10}} } } }
    });
  }

  const byAgentCanvas = document.getElementById("chartOutcallByAgent");
  if (byAgentCanvas && outcall?.categories?.length){
    const cats = outcall.categories;
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC"];
    charts.outcallByAgent = new Chart(byAgentCanvas, {
      type: "bar",
      data: {
        labels: agents,
        datasets: cats.map((c,i) => ({
          label: c,
          data: agents.map(a => outcall.data[c]?.[a]?.["통화완료"]?.[today] ?? 0),
          backgroundColor: palette[i % palette.length],
          stack: "cat"
        }))
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, grid:{color:"#28324D"}} } }
    });
  }

  const issueRankCanvas = document.getElementById("chartIssueRank");
  if (issueRankCanvas && issueTodayRanking?.length){
    const TIER_COLORS = ["#E8A33D","#C9CDD6","#B08D57"];
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC","#20C997","#845EF7"];
    charts.issueRank = new Chart(issueRankCanvas, {
      type: "bar",
      data: {
        labels: issueTodayRanking.map((r,i) => `${i+1}위 ${r.category}`),
        datasets: [{
          data: issueTodayRanking.map(r => r.val),
          backgroundColor: issueTodayRanking.map((r,i) => i<3 ? TIER_COLORS[i] : palette[i % palette.length]+"AA"),
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: "y",
        plugins: { legend: { display:false } },
        scales: { x:{ grid:{color:"#28324D"} }, y:{ grid:{display:false} } }
      }
    });
  }

  const issueWeeklyCanvas = document.getElementById("chartIssueWeekly");
  if (issueWeeklyCanvas && issueWeekKeys?.length && weeklyByIssue){
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC","#20C997","#845EF7"];
    const cats = Object.keys(weeklyByIssue);
    charts.issueWeekly = new Chart(issueWeeklyCanvas, {
      type: "line",
      data: {
        labels: issueWeekKeys.map(w => `${w} 주`),
        datasets: cats.map((c,i) => ({
          label: c,
          data: issueWeekKeys.map(w => weeklyByIssue[c][w] ?? 0),
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          tension: .3,
          pointRadius: 3
        }))
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{grid:{display:false}}, y:{grid:{color:"#28324D"}, title:{display:true,text:"이슈 건수",font:{size:10}} } } }
    });
  }
}

/* ===================== 상담원별 상세 아코디언 ===================== */
function toggleAgent(agent){
  if (!lastCtx) return;
  const wasOpen = openAgentPanel === agent;

  // 다른 패널 모두 닫기
  document.querySelectorAll(".acc-body").forEach(b => { b.style.display = "none"; b.innerHTML = ""; });
  document.querySelectorAll(".acc-header").forEach(h => h.classList.remove("active"));
  if (agentDetailChart){ agentDetailChart.destroy(); agentDetailChart = null; }

  if (wasOpen){ openAgentPanel = null; return; }

  openAgentPanel = agent;
  const header = document.getElementById("acc-header-" + agent);
  const body = document.getElementById("acc-body-" + agent);
  header.classList.add("active");
  body.style.display = "block";
  body.innerHTML = buildAgentDetailHTML(agent);
}

function buildAgentDetailHTML(agent){
  const { sections, today, schedule, dates, delay30, delayHold, targetCompletedToday, DELAY_PENALTY, rawLog } = lastCtx;
  const inb = sections["상담인입"]?.[agent]?.[today];
  const comp = sections["상담완료"]?.[agent]?.[today];
  const procRate = clampPct(sections["상담처리율_%"]?.[agent]?.[today]);
  const compRate = clampPct(sections["상담완료율_%"]?.[agent]?.[today]);
  const delay = sections["30분 이상 지연"]?.[agent]?.[today];
  const cph = sections["CPH(생산성)"]?.[agent]?.[today];
  const cast = sections["Cast(평점)"]?.[agent]?.[today];
  const workStatus = schedule?.schedule?.[agent]?.[today];
  const isOff = workStatus && OFF_STATUSES.includes(workStatus);
  const unprocessedTickets = (rawLog||[]).filter(r => r.agent === agent && r.date === today && r.direction === "INBOUND" && r.state && UNPROCESSED_STATES.includes(r.state.toLowerCase()));
  const unprocessed = unprocessedTickets.length;

  // 근무일 기반 생산성: 최근 기간 중 근무일수 대비 평균 처리 건수
  const workDays = dates.filter(d => {
    const st = schedule?.schedule?.[agent]?.[d];
    return st && !OFF_STATUSES.includes(st);
  }).length;
  const totalCompleted = sum(dates.map(d => sections["상담완료"]?.[agent]?.[d] || 0));
  const productivity = workDays > 0 ? totalCompleted / workDays : null;

  // 생산성 점수(목표 기반) - 처리량(60%) + 신속성(40%), 휴무자는 대상 제외
  const scoreVolume = isOff ? null : (targetCompletedToday>0 ? Math.min(100, ((comp||0) / targetCompletedToday) * 100) : 0);
  const scoreSpeed = isOff ? null : Math.max(0, 100 - (delay||0)*DELAY_PENALTY);
  const scoreTotal = isOff ? null : (scoreVolume*0.6 + scoreSpeed*0.4);
  const castRefScore = (cast!=null) ? Math.min(100, (cast / 5.0) * 100) : null; // 참고용, 종합점수에는 미반영

  function mdSortKey(md){ const [m,d] = md.split("/").map(Number); return m*100+d; }
  const delay30Rows = delay30.filter(r => r.agent === agent && r.date === today).sort((a,b) => mdSortKey(b.date) - mdSortKey(a.date));
  const delayHoldRows = delayHold.filter(r => r.agent === agent && r.date === today).sort((a,b) => mdSortKey(b.date) - mdSortKey(a.date));

  function subTable(rows, emptyMsg){
    if (!rows.length) return `<div style="color:var(--ink-dim);font-size:12px;padding:8px 0;">${emptyMsg}</div>`;
    const shown = rows.slice(0, 10);
    return `
      <table style="font-size:12px;">
        <thead><tr><th>날짜</th><th>사업장</th><th>소요시간</th><th>사유</th><th>링크</th></tr></thead>
        <tbody>
          ${shown.map(r => `<tr>
            <td>${r.date}</td><td style="text-align:left;">${r.store||'-'}</td><td>${r.duration||'-'}</td>
            <td style="text-align:left;">${r.reason||'-'}</td>
            <td>${r.url ? `<a href="${r.url}" target="_blank" style="color:var(--accent);">보기</a>` : '-'}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      ${rows.length > 10 ? `<div style="color:var(--ink-dim);font-size:11.5px;margin-top:6px;">전체 ${rows.length}건 중 최근 10건 표시</div>` : ""}
    `;
  }

  const agentDelayRate = (comp!=null && comp>0 && delay!=null) ? delay/comp : null;
  const agentOverTarget = agentDelayRate!=null && agentDelayRate > 0.03;

  return `
    ${workStatus ? `<div style="margin-bottom:12px;font-size:12.5px;color:var(--ink-dim);">오늘 근무 상태: <span style="color:${isOff?'var(--accent)':'var(--good)'};font-weight:600;">${workStatus}</span></div>` : ""}
    <div class="acc-kpis">
      <div class="acc-kpi"><div class="l">상담인입</div><div class="v">${fmtNum(inb)}</div></div>
      <div class="acc-kpi"><div class="l">상담완료</div><div class="v">${fmtNum(comp)}</div></div>
      <div class="acc-kpi"><div class="l">미처리</div><div class="v">${fmtNum(unprocessed)}</div></div>
      <div class="acc-kpi"><div class="l">처리율</div><div class="v">${fmtPct(procRate)}</div></div>
      <div class="acc-kpi"><div class="l">완료율</div><div class="v">${fmtPct(compRate)}</div></div>
      <div class="acc-kpi"><div class="l">30분 이상 지연</div><div class="v">${fmtNum(delay)}</div></div>
      <div class="acc-kpi"><div class="l">지연율 (목표 3%)</div><div class="v" style="color:${agentDelayRate==null?'inherit':(agentOverTarget?'var(--bad)':'var(--good)')};">${agentDelayRate!=null ? fmtPct(agentDelayRate) : "-"}</div></div>
      <div class="acc-kpi"><div class="l">CPH(원본)</div><div class="v">${cph!=null ? fmtNum(cph) : "-"}</div></div>
      <div class="acc-kpi"><div class="l">근무일 기준 생산성</div><div class="v">${productivity!=null ? productivity.toFixed(1)+'건/일' : '-'}</div></div>
    </div>

    <div style="margin-top:6px;font-size:13px;font-weight:600;">생산성 점수 (목표 기반) <span style="font-weight:400;color:var(--ink-dim);font-size:11.5px;">· ${dateLabel(today)} 기준</span></div>
    ${isOff ? `
      <div style="margin-top:10px;padding:14px;background:var(--panel-2);border-radius:8px;color:var(--accent);font-size:13px;">오늘은 "${workStatus}"로 근무일이 아니라 생산성 점수 대상에서 제외됩니다.</div>
    ` : `
      <div class="acc-kpis" style="margin-top:10px;">
        <div class="acc-kpi"><div class="l">처리량 점수 (60%)</div><div class="v">${scoreVolume.toFixed(0)}</div></div>
        <div class="acc-kpi"><div class="l">신속성 점수 (40%)</div><div class="v">${scoreSpeed.toFixed(0)}</div></div>
        <div class="acc-kpi" style="background:var(--panel-2);"><div class="l">종합 점수</div><div class="v" style="color:var(--accent);">${scoreTotal.toFixed(1)}</div></div>
        <div class="acc-kpi"><div class="l">평점(Cast) <span style="font-size:9.5px;">참고·미반영</span></div><div class="v">${castRefScore!=null?castRefScore.toFixed(0):'-'}</div></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-dim);margin-top:8px;line-height:1.6;">
        처리량 = 완료건수 ÷ 근무자 평균 완료건수(${targetCompletedToday.toFixed(1)}, 목표) × 100 (최대 100) · 신속성 = 100 − (지연 건수 × ${DELAY_PENALTY})
      </div>
    `}

    <div style="margin-top:18px;font-size:13px;font-weight:600;">30분 이상 지연 상세</div>
    ${subTable(delay30Rows, "해당 상담원의 30분 이상 지연 기록이 없습니다.")}
    <div style="margin-top:18px;font-size:13px;font-weight:600;">응대지연(2시간 이상) 상세</div>
    ${subTable(delayHoldRows, "해당 상담원의 2시간 이상 응대지연 기록이 없습니다.")}

    <div style="margin-top:18px;font-size:13px;font-weight:600;">미처리 상세 <span style="font-weight:400;color:var(--ink-dim);font-size:11.5px;">(인바운드 · 미종결 건)</span></div>
    ${unprocessedTickets.length ? `
      <table style="font-size:12px;">
        <thead><tr><th>사업장</th><th>상태</th><th>시간</th><th>링크</th></tr></thead>
        <tbody>
          ${unprocessedTickets.slice(0,20).map(t => `<tr><td style="text-align:left;">${t.store||'-'}</td><td style="text-align:left;">${STATE_LABELS[t.state?.toLowerCase()] || t.state || '-'}</td><td>${String(t.hour).padStart(2,'0')}시</td>
            <td>${t.url ? `<a href="${t.url}" target="_blank" style="color:var(--accent);">보기</a>` : '-'}</td></tr>`).join("")}
        </tbody>
      </table>
      ${unprocessedTickets.length > 20 ? `<div style="color:var(--ink-dim);font-size:11.5px;margin-top:6px;">전체 ${unprocessedTickets.length}건 중 20건 표시</div>` : ""}
    ` : `<div style="color:var(--ink-dim);font-size:12px;padding:8px 0;">오늘 미처리 건이 없습니다.</div>`}
  `;
}

/* ===================== 갱신 로직 ===================== */
let secondsLeft = REFRESH_MS/1000;
function startCountdown(){
  clearInterval(countdownTimer);
  secondsLeft = REFRESH_MS/1000;
  countdownTimer = setInterval(() => {
    secondsLeft--;
    const el = document.getElementById("lastUpdated");
    if (el) el.textContent = `다음 자동 갱신까지 ${Math.max(0,secondsLeft)}초`;
    if (secondsLeft <= 0) refresh(false);
  }, 1000);
}

async function refresh(manual){
  try{
    const main = await loadMainData();
    const rawLog = lastLoadedData?.rawLog || [];
    lastLoadedData = { ...main, rawLog };
    render(lastLoadedData);
  }catch(e){
    console.error(e);
    if (manual) alert("데이터를 불러오지 못했습니다: " + e.message);
  }
}

async function refreshRawLog(){
  const rawLog = await loadRawLog();
  if (lastLoadedData){
    lastLoadedData.rawLog = rawLog;
    render(lastLoadedData);
  }
}

async function initialLoad(){
  await refresh(true);
  await refreshRawLog(); // RAW 로그(6MB+)는 최초 1회만 함께 로드, 이후 30분 주기로 별도 갱신
  setInterval(refreshRawLog, RAWLOG_REFRESH_MS);
}

initialLoad();
</script>

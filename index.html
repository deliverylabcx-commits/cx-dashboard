/* ===================== 채팅 · CALL 인입 (RAW tags: CALL/CALL/인바운드·아웃바운드) ===================== */
// 시트(CS_Tracking) 상담인입 = 채팅 상담 기준. 전화 인바운드(CALL/CALL/인바운드)는 대부분 담당자 미배정이라 시트에 잡히지 않아 RAW로 별도 집계해 "통합 인입"에 더한다.
const CALL_IN_RE = /CALL\/CALL\/인바운드/, CALL_OUT_RE = /CALL\/CALL\/아웃바운드/;
const CALL_EXCLUDED_AGENTS = ["songsong"]; // 채팅·CALL 인입 현황 집계에서 제외할 인원
const CALL_MISSED_LABEL = { wfEndCall:"ARS(워크플로우) 종료", userLeftInQueued:"대기 중 고객 이탈", userLeftInWaitingManager:"상담원 연결 대기 중 이탈", notInOperation:"운영시간 외", wfInputTimeout:"ARS 입력 시간초과" };
function callStats(rawLog, dateSet){
  const s = { in:0, inConnected:0, inMissed:0, out:0, byAgent:{}, missedReasons:{}, byDate:{} };
  (rawLog||[]).forEach(r => {
    if (dateSet && !dateSet.has(r.date)) return;
    if (CALL_EXCLUDED_AGENTS.includes(r.agent)) return;
    const isIn = CALL_IN_RE.test(r.tags||""), isOut = CALL_OUT_RE.test(r.tags||"");
    if (!isIn && !isOut) return;
    const a = r.agent || "미연결";
    const b = s.byAgent[a] = s.byAgent[a] || { in:0, out:0 };
    const d = s.byDate[r.date] = s.byDate[r.date] || { in:0, out:0 };
    if (isIn){
      s.in++; b.in++; d.in++;
      if (r.agent) s.inConnected++;
      else { s.inMissed++; const k = CALL_MISSED_LABEL[r.missedReason] || (r.missedReason ? r.missedReason : "사유 미기재"); s.missedReasons[k] = (s.missedReasons[k]||0) + 1; }
    }
    if (isOut){ s.out++; b.out++; d.out++; }
  });
  return s;
}
// 통합 인입 = 시트 상담인입(채팅) + CALL 인바운드
function buildCallSection(data, dates, prevDates, opts){
  const { sections, totalRow, rawLog } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);
  const depMap = departedInboundByDate(rawLog, sections);
  const hasRaw = (rawLog||[]).length > 0;
  const chatOf = ds => sum(ds.map(d => totalInboundOn(d, totalRow, sections, agents, depMap) || 0));
  const st = callStats(rawLog, new Set(dates));
  const pst = prevDates ? callStats(rawLog, new Set(prevDates)) : null;
  const chat = chatOf(dates), pchat = prevDates ? chatOf(prevDates) : null;
  const total = chat + st.in, ptotal = pst ? pchat + pst.in : null;
  const cmp = (cur, prev) => {
    if (prev == null || !hasRaw) return `<div class="delta" style="color:var(--ink-dim);">${opts.prevLabel||'이전'} 데이터 없음</div>`;
    const d = cur - prev; const r = prev ? Math.round(d/prev*100) : null;
    return `<div class="delta" style="color:${d>0?'var(--accent)':'var(--ink-dim)'};">${opts.prevLabel} 대비 ${d>=0?'▲':'▼'} ${fmtNum(Math.abs(d))}건${r!=null?` (${d>=0?'+':'-'}${Math.abs(r)}%)`:''}</div>`;
  };
  // 담당자별: 시트 채팅 인입 + RAW CALL 인/아웃
  const names = [...new Set([...agents, ...Object.keys(st.byAgent)])].filter(n => n !== "미연결");
  const rowsA = names.map(a => {
    const c = agents.includes(a) ? sum(dates.map(d => sections["상담인입"]?.[a]?.[d] || 0)) : null;
    const ci = st.byAgent[a]?.in || 0, co = st.byAgent[a]?.out || 0;
    return { a, c, ci, co, t: (c||0) + ci };
  }).filter(r => (r.c||0) + r.ci + r.co > 0).sort((x,y) => y.t - x.t || y.co - x.co);
  const miss = st.byAgent["미연결"]?.in || 0;
  const reasons = Object.entries(st.missedReasons).sort((a,b)=>b[1]-a[1]);
  const hasReason = reasons.some(([k]) => k !== "사유 미기재"); // RAW_대시보드에 missedReason 열이 있을 때만 표시
  const connRate = st.in ? st.inConnected / st.in : null;
  const html = `
    <div class="card" style="margin-bottom:16px;">
      <h2>채팅 · CALL 인입 현황<span class="tag">${opts.periodLabel} · 통합 인입 = 채팅(시트) + CALL 인바운드</span></h2>
      ${!hasRaw ? `<div style="color:var(--ink-dim);font-size:12.5px;">채널톡 RAW를 불러오는 중입니다… (CALL 집계는 RAW 기준)</div>` : `
      <div class="kpis vip-kpis">
        <div class="kpi" style="border-color:#4C6EF566;"><div class="label">통합 인입</div><div class="val">${fmtNum(total)}<span style="font-size:13px;color:var(--ink-dim);font-weight:500;"> 건</span></div>${cmp(total, ptotal)}</div>
        <div class="kpi"><div class="label">💬 채팅 인입 <span style="font-size:11px;">(시트 상담인입)</span></div><div class="val">${fmtNum(chat)}</div>${cmp(chat, pchat)}</div>
        <div class="kpi"><div class="label">📞 CALL 인바운드</div><div class="val">${fmtNum(st.in)}</div>
${cmp(st.in, pst?.in)}</div>
        <div class="kpi"><div class="label">📤 CALL 아웃바운드</div><div class="val">${fmtNum(st.out)}</div>${cmp(st.out, pst?.out)}</div>
      </div>
      <div class="grid2" style="margin-bottom:0;">
        <div style="overflow-x:auto;">
          <table>
            <tr><th>담당자</th><th>💬 채팅 인입</th><th>📞 CALL 인바운드</th><th>📤 CALL 아웃바운드</th><th>통합 인입</th></tr>
            ${rowsA.map(r => `<tr><td><span class="grade-chip" style="border-radius:50%;background:${AGENT_COLORS[r.a]||VIP_EXTRA_AGENT_COLORS[r.a]||'#8B96AD'}"></span><span style="color:var(--ink);font-weight:600;">${r.a}</span></td>
              <td>${r.c==null?'<span style="color:var(--ink-dim);" title="CS_Tracking 시트에 행 없음">-</span>':fmtNum(r.c)}</td><td>${fmtNum(r.ci)}</td><td>${fmtNum(r.co)}</td><td class="hl-num">${fmtNum(r.t)}</td></tr>`).join("")}
            <tr style="border-top:2px solid var(--line);"><td style="color:var(--ink);font-weight:700;">합계</td><td class="hl-num">${fmtNum(chat)}</td><td class="hl-num">${fmtNum(sum(rowsA.map(r=>r.ci)))}</td><td class="hl-num">${fmtNum(sum(rowsA.map(r=>r.co)))}</td><td class="hl-num">${fmtNum(chat + sum(rowsA.map(r=>r.ci)))}</td></tr>
          </table>
          <div style="font-size:11px;color:var(--ink-dim);margin-top:6px;">채팅 인입 합계는 시트 상담인입_Total 기준(퇴사자 보정 포함)이라 담당자 합과 다를 수 있습니다. songsong은 이 카드 집계에서 제외합니다.</div>
        </div>
        <div><canvas id="${opts.canvasId}" style="max-height:260px;"></canvas></div>
      </div>`}
    </div>`;
  const draw = () => {
    const el = document.getElementById(opts.canvasId); if (!el || !hasRaw) return;
    const xs = opts.trendDates || dates;
    const tst = callStats(rawLog, new Set(xs));
    charts[opts.canvasId] = new Chart(el, {
      type: "bar",
      data: { labels: xs.map(d => dateLabel(d)), datasets: [
        { label: "💬 채팅(시트)", data: xs.map(d => totalInboundOn(d, totalRow, sections, agents, depMap) || 0), backgroundColor: "#4C6EF5BB", borderRadius: 3, stack: "s" },
        { label: "📞 CALL 인바운드", data: xs.map(d => tst.byDate[d]?.in || 0), backgroundColor: "#E8A33DCC", borderRadius: 3, stack: "s" },
        { type: "line", label: "📤 CALL 아웃바운드", data: xs.map(d => tst.byDate[d]?.out || 0), borderColor: "#12B886", backgroundColor: "#12B886", tension: .3, pointRadius: 2 } ] },
      options: { plugins:{ legend:{ position:"bottom", labels:{boxWidth:10} }, tooltip:{ mode:"index", intersect:false } },
        scales:{ x:{ stacked:true, grid:{display:false}, ticks:{ color: (c) => { const d = xs[c.index]; return d && weekdayOf(d)===0 ? "#F0555B" : "#8B96AD"; } } }, y:{ stacked:true, beginAtZero:true, grid:{color:"#28324D"} } } }
    });
  };
  return { html, draw, total, chat, callIn: st.in, stats: st, ptotal: (pst && hasRaw) ? ptotal : null };
}

// 상품: description의 "코드: HERO-xxxxxx" ↔ OM_CX_VOC 관리 시트 「상품정보 누적」
const PRODUCT_MASTER_URL = "https://docs.google.com/spreadsheets/d/1FS6Uh6SATkzjbpQiuhEt_pmCmcOJycvXz2Eli2XYUt4/export?format=csv"; // 임시 상품 매칭 시트 (운영툴 API 연동 전까지) // 열: 히어로코드·유통사명·상품명·유통사 상품명·대분류
const CLAIM_AREAS = [
  { key:"supplier", name:"공급사 클레임", icon:"🏭", color:"#E8A33D", desc:"공급사클레임 · 품질불량" },
  { key:"delivery", name:"배송 클레임",   icon:"🚚", color:"#4C6EF5", desc:"배송클레임 · FC배송" },
  { key:"service",  name:"서비스 클레임", icon:"📱", color:"#BE4BDB", desc:"서비스이용클레임" },
  { key:"etc",      name:"기타",          icon:"📎", color:"#20C997", desc:"유관부서 전달" },
];
const CLAIM_AREA_MAP = Object.fromEntries(CLAIM_AREAS.map(a => [a.key, a]));
let productMaster = null, productMasterLoading = false, productMasterError = null, productMasterSource = "";
let claimPeriod = "weekly", claimSelDate = null, claimSelWeek = null, claimSelMonth = null;

function esc(v){ return String(v==null?"":v).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
// 배송 유형 단순화: 귀책·원인 꼬리표 제거, 처리 방식은 원 이슈로 통합
function simplifyDeliveryType(t){
  let x = (t||"").replace(/\(배송기사\)/g, "").replace(/\(보냉불량\)/g, "").trim();
  if (/^오적재/.test(x)) x = "오적재";
  if (/^시건장치/.test(x)) x = "시건장치";
  if (x === "분리배송" || x === "익일배송") x = "미배송";
  if (x === "정정배송") x = "오배송";
  return x || "기타";
}
function classifyClaimTag(tag){
  const p = tag.split("/").map(x => x.trim());
  if (p.length < 2) return null;
  const [d1, d2, d3=""] = p;
  if (d2 === "공급사클레임") return { area:"supplier", type: d3 || "기타" };
  if (d2 === "품질불량") return { area:"supplier", type:"품질불량" }; // 3depth(환불·퀵 등)는 처리방안이라 제외
  if (d2 === "배송클레임" || d2 === "FC배송") return { area:"delivery", type: simplifyDeliveryType(d3), fc: d2 === "FC배송" };
  if (d2 === "서비스이용클레임") return { area:"service", type: d3 || "기타" };
  if (d1 === "기타" && d3 === "유관부서전달") return { area:"etc", type:"유관부서 전달" };
  return null;
}
function parseClaimRow(r){
  const tags = (r.tags||"").split(",").map(t => t.trim()).filter(Boolean);
  const seen = new Set();
  const claims = tags.map(classifyClaimTag).filter(c => c && !seen.has(c.area+"|"+c.type) && seen.add(c.area+"|"+c.type));
  if (!claims.length) return null;
  const supTag = tags.find(t => /^공급사\/공급사명\//.test(t));
  const supplier = supTag ? normalizeSupplier(supTag.split("/").slice(2).join("/")) : null;
  const codes = [...new Set(((r.desc||"").match(/HERO-[0-9A-Z]{6}/gi) || []).map(c => c.toUpperCase()))];
  return { r, claims, supplier, codes };
}
// 상품 매핑: ① 대시보드와 같이 올린 product_map.json(운영툴 API product_view 추출본) → ② 임시 상품 매칭 시트
async function loadProductMaster(){
  if (productMaster || productMasterLoading) return;
  productMasterLoading = true;
  try {
    const res = await fetch("product_map.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("product_map.json " + res.status);

    const m = {};
    Object.entries(j.p || {}).forEach(([k, v]) => { m["HERO-" + k] = { name: v[0], dist: (j.s || [])[v[1]] || "", cat: "" }; });
    productMaster = m; productMasterSource = `운영툴 API (${j.v || ""})`;
  } catch(e){
    console.warn("product_map.json 사용 불가 - 상품 매칭 시트로 대체:", e.message);
    try {
      const rows = Papa.parse((await fetchCSV(PRODUCT_MASTER_URL)).trim()).data;

      productMaster = m; productMasterSource = "상품 매칭 시트";
    } catch(e2){ productMasterError = e2.message; console.warn("상품정보 시트 로드 실패:", e2.message); }
  }
  productMasterLoading = false;
  if (lastLoadedData && productMaster && viewMode !== "cost" && viewMode !== "vip") quietRender(); // 상품명으로 다시 표시(급증 인사이트·클레임 요약 포함)
}

function switchToClaim(){ viewMode = "claim"; window.scrollTo(0,0); if (lastLoadedData) render(lastLoadedData); loadProductMaster(); }
function setClaimPeriod(p){ claimPeriod = p; if (lastLoadedData) render(lastLoadedData); }

// 영역·유형별 집계: { area: { total, types: { type: [items] } } }
function claimCount(items){
  const out = {}; CLAIM_AREAS.forEach(a => out[a.key] = { total:0, types:{} });
  items.forEach(it => {
    const areas = new Set();
    it.claims.forEach(c => { (out[c.area].types[c.type] = out[c.area].types[c.type] || []).push(it); areas.add(c.area); });
    areas.forEach(a => out[a].total++);
  });
  return out;
}
function isoWeekNo(md){ const [m,d] = md.split("/").map(Number); const t = new Date(Date.UTC(DATA_YEAR, m-1, d)); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y0) / 86400000 + 1) / 7); }
function sparkSVG(vals, color){
  const w = 300, h = 44, max = Math.max(1, ...vals), n = vals.length;
  const pts = vals.map((v,i) => [n>1 ? i*(w-8)/(n-1)+4 : w/2, h-4 - (v/max)*(h-12)]);
  const line = pts.map(p => p.join(",")).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:44px;display:block;">
    <polygon points="4,${h-4} ${line} ${w-4},${h-4}" fill="${color}22"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="3.5" fill="${color}"/></svg>`;
}
function deltaBadge(cur, prev){
  if (prev == null) return "";
  if (!prev && cur) return `<span style="font-size:11px;font-weight:700;background:#BE4BDB33;color:#D0A3FF;border-radius:5px;padding:1px 6px;">NEW</span>`;
  if (!prev && !cur) return "";
  const r = Math.round((cur - prev) / prev * 100);
  if (!r) return `<span style="font-size:11px;color:var(--ink-dim);">-</span>`;
  return `<span style="font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:${r>0?'#F0555B26':'#2FBF8F26'};color:${r>0?'var(--bad)':'var(--good)'};">${r>0?'▲':'▼'} ${Math.abs(r)}%</span>`;
}

function photoCodeGet(){ try { return sessionStorage.getItem("photoViewCode") || window.__photoCode || ""; } catch(e){ return window.__photoCode || ""; } }
function photoCodeSet(v){ window.__photoCode = v; try { v ? sessionStorage.setItem("photoViewCode", v) : sessionStorage.removeItem("photoViewCode"); } catch(e){} }

function filterClaimModal(q){

function downloadClaimCSV(){

function renderClaim(data){
  const app = document.getElementById("app");
  const rawLog = data.rawLog || [];

  const nav = (picker) => `

          <button class="${claimPeriod==='daily'?'on':''}" onclick="setClaimPeriod('daily')">일간</button>

  const workDates = allDates.filter(d => weekdayOf(d) !== 0);
  const weeks = buildWeekList(allDates), months = buildMonthList(allDates);
  // buckets: 선택 기간 + 이전 5개 (추세 스파크라인용)

  if (claimPeriod === "daily"){
    if (!claimSelDate || !allDates.includes(claimSelDate)) claimSelDate = workDates[workDates.length-1];
    const idx = workDates.indexOf(claimSelDate);
    buckets = workDates.slice(Math.max(0, (idx<0?workDates.length:idx+1)-6), idx<0?undefined:idx+1).map(d => ({ label: d, dates:[d] }));
    if (idx < 0) buckets.push({ label: claimSelDate, dates:[claimSelDate] });
    title = dateLabel(claimSelDate); prevLabel = "전 영업일";
    picker = `<input type="date" value="${mdToISO(claimSelDate)}" min="${mdToISO(allDates[0])}" max="${mdToISO(allDates[allDates.length-1])}" onchange="onClaimDate(this.value)">`;
  } else if (claimPeriod === "weekly"){
    if (!claimSelWeek || !weeks.find(w=>w.monday===claimSelWeek)) claimSelWeek = weeks[weeks.length-1].monday;
    const wi = weeks.findIndex(w=>w.monday===claimSelWeek);
    buckets = weeks.slice(Math.max(0, wi-5), wi+1).map(w => ({ label:`W${isoWeekNo(w.monday)}`, dates:w.dates }));
    title = dateRangeLabel(weeks[wi].monday, weeks[wi].saturday); prevLabel = "전주";
    picker = `<select style="${VIP_SEL_STYLE}" onchange="onClaimWeek(this.value)">${weeks.map(x=>`<option value="${x.monday}" ${x.monday===claimSelWeek?'selected':''}>${dateRangeLabel(x.monday,x.saturday)}</option>`).join("")}</select>`;
  } else {
    if (!claimSelMonth || !months.find(m=>m.key===claimSelMonth)) claimSelMonth = months[months.length-1].key;
    const mi = months.findIndex(m=>m.key===claimSelMonth);
    buckets = months.slice(Math.max(0, mi-5), mi+1).map(m => ({ label:m.label, dates:m.dates }));
    title = months[mi].label; prevLabel = "전월";

  const areaHTML = CLAIM_AREAS.map(a => {

  const pmNote = productMaster ? ` · 상품정보: ${productMasterSource}` : productMasterError ? " · 상품정보를 불러오지 못해 코드로 표시" : " · 상품명 매칭 중…";

    <div class="footer-note">

/* ---- 문의·클레임 유형 (메인 대시보드): 클레임 VOC와 같은 채널톡 RAW 태그 기준 ----
   클레임 3종은 클레임 VOC 분류(CLAIM_TEAMS)와 동일, 문의 3종은 태그 2depth(배송문의·서비스이용문의·주문결제) 기준. 상담 1건은 유형별로 1번만 셈 */
const ISSUE_GROUPS = [
  { name:"상품 클레임",       team:"product",  color:"#E8A33D" },
  { name:"배송 클레임",       team:"delivery", color:"#4C6EF5" },
  { name:"서비스·기타 클레임", team:"other",    color:"#BE4BDB" },
  { name:"배송 문의",         tag:"배송문의",     color:"#748FFC", inq:true },
  { name:"서비스 이용 문의",   tag:"서비스이용문의", exclude3:"품절", color:"#20C997", inq:true },
  { name:"품절 문의",          tag3:"서비스이용문의/품절", color:"#F76707", inq:true },  // 품절로 배송일 변경 (이사님 회의: 서비스 이용문의/품절 태그)
  { name:"주문·결제 문의",     tag:["주문결제","오주문단순변심"], color:"#8B96AD", inq:true },
];
const ISSUE_COLOR = Object.fromEntries(ISSUE_GROUPS.map(g => [g.name, g.color]));
let __issueCache = { src:null, len:0, sec:null };
function rawIssueSection(rawLog){
  if (!rawLog || !rawLog.length) return null;
  if (__issueCache.src === rawLog && __issueCache.len === rawLog.length) return __issueCache.sec;
  const sec = {}; ISSUE_GROUPS.forEach(g => sec[g.name] = {});
  rawLog.forEach(r => {
    const add = g => sec[g.name][r.date] = (sec[g.name][r.date] || 0) + 1;
    const it = parseClaimRow(r);
    if (it) ISSUE_GROUPS.filter(g => g.team).forEach(g => { const t = CLAIM_TEAMS.find(x => x.key === g.team); if (it.claims.some(c => t.areas.includes(c.area))) add(g); });
    const parts = (r.tags || "").split(",").map(t => t.trim().split("/").map(x => x.trim())).filter(p => p.length >= 2);
    ISSUE_GROUPS.filter(g => g.tag).forEach(g => { if (parts.some(p => [].concat(g.tag).includes(p[1]) && !(g.exclude3 && p[2] === g.exclude3))) add(g); });
    ISSUE_GROUPS.filter(g => g.tag3).forEach(g => { if (parts.some(p => p[1] + "/" + (p[2]||"") === g.tag3)) add(g); });
  });
  __issueCache = { src: rawLog, len: rawLog.length, sec };
  return sec;
}

/* ---- 상품코드 세부: 같은 상품명이라도 히어로코드가 다를 수 있어 코드별 건수를 함께 표시 ---- */
function codeBreakdown(items, name){
  const m = {};
  items.forEach(it => new Set(it.codes.filter(c => !name || productName(c) === name)).forEach(c => m[c] = (m[c]||0) + 1));
  return Object.entries(m).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
}
function codeChipsHTML(list, max){
  if (list.length < 2) return ""; // 코드가 1종이면 카드에선 생략(상세 팝업에서 확인) — 같은 상품명에 코드가 여러 개일 때만 표시
  max = max || 3;
  const multi = list.length > 1;
  return `<span style="font-size:11.5px;color:var(--ink-dim);">상품코드 ${list.slice(0, max).map(([c,n]) => multi ? `${esc(c)} <b style="color:var(--ink);">${n}건</b>` : esc(c)).join(" · ")}${list.length > max ? ` 외 ${list.length - max}종` : ''}</span>`;
}
function codeText(list, max){ max = max || 3; return list.length > 1 ? list.slice(0, max).map(([c,n]) => list.length > 1 ? `${c} ${n}건` : c).join(", ") + (list.length > max ? ` 외 ${list.length-max}` : "") : ""; }
function spikeProdName(s){ return s.level === "P" ? s.key.split("|").slice(2).join("|") : null; }

/* ---- 클레임 급증 인사이트: "어느 날, 어느 공급사(센터)에서, 어떤 클레임이 평소보다 갑자기 늘었나" ---- */
// 기준: 이번 기간 건수 vs 직전 기간들(최대 4개) 평균. 3건 이상 & 평소의 2배 이상(또는 평소 0건) & 2건 이상 증가 → 급증
const SPIKE_MIN = 3, SPIKE_RATIO = 2, SPIKE_DIFF = 2;
const SPIKE_DEPT = { supplier:{ name:"MD", color:"#E8A33D" }, delivery:{ name:"SCM", color:"#4C6EF5" }, service:{ name:"서비스·개발", color:"#BE4BDB" }, etc:{ name:"유관부서", color:"#20C997" } };
// 팀별 리뷰 섹션 = Slack 봇의 팀 멘션 단위. mention 은 붙여넣기용 표기이며,
// 봇으로 보낼 때는 Slack 사용자그룹 ID 형식(<!subteam^S0XXXXXX>)으로 바꾸면 실제 멘션됩니다.
const CLAIM_TEAMS = [
  { key:"product",  areas:["supplier"],      icon:"📦", name:"상품 클레임",  team:"MD",             mention:"@MD",   color:"#E8A33D" },
  { key:"delivery", areas:["delivery"],      icon:"🚚", name:"배송 클레임",  team:"SCM",            mention:"@SCM",  color:"#4C6EF5" },
  { key:"other",    areas:["service","etc"], icon:"🛠️", name:"서비스·기타", team:"서비스·유관부서", mention:"@CX",   color:"#BE4BDB" },
];
function detectClaimSpikes(allItems, buckets){
  if (!buckets || buckets.length < 2) return [];
  const bi = {}; buckets.forEach((b, i) => b.dates.forEach(d => bi[d] = i));
  const cur = buckets.length - 1, prevN = Math.min(4, cur);
  const groups = {};
  const add = (key, area, label, it, type) => {
    const i = bi[it.r.date]; if (i == null) return;
    const g = groups[key] = groups[key] || { key, area, label, counts: buckets.map(() => 0), seen: buckets.map(() => new Set()), items: [], types:{}, typeSeen: new Set() };
    if (!g.seen[i].has(it)){ g.seen[i].add(it); g.counts[i]++; if (i === cur) g.items.push(it); }
    if (i === cur && type){ const tk = it.r.url + "|" + it.r.date + it.r.hour + it.r.store + "|" + type; if (!g.typeSeen.has(tk)){ g.typeSeen.add(tk); g.types[type] = (g.types[type]||0) + 1; } }
  };
  allItems.forEach(it => {
    if (bi[it.r.date] == null) return;
    it.claims.forEach(c => {
      if (c.area === "supplier"){
        const sup = normalizeSupplier(it.supplier || "") || "공급사 미기재";
        add(`S|${sup}`, "supplier", sup, it, c.type);
        const names = [...new Set(it.codes.map(productName))];
        names.forEach(n => add(`P|${sup}|${n}`, "supplier", `${sup} · ${n}`, it, c.type));
      } else if (c.area === "delivery"){
        const cen = it.r.center || "센터 미기재";
        add(`D|${cen}|${c.type}`, "delivery", `${cen} · ${c.type}`, it, c.type);
      } else {
        add(`${c.area}|${c.type}`, c.area, c.type, it, c.type);
      }
    });
  });
  const out = [];
  Object.values(groups).forEach(g => {
    const now = g.counts[cur];
    const base = g.counts.slice(cur - prevN, cur).reduce((a,b)=>a+b, 0) / prevN;
    if (now >= SPIKE_MIN && now - base >= SPIKE_DIFF && (base === 0 || now >= base * SPIKE_RATIO)){
      const byDay = {}; g.items.forEach(it => byDay[it.r.date] = (byDay[it.r.date]||0) + 1);
      const peak = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
      out.push({ ...g, now, base, ratio: base ? now / base : null, peak, level: g.key[0] });
    }
  });
  // 같은 공급사에서 상품 급증이 잡히면 공급사 전체 줄은 생략 (중복 방지)
  const prodSup = new Set(out.filter(x => x.level === "P").map(x => x.key.split("|")[1]));
  return out.filter(x => !(x.level === "S" && prodSup.has(x.key.split("|")[1])))
            .sort((a,b) => (b.now - b.base) - (a.now - a.base) || b.now - a.now);
}
function spikeSentence(s, multiDay){
  const tl = Object.entries(s.types).sort((a,b)=>b[1]-a[1]).slice(0,2);
  const types = (tl.length === 1 && s.label.endsWith(tl[0][0])) ? "" : tl.map(([t,n]) => `${t} ${n}`).join(" · "); // 라벨에 이미 유형이 있으면 생략
  const rb = Math.max(1, Math.round(s.base)); // 표시는 정수(반올림), 배수도 반올림한 평소 건수 기준
  const base = s.base ? `평소 ${rb}건 → ${s.now}건 (${Math.round(s.now/rb)}배)` : `평소 0건 → ${s.now}건 (신규)`;
  const when = ""; // 피크일 표기(○일에 N건 집중)는 해석이 어려워 제외
  return { types, base, when };
}
const SPIKE_PER_TEAM = 5;
function teamSectionHead(t, n, unit){
  return `<div style="display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding-bottom:6px;border-bottom:2px solid ${t.color}55;">
    <span style="font-size:14px;font-weight:800;">${t.icon} ${t.name}</span>
    <span style="font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;background:${t.color}26;color:${t.color};">${t.team}</span>
    <span style="flex:1;"></span><span style="font-size:12px;color:${n?'var(--bad)':'var(--good)'};font-weight:700;">${n ? n + unit : '이상 없음'}</span></div>`;
}
function buildSpikeCardHTML(spikes, title, multiDay, prevLabel){
  window.__claimSpikes = spikes;
  const sections = CLAIM_TEAMS.map(t => {
    const list = spikes.filter(s => t.areas.includes(s.area)).slice(0, SPIKE_PER_TEAM);
    const rows = list.map(s => { const i = spikes.indexOf(s), x = spikeSentence(s, multiDay);
      return `<div onclick="openClaimModal('spike',${i})" style="display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;">
        <div style="flex:1;min-width:0;font-size:13.5px;line-height:1.55;"><b style="color:var(--ink);">${esc(s.label)}</b> <span style="color:var(--ink-dim);">${esc(x.types)}</span>${(() => { const h = s.level === "P" ? codeChipsHTML(codeBreakdown(s.items, spikeProdName(s))) : ""; return h ? `<div style="margin:2px 0;">${h}</div>` : '<br>'; })()}
          <span style="color:var(--bad);font-weight:700;">▲ ${x.base}</span><span style="color:var(--ink-dim);">${x.when}</span></div>
        <span style="color:var(--accent);font-size:12px;flex-shrink:0;">링크 ›</span></div>`; }).join("");
    return teamSectionHead(t, list.length, "건 급증") + (rows || `<div style="font-size:12.5px;color:var(--ink-dim);padding:4px 4px 2px;">평소 수준입니다.</div>`);
  }).join("");
  return `<div class="card" style="margin-bottom:16px;border-top:3px solid #F0555B;">
    <h2>⚡ 클레임 급증 인사이트<span class="tag">${title} · ${prevLabel} 평균 대비 2배↑ & 3건↑ · 섹션별 최대 ${SPIKE_PER_TEAM}건</span></h2>
    <div style="margin-top:4px;">${sections}</div>
  </div>`;
}

/* ---- 요일별 클레임 패턴: "무슨 요일에 클레임이 많은가" (일요일 제외, 요일별 하루 평균) ---- */
const WD_LABEL = ["일","월","화","수","목","금","토"], WD_DAYS = [1,2,3,4,5,6];
function buildWeekdayClaimCard(allItems, allDates, endMd, monthDates, monthLabel){
  let win;
  if (monthDates) win = monthDates.slice();
  else { const end = new Date(mdToISO(endMd)).getTime(); win = allDates.filter(d => { const t = new Date(mdToISO(d)).getTime(); return t <= end && t > end - 28 * 864e5; }); }
  win = win.filter(d => weekdayOf(d) !== 0);
  const set = new Set(win), nDays = [0,0,0,0,0,0,0];
  win.forEach(d => nDays[weekdayOf(d)]++);
  const cnt = CLAIM_TEAMS.map(() => [0,0,0,0,0,0,0]), tot = [0,0,0,0,0,0,0];
  allItems.forEach(it => { if (!set.has(it.r.date)) return; const w = weekdayOf(it.r.date); tot[w]++;
    CLAIM_TEAMS.forEach((t, k) => { if (it.claims.some(c => t.areas.includes(c.area))) cnt[k][w]++; }); });
  const avgOf = row => WD_DAYS.map(w => nDays[w] ? row[w] / nDays[w] : 0);
  const totAvg = avgOf(tot), teamAvg = cnt.map(avgOf);
  const valid = WD_DAYS.map((w, i) => nDays[w] ? i : -1).filter(i => i >= 0);
  window.__wdData = { teamAvg, totAvg };
  if (!valid.length) return "";
  const overall = valid.reduce((a, i) => a + totAvg[i], 0) / valid.length;
  const pk = valid.reduce((a, i) => totAvg[i] > totAvg[a] ? i : a, valid[0]);
  const pct = overall ? Math.round((totAvg[pk] / overall - 1) * 100) : 0;

  const range = monthDates ? monthLabel : `${dateLabel(win[0])} ~ ${dateLabel(win[win.length-1])}`;
  return `<div class="card" style="margin-bottom:16px;">
    <h2>📅 요일별 클레임<span class="tag">${range} · 요일별 하루 평균 건수 (일요일 제외)</span></h2>

/* ======== 데일리 VOC 기준 (유관부서 합의 · 클레임 칸반 보드(RC 스크립트)와 동일 기준) ========
   반복 클레임 사업장
    · MD  : 7일 이내 같은 사업장 + 같은 상품코드 클레임 2회(상담) 이상
    · SCM : 7일 이내 같은 사업장 배송 클레임 2회(상담) 이상 — 유형 무관(파손·오배송 등 합산)
    · 일간 = 선택일 접수 건이 포함된 사업장만(=당일 티켓 대상) · 주간 = 7일 · 월간 = 30일
   데일리 이슈 (일간)
    · MD  : 당일 같은 상품코드 클레임 3회 이상
    · SCM : 당일 배송 클레임 1회 이상 발생 센터 — 센터 + 클레임 사유 단위 (칸반 티켓 1건 = 센터·사유·날짜)
   ※ 기준 변경 시 이 객체와 RC 스크립트(RC_CFG)를 함께 수정 */
const VOC_RULE = {
  repeat: { daily:{ days:7, min:2, today:true }, weekly:{ days:7, min:2 }, monthly:{ days:30, min:2 } },
  dailyMdMin: 3, dailyScmMin: 1,
};
const REPEAT_PER_TEAM = 5;
const CLAIM_BOARD_URL = "https://script.google.com/macros/s/AKfycby4ubqxlnx_J8J04xJdInhji0Lt7hDou5zjwUcxrV_Uh6Was1J5oFdCegvfKQ5j-6eS/exec";
const boardLinkHTML = (label) => `<a href="${CLAIM_BOARD_URL}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap;">${label || '🗂 칸반에서 조치 확인 ↗'}</a>`;
const typesText = (o, max) => Object.entries(o || {}).sort((a,b) => b[1]-a[1]).slice(0, max || 3).map(([t,n]) => `${t} ${n}`).join(" · ");
const pname_ = (x) => (x.name && x.name !== x.code) ? x.name : '상품명 미확인'; // 상품 마스터에 없는 코드
const supOf_ = (it, code) => normalizeSupplier(it.supplier || productMaster?.[code]?.dist || "") || "-";

/* ---- 반복 클레임 사업장 ---- */
function detectRepeatStores(allItems, endMd, period){
  const rule = VOC_RULE.repeat[period] || VOC_RULE.repeat.daily;
  const out = { product:[], delivery:[], period: period || "daily", rule, endMd };
  if (!endMd) return out;
  const end = new Date(mdToISO(endMd)).getTime(), DAY = 864e5;
  const inWin = d => { const t = new Date(mdToISO(d)).getTime(); return t <= end && t > end - rule.days * DAY; };
  const gp = {}, gd = {};
  const grp = (g, k, init, it) => {
    const x = g[k] = g[k] || { ...init, key:k, items:[], seen:new Set(), days:new Set(), types:{}, centers:{} };
    if (x.seen.has(it)) return null;
    x.seen.add(it); x.items.push(it); x.days.add(it.r.date);
    if (it.r.center) x.centers[it.r.center] = (x.centers[it.r.center]||0) + 1;
    return x;
  };
  allItems.forEach(it => {
    const store = (it.r.store || "").trim(); if (!store || !inWin(it.r.date)) return;
    const sc = it.claims.filter(c => c.area === "supplier");
    if (sc.length) [...new Set(it.codes)].forEach(code => {          // MD: 사업장 + 상품코드
      const x = grp(gp, `${store}|${code}`, { store, code, name: productName(code), sup: supOf_(it, code) }, it);
      if (x) sc.forEach(c => x.types[c.type] = (x.types[c.type]||0) + 1);
    });
    const dc = [...new Set(it.claims.filter(c => c.area === "delivery").map(c => c.type))];
    if (dc.length){                                                    // SCM: 사업장 (배송 유형 합산)
      const x = grp(gd, store, { store }, it);
      if (x) dc.forEach(t => x.types[t] = (x.types[t]||0) + 1);
    }
  });
  const fin = g => Object.values(g).filter(x => x.items.length >= rule.min && (!rule.today || x.days.has(endMd)))
    .map(x => { const days = [...x.days].sort((a,b) => vipMdKey(a)-vipMdKey(b)); const cen = Object.entries(x.centers).sort((a,b) => b[1]-a[1])[0];
      const todayN = x.items.filter(i => i.r.date === endMd).length, prev = days.filter(d => d !== endMd);
      return { ...x, n:x.items.length, dayList:days, first:days[0], last:days[days.length-1], center: cen ? cen[0] : "", todayN, prevN: x.items.length - todayN, prevLast: prev[prev.length-1] }; })
    .sort((a,b) => b.n - a.n || vipMdKey(b.last) - vipMdKey(a.last));
  out.product = fin(gp); out.delivery = fin(gd);
  return out;
}
function repeatWhen_(x, rep){
  if (rep.rule.today) return x.prevN ? `오늘 ${x.todayN}건 · 이전 ${x.prevN}건 (최근 ${dateLabel(x.prevLast)})` : `오늘 ${x.todayN}건`;
  return `${x.dayList.length}일에 걸쳐 (${dateLabel(x.first)} ~ ${dateLabel(x.last)})`;
}
function repeatTitle_(x, g){ return g === "product" ? `${pname_(x)} · ${x.sup}` : `배송 클레임 ${typesText(x.types)}`; }
function repeatSub_(x, g, rep){
  return g === "product" ? `${x.code} · ${typesText(x.types, 2)}${x.center ? ' · ' + x.center : ''} · ${repeatWhen_(x, rep)}`
                         : `${x.center || '센터 미기재'} · ${repeatWhen_(x, rep)}`;
}
function ruleLabel_(rep){ return rep.rule.today ? `${dateLabel(rep.endMd)} 접수 건 포함 · 최근 ${rep.rule.days}일 ${rep.rule.min}회↑` : `${dateLabel(rep.endMd)} 기준 최근 ${rep.rule.days}일 · ${rep.rule.min}회↑`; }
function buildRepeatStoreCardHTML(rep){

  const sec = (t, g, ruleTxt) => {
    const list = rep[g].slice(0, REPEAT_PER_TEAM);
    const rows = list.map((x, i) => `<div onclick="openClaimModal('repeat','${g}:${i}')" style="display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;">
        <b style="width:20px;color:${i<3?t.color:'var(--ink-dim)'};">${i+1}</b>
        <div style="flex:1;min-width:0;font-size:13.5px;line-height:1.55;">
          <b style="color:var(--ink);">${esc(x.store)}</b>${storeBadgesHTML(latestUtags(x.items))} <span style="color:var(--ink-dim);">→</span> <b style="color:${t.color};">${esc(repeatTitle_(x, g))}</b><br>
          <span style="font-size:12px;color:var(--ink-dim);">${esc(repeatSub_(x, g, rep))}</span></div>
        <div style="font-size:18px;font-weight:800;">${x.n}<span style="font-size:12px;color:var(--ink-dim);font-weight:500;"> 회</span></div>
        <span style="color:var(--accent);font-size:12px;flex-shrink:0;">링크 ›</span></div>`).join("");
    const more = rep[g].length > REPEAT_PER_TEAM ? `<div style="font-size:12px;color:var(--ink-dim);padding:6px 4px;">외 ${rep[g].length - REPEAT_PER_TEAM}곳 · Slack 리뷰 텍스트와 칸반에서 전체 확인</div>` : '';
    return teamSectionHead(t, rep[g].length, "곳") + `<div style="font-size:11.5px;color:var(--ink-dim);padding:2px 4px 4px;">기준: ${ruleTxt}</div>` + (rows || `<div style="font-size:12.5px;color:var(--ink-dim);padding:4px 4px 2px;">해당 사업장이 없습니다.</div>`) + more;
  };
  return `<div class="card" style="margin-bottom:16px;border-top:3px solid #F76707;">
    <h2>🔁 반복 클레임 사업장<span class="tag">${ruleLabel_(rep)}</span></h2>
    <div style="margin-top:4px;">${sec(CLAIM_TEAMS[0], "product", `${rep.rule.days}일 이내 같은 사업장 · 같은 상품코드 ${rep.rule.min}회 이상`)}${sec(CLAIM_TEAMS[1], "delivery", `${rep.rule.days}일 이내 같은 사업장 배송 클레임 ${rep.rule.min}회 이상 (유형 합산)`)}</div>
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);margin-top:8px;"><span>누르면 해당 상담의 채널톡 링크가 열립니다.</span>${boardLinkHTML()}</div>
  </div>`;
}

/* ---- 데일리 이슈 (일간): MD 당일 같은 상품코드 3회↑ / SCM 당일 배송 클레임 발생 센터 ---- */
function detectDailyIssues(allItems, dayMd){
  const md = {}, scm = {};
  allItems.forEach(it => {
    if (it.r.date !== dayMd) return;
    const sc = it.claims.filter(c => c.area === "supplier");
    if (sc.length) [...new Set(it.codes)].forEach(code => {
      const x = md[code] = md[code] || { code, name: productName(code), sup: supOf_(it, code), items:[], types:{}, stores:new Set() };
      x.items.push(it); if (it.r.store) x.stores.add(it.r.store); sc.forEach(c => x.types[c.type] = (x.types[c.type]||0) + 1);
    });
    const cen = it.r.center || "센터 미기재";
    [...new Set(it.claims.filter(c => c.area === "delivery").map(c => c.type))].forEach(t => {   // SCM: 센터 + 사유
      const x = scm[cen + "|" + t] = scm[cen + "|" + t] || { center:cen, type:t, items:[], types:{ [t]:0 }, stores:new Set() };
      x.items.push(it); x.types[t]++; if (it.r.store) x.stores.add(it.r.store);
    });
  });
  const fin = (o, min) => Object.values(o).filter(x => x.items.length >= min).map(x => ({ ...x, n:x.items.length, storeN:x.stores.size })).sort((a,b) => b.n - a.n);
  const scmList = fin(scm, VOC_RULE.dailyScmMin), cenTot = {};
  scmList.forEach(x => cenTot[x.center] = (cenTot[x.center]||0) + x.n);
  scmList.sort((a,b) => cenTot[b.center] - cenTot[a.center] || a.center.localeCompare(b.center) || b.n - a.n);   // 같은 센터끼리 모아 보기
  return { day: dayMd, md: fin(md, VOC_RULE.dailyMdMin), scm: scmList };
}
function buildDailyIssueCardHTML(di){
  window.__claimDaily = di;
  const row = (g, x, i, t) => `<div onclick="openClaimModal('daily','${g}:${i}')" style="display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;">
      <b style="width:20px;color:${i<3?t.color:'var(--ink-dim)'};">${i+1}</b>
      <div style="flex:1;min-width:0;font-size:13.5px;line-height:1.55;">${g === "md"
        ? `<b style="color:var(--ink);">${esc(pname_(x))}</b> <span style="color:var(--ink-dim);">· ${esc(x.sup)}</span><br><span style="font-size:12px;color:var(--ink-dim);">${esc(x.code)} · ${esc(typesText(x.types, 2))} · 사업장 ${x.storeN}곳${badgeSummary(x.items) ? ' (' + esc(badgeSummary(x.items)) + ')' : ''}</span>`
        : `<b style="color:var(--ink);">${esc(x.center)}</b> <span style="color:var(--ink-dim);">·</span> <b style="color:${t.color};">${esc(x.type)}</b><br><span style="font-size:12px;color:var(--ink-dim);">사업장 ${x.storeN}곳${badgeSummary(x.items) ? ' (' + esc(badgeSummary(x.items)) + ')' : ''}</span>`}</div>
      <div style="font-size:18px;font-weight:800;">${x.n}<span style="font-size:12px;color:var(--ink-dim);font-weight:500;"> 건</span></div>
      <span style="color:var(--accent);font-size:12px;flex-shrink:0;">링크 ›</span></div>`;
  const sec = (t, g, list, unit, ruleTxt) => teamSectionHead(t, list.length, unit) + `<div style="font-size:11.5px;color:var(--ink-dim);padding:2px 4px 4px;">기준: ${ruleTxt}</div>` +
    (list.length ? list.map((x, i) => row(g, x, i, t)).join("") : `<div style="font-size:12.5px;color:var(--ink-dim);padding:4px 4px 2px;">해당 없음</div>`);
  return `<div class="card" style="margin-bottom:16px;border-top:3px solid #F0555B;">
    <h2>📌 데일리 이슈<span class="tag">${dateLabel(di.day)} 당일 접수 기준 · 담당 부서 조치 대상</span></h2>
    <div style="margin-top:4px;">${sec(CLAIM_TEAMS[0], "md", di.md, "개 상품", `당일 같은 상품코드 클레임 ${VOC_RULE.dailyMdMin}회 이상`)}${sec(CLAIM_TEAMS[1], "scm", di.scm, "건 (센터·사유)", `당일 배송 클레임 ${VOC_RULE.dailyScmMin}회 이상 발생 센터 · 센터와 사유별로 구분`)}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px;">${boardLinkHTML()}</div>
  </div>`;
}

/* ---- 팀별 이슈 리뷰 텍스트 (Slack 공유용 · 봇/칸반과 동일 기준) ---- */
function buildClaimReviewText(spikes, rep, ctx, teamKey){
  const strip = s => String(s||"").replace(/<[^>]+>/g, "");
  const line = "━━━━━━━━━━━━━━━━━━", di = ctx.daily;
  let out = `*[클레임 VOC 이슈 리뷰] ${ctx.title}*\n`;
  out += `_${di ? `데일리 이슈: MD 당일 같은 상품코드 ${VOC_RULE.dailyMdMin}회↑ · SCM 당일 배송 클레임 센터 / ` : ''}반복 사업장: ${ruleLabel_(rep)} / 급증: ${ctx.prevLabel} 평균 대비 2배↑·3건↑_\n`;
  CLAIM_TEAMS.filter(t => !teamKey || t.key === teamKey).forEach(t => {
    out += `${line}\n${t.icon} *${t.name}* ${t.mention}\n`;
    if (di && t.key === "product"){
      out += `📌 데일리 이슈: ${di.md.length ? di.md.length + "개 상품" : "없음"}\n`;
      di.md.forEach((x, i) => out += `   ${i+1}) ${x.code} ${pname_(x)} · ${x.sup} — ${typesText(x.types, 2)} / ${x.n}건 · 사업장 ${x.storeN}곳${badgeSummary(x.items) ? ' (' + badgeSummary(x.items) + ')' : ''}\n`);
    }
    if (di && t.key === "delivery"){
      out += `📌 데일리 이슈(센터·사유): ${di.scm.length ? di.scm.length + "건" : "없음"}\n`;
      di.scm.forEach((x, i) => out += `   ${i+1}) ${x.center} · ${x.type} ${x.n}건 — 사업장 ${x.storeN}곳${badgeSummary(x.items) ? ' (' + badgeSummary(x.items) + ')' : ''}\n`);
    }
    if (rep[t.key]){
      out += `🔁 반복 사업장: ${rep[t.key].length ? rep[t.key].length + "곳" : "없음"}\n`;
      rep[t.key].forEach((x, i) => out += `   ${i+1}) ${x.store}${storeBadgesText(latestUtags(x.items))} → ${repeatTitle_(x, t.key)} ${x.n}회 · ${repeatSub_(x, t.key, rep)}\n`);
    }
    const sp = spikes.filter(s => t.areas.includes(s.area)).slice(0, SPIKE_PER_TEAM);
    out += `⚡ 급증: ${sp.length ? sp.length + "건" : "없음"}\n`;
    sp.forEach((s, i) => { const x = spikeSentence(s, ctx.multiDay); const ct = s.level === "P" ? codeText(codeBreakdown(s.items, spikeProdName(s))) : ""; out += `   ${i+1}) ${s.label}${ct ? ` [${ct}]` : ""}${x.types ? ` — ${x.types}` : ""} / ${strip(x.base)}\n`; });
  });
  out += `${line}\n🗂 칸반 보드(조치 등록): ${CLAIM_BOARD_URL}`;
  return out.trim();
}
function buildClaimReviewBarHTML(spikes, rep, ctx){
  const texts = { all: buildClaimReviewText(spikes, rep, ctx) };
  CLAIM_TEAMS.forEach(t => texts[t.key] = buildClaimReviewText(spikes, rep, ctx, t.key));
  window.__claimReviewTexts = texts;
  const di = ctx.daily;
  const cnt = t => (di && t.key === "product" ? di.md.length : 0) + (di && t.key === "delivery" ? di.scm.length : 0) + (rep[t.key] ? rep[t.key].length : 0) + spikes.filter(s => t.areas.includes(s.area)).slice(0, SPIKE_PER_TEAM).length;
  return `<div class="card" style="margin-bottom:16px;">

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">

      ${CLAIM_TEAMS.map(t => `<button onclick="copyClaimReview('${t.key}',this)" style="border-color:${t.color};">${t.icon} ${t.team} <b style="color:${cnt(t)?'var(--bad)':'var(--ink-dim)'};">${cnt(t)}</b></button>`).join("")}

      <pre style="white-space:pre-wrap;font-size:12px;line-height:1.6;background:var(--panel-2);border-radius:8px;padding:10px 12px;margin-top:6px;">${esc(texts.all)}</pre></details>

function copyClaimReview(k, btn){
  const txt = (window.__claimReviewTexts || {})[k] || ""; if (!txt) return;
  const old = btn ? btn.innerHTML : "";
  const done = () => { if (btn){ btn.innerHTML = "✅ 복사됨"; setTimeout(() => btn.innerHTML = old, 1600); } };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(() => prompt("아래 내용을 복사하세요", txt));
  else prompt("아래 내용을 복사하세요", txt);
}

// 메인 화면용: 기간에 맞는 비교 구간 생성
function spikeBucketsFor(rawLog, dates){
  const allDates = [...new Set(rawLog.map(r => r.date))].sort((a,b)=>vipMdKey(a)-vipMdKey(b));
  if (dates.length === 1){
    const work = allDates.filter(d => weekdayOf(d) !== 0 && vipMdKey(d) < vipMdKey(dates[0])).slice(-4);
    return work.map(d => ({ label:d, dates:[d] })).concat([{ label:dates[0], dates }]);
  }
  const first = dates.slice().sort((a,b)=>vipMdKey(a)-vipMdKey(b))[0];
  const weeks = buildWeekList(allDates);
  const isWeek = dates.length <= 7;
  const list = isWeek ? weeks.map(w => ({ label:w.monday, dates:w.dates })) : buildMonthList(allDates).map(m => ({ label:m.label, dates:m.dates }));
  const idx = list.findIndex(b => b.dates.includes(first));
  return idx < 0 ? [] : list.slice(Math.max(0, idx-4), idx+1);
}

/* ===================== VIP CS 현황 (RAW "Tags" DF열 · VIP_4~6등급) ===================== */
const VIP_GRADES = [4,5,6];
const VIP_GRADE_COLORS = { 4:"#4C6EF5", 5:"#E8A33D", 6:"#E64980" };
// 월~토 일평균 계산에서 제외할 공휴일·전사 휴무일 (M/D) - 신규 휴일 발생 시 여기에 추가
const VIP_HOLIDAYS = ["8/15","8/17","9/24","9/25","9/26","9/28","10/3","10/5","10/9"];
const VIP_UNPROCESSED = ["missed","opened","snoozed"]; // 미처리 (closed=종료, initial=대기는 제외)
const VIP_EXTRA_AGENT_COLORS = { songsong:"#20C997", "미배정":"#5C677D" };
// 소문자 tags(상담 분류)의 중분류 중 "실제 이슈"만 집계 (환불·퀵 등 처리유형, 부재·중복·CALL·공급사명 제외)
const VIP_ISSUE_GROUPS = {
  "품질불량":"품질불량", "공급사클레임":"공급사클레임", "배송클레임":"배송클레임",
  "배송문의":"배송문의", "서비스이용문의":"서비스이용문의", "주문결제":"주문결제"
};
const VIP_SEL_STYLE = "background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:8px;font-size:13px;";

function switchToVip(){ viewMode = "vip"; window.scrollTo(0,0); if (lastLoadedData) render(lastLoadedData); }
function setVipPeriod(p){ vipPeriod = p; if (lastLoadedData) render(lastLoadedData); }
function onVipDate(iso){ if (iso){ vipSelDate = isoToMD(iso); if (lastLoadedData) render(lastLoadedData); } }
function onVipWeek(v){ vipSelWeek = v; if (lastLoadedData) render(lastLoadedData); }
function onVipMonth(v){ vipSelMonth = v; if (lastLoadedData) render(lastLoadedData); }

function vipMdKey(md){ const [m,d] = md.split("/").map(Number); return m*100+d; }
function vipTodayMD(){ const t = new Date(); return `${t.getMonth()+1}/${t.getDate()}`; }
function vipIsWorkday(md){ return weekdayOf(md) !== 0 && !VIP_HOLIDAYS.includes(md); }

// 상담 분류 tags → 이슈 유형 목록 (중분류 기준, 화이트리스트만)
function vipIssueTags(tagStr){
  const out = new Set();
  (tagStr||"").split(",").map(t=>t.trim()).filter(Boolean).forEach(t => {
    const parts = t.split("/").map(x=>x.trim());
    if (parts.length >= 2 && VIP_ISSUE_GROUPS[parts[1]]) out.add(VIP_ISSUE_GROUPS[parts[1]]);
  });
  return [...out];
}

function vipStats(rows, dateSet){
  const st = { total:0, g:{4:0,5:0,6:0}, closed:0, gClosed:{4:0,5:0,6:0}, unproc:0, gUnproc:{4:0,5:0,6:0}, waiting:0,
               agents:{}, groups:{}, groupByGrade:{}, unprocRows:[] };
  rows.forEach(r => {
    if (dateSet && !dateSet.has(r.date)) return;
    const s = (r.state||"").toLowerCase();
    st.total++; st.g[r.vip]++;
    const ag = r.agent;
    const a = st.agents[ag] = st.agents[ag] || { total:0, g:{4:0,5:0,6:0}, closed:0, unproc:0 };
    a.total++; a.g[r.vip]++;
    if (s === "closed"){ st.closed++; st.gClosed[r.vip]++; a.closed++; }
    else if (VIP_UNPROCESSED.includes(s)){ st.unproc++; st.gUnproc[r.vip]++; a.unproc++; st.unprocRows.push(r); }
    else if (s === "initial") st.waiting++;
    vipIssueTags(r.tags).forEach(group => {
      st.groups[group] = (st.groups[group]||0)+1;
      st.groupByGrade[group] = st.groupByGrade[group] || {4:0,5:0,6:0};
      st.groupByGrade[group][r.vip]++;
    });
  });
  return st;
}
// 처리율 = 종료 ÷ (종료 + 미처리)  · 대기(initial)는 아직 배정 전이라 분모에서 제외
function vipRate(closed, unproc){ const d = closed + unproc; return d > 0 ? closed / d : null; }

function vipDelta(cur, prev, unit, pct){
  if (cur == null || prev == null) return `<div class="delta" style="color:var(--ink-dim);">비교 데이터 없음</div>`;
  const diff = pct ? cur - prev : Math.round(cur) - Math.round(prev);
  if (pct){
    const p = Math.round(diff*1000)/10;
    return `<div class="delta ${p>=0?'up':'down'}">${unit} ${p>=0?'▲':'▼'} ${Math.abs(p)}%p</div>`;
  }
  const r = prev > 0 ? Math.round(diff/prev*100) : null;
  // 인입은 증가가 좋은 지표가 아니므로 중립색(증가=주황, 감소=회색)
  const col = diff > 0 ? "var(--accent)" : "var(--ink-dim)";
  return `<div class="delta" style="color:${col};">${unit} ${diff>=0?'▲':'▼'} ${Math.abs(Math.round(diff)).toLocaleString()}건${r!=null?` (${diff>=0?'+':'-'}${Math.abs(r)}%)`:''}</div>`;
}

function renderVip(data){
  const app = document.getElementById("app");
  const rawLog = data.rawLog || [];
  const navHTML = (picker) => `
    <header>
      <div>
        <h1>👑 VIP CS 현황 <span style="font-size:14px;color:var(--ink-dim);font-weight:500;">VIP 4~6등급</span></h1>
        <div class="sub">채널톡 RAW · Tags(DF열) VIP 등급 기준 · INBOUND 인입</div>
      </div>
      <div class="status">
        <div class="seg">
          <button class="${vipPeriod==='daily'?'on':''}" onclick="setVipPeriod('daily')">일간</button>
          <button class="${vipPeriod==='weekly'?'on':''}" onclick="setVipPeriod('weekly')">주간</button>
          <button class="${vipPeriod==='monthly'?'on':''}" onclick="setVipPeriod('monthly')">월간</button>
        </div>
        ${picker||""}
        <button onclick="switchToDaily()">← CX 메인 대시보드</button>
      </div>
    </header>`;

  if (!rawLog.length){
    destroyCharts();
    app.innerHTML = navHTML("") + `<div class="card loading">채널톡 RAW 데이터를 불러오는 중입니다… (용량이 커서 10~20초 정도 걸릴 수 있습니다)</div>`;
    return;
  }
  if (rawLog.hasVipTags === false){
    destroyCharts();
    app.innerHTML = navHTML("") + `<div class="card loading">RAW 시트에서 "Tags" 열을 찾지 못했습니다. DF열 헤더명이 "Tags"인지 확인해 주세요.</div>`;
    return;
  }

  const vipRows = rawLog.filter(r => r.direction === "INBOUND" && VIP_GRADES.includes(r.vip) && r.agent); // 담당자 미배정 건은 제외
  const allDates = [...new Set(rawLog.map(r => r.date))].sort((a,b)=>vipMdKey(a)-vipMdKey(b));
  const workDates = allDates.filter(vipIsWorkday);
  const todayMD = vipTodayMD();
  const completeWork = workDates.filter(d => vipMdKey(d) < vipMdKey(todayMD)); // 일평균은 마감된 날만
  const weeks = buildWeekList(allDates);
  const months = buildMonthList(allDates);

  // ---- 기간 선택 ----
  let periodDates, prevDates, title, picker, xDates, avgDates, prevAvgDates, prevLabel;
  if (vipPeriod === "daily"){
    const lastVipDate = vipRows.length ? vipRows.map(r=>r.date).sort((a,b)=>vipMdKey(a)-vipMdKey(b)).pop() : allDates[allDates.length-1];
    if (!vipSelDate || !allDates.includes(vipSelDate)) vipSelDate = lastVipDate;
    const d = vipSelDate;
    const prevWork = workDates.filter(x => vipMdKey(x) < vipMdKey(d)).pop();
    periodDates = [d]; prevDates = prevWork ? [prevWork] : null; prevLabel = "전 영업일 대비";
    title = dateLabel(d);
    const idx = workDates.indexOf(d);
    const end = idx >= 0 ? idx : workDates.filter(x => vipMdKey(x) <= vipMdKey(d)).length - 1;
    xDates = workDates.slice(Math.max(0, end-13), end+1);
    if (idx < 0) xDates = [...xDates, d].sort((a,b)=>vipMdKey(a)-vipMdKey(b));
    picker = `<input type="date" value="${mdToISO(d)}" min="${mdToISO(allDates[0])}" max="${mdToISO(allDates[allDates.length-1])}" onchange="onVipDate(this.value)">`;
  } else if (vipPeriod === "weekly"){
    if (!vipSelWeek || !weeks.find(w=>w.monday===vipSelWeek)) vipSelWeek = weeks[weeks.length-1].monday;
    const wi = weeks.findIndex(w=>w.monday===vipSelWeek);
    const w = weeks[wi];
    periodDates = w.dates; prevDates = wi>0 ? weeks[wi-1].dates : null; prevLabel = "전주 대비";
    title = dateRangeLabel(w.monday, w.saturday);
    xDates = w.dates.filter(vipIsWorkday);
    picker = `<select style="${VIP_SEL_STYLE}" onchange="onVipWeek(this.value)">${weeks.map(x=>`<option value="${x.monday}" ${x.monday===vipSelWeek?'selected':''}>${dateRangeLabel(x.monday,x.saturday)}</option>`).join("")}</select>`;
  } else {
    if (!vipSelMonth || !months.find(m=>m.key===vipSelMonth)) vipSelMonth = months[months.length-1].key;
    const mi = months.findIndex(m=>m.key===vipSelMonth);
    const mo = months[mi];
    periodDates = mo.dates; prevDates = mi>0 ? months[mi-1].dates : null; prevLabel = "전월 대비";
    title = `${mo.month}월`;
    xDates = mo.dates.filter(vipIsWorkday);
    picker = `<select style="${VIP_SEL_STYLE}" onchange="onVipMonth(this.value)">${months.map(x=>`<option value="${x.key}" ${x.key===vipSelMonth?'selected':''}>${x.label}</option>`).join("")}</select>`;
  }
  const isDaily = vipPeriod === "daily";
  avgDates = isDaily ? null : completeWork.filter(d => periodDates.includes(d));
  prevAvgDates = (!isDaily && prevDates) ? completeWork.filter(d => prevDates.includes(d)) : null;

  const cur = vipStats(vipRows, new Set(periodDates));
  const prev = prevDates ? vipStats(vipRows, new Set(prevDates)) : null;
  const avgOf = (ds) => { if (!ds || !ds.length) return null; const s = vipStats(vipRows, new Set(ds)); return { total: s.total/ds.length, g: {4:s.g[4]/ds.length, 5:s.g[5]/ds.length, 6:s.g[6]/ds.length}, days: ds.length }; };
  const curAvg = isDaily ? null : avgOf(avgDates);
  const prevAvg = isDaily ? null : avgOf(prevAvgDates);
  const partial = !isDaily && periodDates.some(d => vipMdKey(d) >= vipMdKey(todayMD));

  // ---- 1. CS 인입 ----
  const gradeKpi = (g) => {
    const curV = isDaily ? cur.g[g] : (curAvg ? curAvg.g[g] : null);
    const prevV = isDaily ? (prev ? prev.g[g] : null) : (prevAvg ? prevAvg.g[g] : null);
    return `<div class="kpi"><div class="label"><span class="grade-chip" style="background:${VIP_GRADE_COLORS[g]}"></span>VIP ${g}등급 ${isDaily?'인입':'일평균'}</div>
      <div class="val">${fmtNum(curV)}<span style="font-size:13px;color:var(--ink-dim);font-weight:500;"> 건</span></div>
      ${isDaily ? '' : `<div style="font-size:11.5px;color:var(--ink-dim);margin-top:4px;">기간 합계 ${fmtNum(cur.g[g])}건 · 비중 ${cur.total?Math.round(cur.g[g]/cur.total*100):0}%</div>`}
      ${vipDelta(curV, prevV, prevLabel)}</div>`;
  };
  const inboundKpis = `
    <div class="kpis vip-kpis">
      <div class="kpi" style="border-color:#F2C14E66;"><div class="label">VIP CS 총 인입${isDaily?'':' (기간 합계)'}</div>
        <div class="val" style="color:#F2C14E;">${fmtNum(cur.total)}<span style="font-size:13px;color:var(--ink-dim);font-weight:500;"> 건</span></div>
        ${isDaily ? vipDelta(cur.total, prev?prev.total:null, prevLabel) : `<div style="font-size:11.5px;color:var(--ink-dim);margin-top:6px;">${prevLabel.replace(' 대비','')} ${prev?fmtNum(prev.total):'-'}건</div>`}</div>
      ${isDaily ? '' : `<div class="kpi" style="border-color:#F2C14E66;"><div class="label">월~토 일평균 인입</div>
        <div class="val" style="color:#F2C14E;">${curAvg?fmtNum(curAvg.total):'-'}<span style="font-size:13px;color:var(--ink-dim);font-weight:500;"> 건/일</span></div>
        <div style="font-size:11.5px;color:var(--ink-dim);margin-top:4px;">영업일 ${curAvg?curAvg.days:0}일 기준${partial?' · 오늘 제외':''}</div>
        ${vipDelta(curAvg?curAvg.total:null, prevAvg?prevAvg.total:null, prevLabel)}</div>`}
      ${VIP_GRADES.map(gradeKpi).join("")}
    </div>`;

  // 요일별 일평균 (주간·월간)
  let weekdayTable = "";
  if (!isDaily && avgDates.length){
    const rowsWd = [1,2,3,4,5,6].map(wd => {
      const ds = avgDates.filter(d => weekdayOf(d) === wd);
      if (!ds.length) return null;
      const s = vipStats(vipRows, new Set(ds));
      return { wd, n: ds.length, total: s.total/ds.length, g: VIP_GRADES.map(g => s.g[g]/ds.length) };
    }).filter(Boolean);
    const maxWd = Math.max(...rowsWd.map(r=>r.total));
    weekdayTable = `
      <table style="margin-top:6px;">
        <tr><th>요일</th><th>일평균</th>${VIP_GRADES.map(g=>`<th>${g}등급</th>`).join("")}<th>집계일</th></tr>
        ${rowsWd.map(r=>`<tr><td>${WEEKDAY_KO[r.wd]}요일</td><td class="${r.total===maxWd?'hl-warn':'hl-num'}">${fmtNum(r.total)}</td>${r.g.map(v=>`<td>${fmtNum(v)}</td>`).join("")}<td style="color:var(--ink-dim);">${r.n}일</td></tr>`).join("")}
      </table>`;
  }

  // ---- 2. 처리율 ----
  const rateAll = vipRate(cur.closed, cur.unproc);
  const ratePrev = prev ? vipRate(prev.closed, prev.unproc) : null;
  const rateColor = (r) => r==null ? "var(--ink)" : r >= 0.95 ? "var(--good)" : r >= 0.85 ? "var(--accent)" : "var(--bad)";
  const rateKpis = `
    <div class="kpis vip-kpis">
      <div class="kpi"><div class="label">VIP CS 처리율</div>
        <div class="val" style="color:${rateColor(rateAll)};">${fmtPct(rateAll)}</div>
        <div style="font-size:11.5px;color:var(--ink-dim);margin-top:4px;">종료 ${fmtNum(cur.closed)}건 / 미처리 ${fmtNum(cur.unproc)}건${cur.waiting?` · 대기 ${cur.waiting}건`:''}</div>
        ${vipDelta(rateAll, ratePrev, prevLabel, true)}</div>
      ${VIP_GRADES.map(g => { const r = vipRate(cur.gClosed[g], cur.gUnproc[g]); const pr = prev ? vipRate(prev.gClosed[g], prev.gUnproc[g]) : null;
        return `<div class="kpi"><div class="label"><span class="grade-chip" style="background:${VIP_GRADE_COLORS[g]}"></span>${g}등급 처리율</div>
          <div class="val" style="color:${rateColor(r)};">${fmtPct(r)}</div>
          <div style="font-size:11.5px;color:var(--ink-dim);margin-top:4px;">종료 ${cur.gClosed[g]} / 미처리 ${cur.gUnproc[g]}</div>
          ${vipDelta(r, pr, prevLabel, true)}</div>`; }).join("")}
    </div>`;
  const STATE_KO = { missed:"미처리", opened:"처리중", snoozed:"보류" };

    <div class="footer-note">
      VIP 등급은 RAW 시트 DF열 "Tags"의 VIP_4~6등급 기준(현재 등급)이며, 담당자가 배정된 INBOUND 상담만 집계합니다(미배정 제외).<br>
      처리율 = 종료(closed) ÷ (종료 + 미처리[missed·opened·snoozed]) · 대기(initial)는 제외 · 일평균은 일요일·공휴일·당일을 제외한 월~토 영업일 기준입니다.<br>
      이슈 유형은 상담 분류 tags의 중분류(품질불량·공급사클레임·배송클레임·배송문의·서비스이용문의·주문결제) 기준이며, 부재·중복 등은 제외합니다.

  Chart.defaults.borderColor = "#28324D";
  const perDay = xDates.map(d => vipStats(vipRows, new Set([d])));
  const tickColor = (ctx) => { const d = xDates[ctx.index]; return d === vipSelDate && isDaily ? "#F2C14E" : "#8B96AD"; };

  if (el1) charts.vipInbound = new Chart(el1, {

    data: { labels: xDates.map(d => dateLabel(d)),

  const el3 = document.getElementById("vipChartAgent");
  if (el3 && agentRows.length) charts.vipAgent = new Chart(el3, {
    type: "bar",
    data: { labels: agentRows.map(([n])=>n),
      datasets: VIP_GRADES.map(g => ({ label: `${g}등급`, data: agentRows.map(([,a])=>a.g[g]||0), backgroundColor: VIP_GRADE_COLORS[g]+"CC", borderRadius: 3, stack: "s" })) },
    options: { indexAxis: "y", plugins:{ legend:{ position:"bottom", labels:{boxWidth:10} } },

  });
  const el4 = document.getElementById("vipChartIssue");
  if (el4 && groupRows.length){
    const pal = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC"];
    charts.vipIssue = new Chart(el4, {
      type: "bar",
      data: { labels: groupRows.map(([g],i)=>`${i+1}위 ${g}`),
        datasets: [{ data: groupRows.map(([,n])=>n), backgroundColor: groupRows.map((_,i)=> i<3 ? VIP_TIER[i] : pal[i%pal.length]+"AA"), borderRadius: 4 }] },
      options: { indexAxis: "y", plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: (i) => `${i.raw}건 (${issueTotal?Math.round(i.raw/issueTotal*100):0}%)` } } },
        scales:{ x:{ beginAtZero:true, grid:{color:"#28324D"} }, y:{ grid:{display:false} } } }

/* ===================== 카드 접기/펼치기 (가독성) ===================== */
// 모든 카드 제목을 누르면 접기/펼치기. 상태는 브라우저에 기억. MBO·상세성 카드는 기본 접힘.
const CARD_DEFAULT_COLLAPSED = /MBO|상담원별 상세|일별 상세|생산성 점수|시간대별 통화 결과|발주 전환율|레터링|SKU|상관도|근무 스케줄|요일 및 시간별|담당자별 생산성|이슈 유형별 \(월간\)/;
function cardStateLoad(){ try { return JSON.parse(localStorage.getItem("cardState")||"{}"); } catch(e){ return {}; } }
function cardStateSave(st){ try { localStorage.setItem("cardState", JSON.stringify(st)); } catch(e){} }
function cardTitleOf(h2){ const c = h2.cloneNode(true); c.querySelectorAll(".tag").forEach(t => t.remove()); return c.textContent.replace(/\s+/g," ").replace(/\d+\/\d+\([^)]*\)/g,"").trim(); }
function resizeChartsSoon(){ setTimeout(() => Object.values(charts).forEach(c => { try { c && c.resize && c.resize(); } catch(e){} }), 30); }
function enhanceCards(){
  const app = document.getElementById("app"); if (!app) return;
  const st = cardStateLoad();
  const cards = [...app.querySelectorAll(".card")].filter(c => c.querySelector(":scope > h2") && !c.classList.contains("loading"));
  cards.forEach(card => {
    const h2 = card.querySelector(":scope > h2");
    const key = viewMode + ":" + cardTitleOf(h2);
    card.classList.add("collapsible");
    const collapsed = key in st ? st[key] : CARD_DEFAULT_COLLAPSED.test(key);
    card.classList.toggle("collapsed", collapsed);
    h2.title = "눌러서 접기/펼치기";
    h2.onclick = (e) => {
      if (e.target.closest("a,button,select,input")) return;
      const now = !card.classList.contains("collapsed");
      card.classList.toggle("collapsed", now);
      const s2 = cardStateLoad(); s2[key] = now; cardStateSave(s2);
      if (!now) resizeChartsSoon();
    };
  });
  const header = app.querySelector(":scope > header");
  if (header && cards.length > 2 && !app.querySelector(".card-toolbar")){
    const bar = document.createElement("div");
    bar.className = "card-toolbar";
    bar.innerHTML = `<span style="color:var(--ink-dim);align-self:center;">카드 제목을 누르면 접고 펼칠 수 있어요</span><button data-act="open">모두 펼치기</button><button data-act="close">모두 접기</button><button data-act="reset">기본 보기</button>`;
    bar.onclick = (e) => {
      const act = e.target.dataset?.act; if (!act) return;
      const s2 = cardStateLoad();
      cards.forEach(card => {
        const key = viewMode + ":" + cardTitleOf(card.querySelector(":scope > h2"));
        if (act === "reset"){ delete s2[key]; card.classList.toggle("collapsed", CARD_DEFAULT_COLLAPSED.test(key)); }
        else { const c = act === "close"; s2[key] = c; card.classList.toggle("collapsed", c); }
      });
      cardStateSave(s2); resizeChartsSoon();
    };
    header.after(bar);
  }
}

/* ===================== 렌더 ===================== */
function render(data){ renderCore(data); try { enhanceCards(); } catch(e){ console.warn("카드 접기 적용 실패", e); } }
function renderCore(data){
  if (viewMode === "vip"){ renderVip(data); return; }
  if (viewMode === "cost"){ renderCost(data); return; }
  if (viewMode === "claim"){ renderClaim(data); return; }
  if (viewMode === "weekly"){ renderWeekly(data); return; }
  if (viewMode === "monthly"){ renderMonthly(data); return; }
  const { dates, sections, totalRow, skuRow, schedule, outcall, delay30, delayHold, rawLog, onboardCalls } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);

  let todayIdx;
  if (selectedDateOverride && dates.includes(selectedDateOverride)){
    todayIdx = dates.indexOf(selectedDateOverride);
  } else {
    todayIdx = lastActiveDateIdx(dates, sections);
    selectedDateOverride = null;
  }
  const today = dates[todayIdx];
  const ydayIdx = Math.max(0, todayIdx - 1);
  const yday = dates[ydayIdx];

  // recent window for charts
  const N = 14;
  const start = Math.max(0, todayIdx - N + 1);
  const recentDates = dates.slice(start, todayIdx + 1);
  const weekDates = [-2,-1,0,1,2,3,4,5].map(n => addDaysMD(today, n)); // 근무 스케줄: D-2 ~ D+5

  // 스케줄 정보 (오늘 기준)
  const issueToday = schedule?.issueStatus?.[today];
  const minStaffToday = schedule?.minStaff?.[today];
  const totalStaffToday = schedule?.totalStaff?.[today];
  const isUnderstaffed = issueToday === "정원 미달";

  // 음수 이상치는 조용히 0으로 보정 (경영진 화면이라 경고 문구는 노출하지 않음)
  function clampNeg(raw){ return (raw != null && raw < 0) ? 0 : raw; }

  const inboundAgentsSum = clampNeg(sum(agents.map(a => sections["상담인입"][a][today])));
  const inboundYdayAgentsSum = sum(agents.map(a => sections["상담인입"][a][yday]));
  const depMap = departedInboundByDate(rawLog, sections);
  const depCompMap = departedCompletedByDate(rawLog, sections);
  const depToday = depMap.get(today) || 0;
  const inboundToday = totalInboundOn(today, totalRow, sections, agents, depMap);
  const inboundYday = totalInboundOn(yday, totalRow, sections, agents, depMap);
  const completeToday = totalCompletedOn(today, sections, agents, depCompMap);
  const completeRateToday = inboundToday>0 ? Math.min(1, completeToday/inboundToday) : null;
  const delayToday = clampNeg(sum(agents.map(a=>sections["30분 이상 지연"]?.[a]?.[today])));
  const DELAY_TARGET_RATE = 0.03; // 완료건 대비 3% 목표
  const delayRateToday = (completeToday!=null && completeToday>0) ? delayToday/completeToday : null;
  const delayOverTarget = delayRateToday!=null && delayRateToday > DELAY_TARGET_RATE;
  const avgProcessToday = clampPct(sections["상담처리율_%"]?.["AVG"]?.[today]);

  // WoW: 오늘 vs 7일 전 같은 요일 (전체 인입 합계 기준)
  const wowIdx = todayIdx - 7;
  const wowDate = dates[wowIdx];
  const inboundWow = wowDate!=null ? totalInboundOn(wowDate, totalRow, sections, agents, depMap) : null;
  const callSecDaily = buildCallSection(data, [today], wowDate!=null ? [wowDate] : null, { periodLabel: dateLabel(today), prevLabel: "전주 동요일", canvasId: "chartCallDaily", trendDates: recentDates });
  const callInToday = callSecDaily.callIn, callInWow = wowDate!=null ? callStats(rawLog, new Set([wowDate])).in : 0;
  const unifiedToday = inboundToday + callInToday, unifiedWow = inboundWow!=null ? inboundWow + callInWow : null;
  const unifiedWowDelta = unifiedWow ? (unifiedToday - unifiedWow) / unifiedWow : null;
  const wowDelta = inboundWow!=null && inboundWow>0 ? ((inboundToday-inboundWow)/inboundWow) : null;

  // 통화완료율 WoW
  const completeRateWow = wowDate!=null ? clampPct(sections["상담완료율_%"]?.["Total"]?.[wowDate]) : null;
  const completeRateDelta = (completeRateToday!=null && completeRateWow!=null) ? (completeRateToday - completeRateWow) : null;

  // 평균 담당자별 인입량 (개별 상담원 배정 건 기준 / 오늘 / 전주 동요일)
  const inboundAgentsWow = wowDate!=null ? sum(agents.map(a=>sections["상담인입"][a][wowDate])) : null;
  const avgPerAgentToday = agents.length ? inboundAgentsSum / agents.length : null;

  // 부재율 (CS_Tracking 부재율 섹션 - 목표 미설정, 참고 지표)
  const absentSection = sections["부재율"] || {};
  const absentToday = clampNeg(absentSection["부재건수"]?.[today]);
  const absentRateToday = clampPct(absentSection["부재_%"]?.[today]);
  const absentWow = wowDate!=null ? clampNeg(absentSection["부재건수"]?.[wowDate]) : null;
  const absentRateWow = wowDate!=null ? clampPct(absentSection["부재_%"]?.[wowDate]) : null;
  const absentDelta = (absentToday!=null && absentWow!=null && absentWow>0) ? (absentToday-absentWow)/absentWow : null;
  const absentRateDelta = (absentRateToday!=null && absentRateWow!=null) ? absentRateToday-absentRateWow : null;
  const avgPerAgentWow = (inboundAgentsWow!=null && agents.length) ? inboundAgentsWow / agents.length : null;
  const avgPerAgentDelta = (avgPerAgentWow!=null && avgPerAgentWow>0) ? ((avgPerAgentToday-avgPerAgentWow)/avgPerAgentWow) : null;

  // 아웃콜 완료율 (오늘 / 전주 동요일) - 전 카테고리 합산 가중평균
  function outcallCompletionRate(date){
    if (!outcall || !outcall.data) return { rate: null, inbound: 0, completed: 0 };
    let inbound = 0, completed = 0;
    Object.values(outcall.data).forEach(entities => {
      const t = entities["Total"];
      if (!t) return;
      inbound += t["인입"]?.[date] || 0;
      completed += t["통화완료"]?.[date] || 0;
    });
    return { rate: inbound>0 ? completed/inbound : null, inbound, completed };
  }
  const outcallToday = outcallCompletionRate(today);

  // 팀원당 평균 지표
  const avgCompletePerAgent = agents.length ? completeToday/agents.length : null;
  const avgOutcallPerAgent = agents.length ? outcallToday.completed/agents.length : null;

  // 30분 이상 지연 WoW (Total 기준, 감소가 개선이므로 색상 반대로 적용)
  const delayWowRaw = wowDate!=null ? (sections["30분 이상 지연"]?.["Total"]?.[wowDate] ?? sum(agents.map(a=>sections["30분 이상 지연"]?.[a]?.[wowDate]))) : null;
  const delayWow = (delayWowRaw != null && delayWowRaw < 0) ? 0 : delayWowRaw;
  let delayDelta = null;
  let delayDeltaText = "전주 데이터 없음";
  let delayDeltaClass = "";
  if (delayWow != null){
    if (delayWow === 0){
      if (delayToday === 0){ delayDelta = 0; delayDeltaText = "전주 대비 변화 없음 (0건)"; delayDeltaClass = "up"; }
      else { delayDelta = null; delayDeltaText = `전주 0건 → 금주 ${fmtNum(delayToday)}건`; delayDeltaClass = "down"; }
    } else {
      delayDelta = (delayToday-delayWow)/delayWow;
      delayDeltaText = (delayDelta<=0?"▼ ":"▲ ")+Math.abs(Math.round(delayDelta*100))+"% (전주 동요일 대비)";
      delayDeltaClass = delayDelta<=0 ? "up" : "down";
    }
  }

  // 아웃콜 주별 트래킹 (월요일 시작 기준 주 단위, 카테고리별 집계)
  function weekKeyOf(md){
    if (!md || typeof md !== "string") return "1/1";
    const [m,d] = md.split("/").map(Number);
    const dt = new Date(DATA_YEAR, m-1, d);
    const day = dt.getDay();
    const diffToMonday = (day===0 ? -6 : 1-day);
    const monday = new Date(dt); monday.setDate(dt.getDate()+diffToMonday);
    return `${monday.getMonth()+1}/${monday.getDate()}`;
  }
  const weeklyByCategory = {}; // category -> weekKey -> {inbound, completed}
  (outcall.categories||[]).forEach(c => { weeklyByCategory[c] = {}; });
  (outcall.dates||[]).forEach(d => {
    const wk = weekKeyOf(d);
    (outcall.categories||[]).forEach(c => {
      weeklyByCategory[c][wk] = weeklyByCategory[c][wk] || { inbound:0, completed:0 };
      const t = outcall.data[c]?.["Total"];
      if (!t) return;
      weeklyByCategory[c][wk].inbound += t["인입"]?.[d] || 0;
      weeklyByCategory[c][wk].completed += t["통화완료"]?.[d] || 0;
    });
  });
  const allWeekKeys = [...new Set((outcall.dates||[]).map(weekKeyOf))].sort((a,b) => {
    const [am,ad] = a.split("/").map(Number), [bm,bd] = b.split("/").map(Number);
    return (am*100+ad) - (bm*100+bd);
  });

  // 카테고리별 이슈 (배송문의/배송클레임/서비스이용문의 등) 랭킹 + WoW + 주별 트렌드
  const issueSection = rawIssueSection(rawLog) || sections["카테고리별 이슈"] || {}; // 클레임 VOC와 같은 RAW 기준
  const issueCategories = Object.keys(issueSection);
  const issueTodayClamped = {}; // 중복 카운트 방지를 위해 카테고리별로 한 번만 클램프
  issueCategories.forEach(c => { issueTodayClamped[c] = clampNeg(issueSection[c][today] || 0); });
  const issueTodayRanking = issueCategories
    .map(c => ({ category:c, val: issueTodayClamped[c] }))
    .sort((a,b) => b.val - a.val);
  const issueWow = issueCategories.map(c => {
    const t = issueTodayClamped[c];
    const wRaw = wowDate!=null ? (issueSection[c][wowDate] || 0) : null;
    const w = (wRaw != null && wRaw < 0) ? 0 : wRaw;
    const delta = (w!=null && w>0) ? (t-w)/w : null;
    return { category:c, today:t, wow:w, delta };
  });
  const weeklyByIssue = {}; // category -> weekKey -> count
  issueCategories.forEach(c => { weeklyByIssue[c] = {}; });
  dates.forEach(d => {
    const wk = weekKeyOf(d);
    issueCategories.forEach(c => {
      weeklyByIssue[c][wk] = (weeklyByIssue[c][wk] || 0) + (issueSection[c][d] || 0);
    });
  });
  const issueWeekKeys = [...new Set(dates.map(weekKeyOf))].sort((a,b) => {
    const [am,ad] = a.split("/").map(Number), [bm,bd] = b.split("/").map(Number);
    return (am*100+ad) - (bm*100+bd);
  });

  // 시간대별 인입 분포 (오늘 / 최근 기간 평균) - RAW 로그의 createdAt 기준
  const recentDatesSet = new Set(recentDates);
  const hourlyToday = new Array(24).fill(0);
  const hourly2wSum = new Array(24).fill(0);
  const daysWithDataSet = new Set();
  const WEEKDAY_LABELS = ["일","월","화","수","목","금","토"];
  const heatmapSums = Array.from({length:7}, () => new Array(24).fill(0));
  const weekdayDateCount = new Array(7).fill(0); // 요일별로 전체 기간 내 며칠이 있었는지 (평균 분모 - 표본 안정성을 위해 전체 기간 사용)
  dates.forEach(d => { weekdayDateCount[weekdayOf(d)]++; });
  const heatmapWindowSet = new Set(dates);
  (rawLog||[]).forEach(r => {
    if (r.direction !== "INBOUND" || !agents.includes(r.agent)) return; // CS_Tracking 상담인입 범위(담당자 5명·인바운드)와 동일하게 맞춤
    if (r.date === today) hourlyToday[r.hour]++;
    if (recentDatesSet.has(r.date)){
      hourly2wSum[r.hour]++;
      daysWithDataSet.add(r.date);
    }
    if (heatmapWindowSet.has(r.date)){
      const wd = weekdayOf(r.date);
      heatmapSums[wd][r.hour]++;
    }
  });
  const daysWithData = daysWithDataSet.size || 1;
  const hourly2wAvg = hourly2wSum.map(v => v/daysWithData);
  const peakHourToday = hourlyToday.indexOf(Math.max(...hourlyToday));
  const peakHour2w = hourly2wAvg.indexOf(Math.max(...hourly2wAvg));
  const heatmapCounts = heatmapSums.map((row,wd) => row.map(v => weekdayDateCount[wd] > 0 ? Math.round(v/weekdayDateCount[wd]) : 0));
  const heatmapMax = Math.max(1, ...heatmapCounts.flat());
  let spikeHour = -1, spikeDiff = 0;
  hourlyToday.forEach((v,h) => {
    const diff = v - hourly2wAvg[h];
    if (diff > spikeDiff){ spikeDiff = diff; spikeHour = h; }
  });

  // 인사이트 카드 자동 생성
  const insights = [];
  {
    const rateEntries = agents
      .filter(a => {
        const workStatus = schedule?.schedule?.[a]?.[today];
        const isOff = workStatus && OFF_STATUSES.includes(workStatus);
        const hasInbound = (sections["상담인입"]?.[a]?.[today] || 0) > 0;
        return !isOff && hasInbound;
      })
      .map(a => [a, sections["상담완료율_%"]?.[a]?.[today]])
      .filter(([,v]) => v!=null);
    if (rateEntries.length){
      const best = rateEntries.reduce((a,b) => b[1]>a[1] ? b : a);
      insights.push(`오늘 완료율 최고 상담원은 <b>${best[0]}</b> (${fmtPct(best[1])})입니다. (근무 중 · 인입 있는 상담원 기준)`);

    const delayByAgent = {};

    } else if (delayToday > 0){
      // CS_Tracking 집계에는 지연이 있으나 상세 시트에 아직 해당 일자 행이 없는 경우 (상세 입력 지연)
      insights.push(`오늘 30분 이상 지연은 <b>${fmtNum(delayToday)}건</b>입니다. (상세 내역은 아직 입력 전이라 담당자별 구분은 표시되지 않습니다)`);
    } else {

        : `오늘 지연율은 완료건 대비 <b>${fmtPct(delayRateToday)}</b>로 목표(3%) 이내입니다.`);

      insights.push(`오늘 부재율은 <b>${fmtPct(absentRateToday)}</b>입니다${trendTxt}.`);
    }
    if (outcall && outcall.categories?.length){
      const catRates = outcall.categories.map(c => {

        const rate = inb ? (t?.["통화완료"]?.[today] || 0) / inb : null;
        return [c, rate];
      }).filter(([,v]) => v!=null);
      if (catRates.length){
        const bestCat = catRates.reduce((a,b) => b[1]>a[1] ? b : a);

      const targetMiss = catRates.filter(([,r]) => r < OUTCALL_TARGET_RATE);

      if (targetMiss.length){
        const worst = targetMiss.reduce((a,b)=>b[1]<a[1]?b:a);
        insights.push(`아웃콜 성공률이 타겟(${Math.round(OUTCALL_TARGET_RATE*100)}%)에 가장 못 미치는 카테고리는 <b>${catLabel(worst[0])}</b> (${fmtPct(worst[1])})입니다.`);

      const outcallByAgent = agents.map(a => {
        const completed = sum((outcall.categories||[]).map(c => outcall.data[c]?.[a]?.["통화완료"]?.[today] || 0));
        return [a, completed];
      }).filter(([,v]) => v>0).sort((x,y)=>y[1]-x[1]);
      if (outcallByAgent.length) insights.push(`오늘 아웃콜을 가장 많이 성공시킨 상담원은 <b>${outcallByAgent[0][0]}</b> (통화완료 ${fmtNum(outcallByAgent[0][1])}건)입니다.`);
    }
    const inboundRanking = agents.map(a => [a, sections["상담인입"][a][today] || 0]).sort((x,y) => y[1]-x[1]);
    if (inboundRanking.length && inboundRanking[0][1] > 0){
      insights.push(`오늘 인입이 가장 많은 상담원은 <b>${inboundRanking[0][0]}</b> (${fmtNum(inboundRanking[0][1])}건)입니다.`);
    }
    if (isUnderstaffed){
      insights.push(`오늘은 <b>정원 미달</b> 상태입니다 (근무 ${totalStaffToday}명 / 최소 ${minStaffToday}명).`);
    }
    if (issueTodayRanking.length && issueTodayRanking[0].val > 0){
      insights.push(`오늘 가장 많이 발생한 이슈 카테고리는 <b>${issueTodayRanking[0].category}</b> (${fmtNum(issueTodayRanking[0].val)}건)입니다.`);
    }
    const risingIssues = issueWow.filter(x => x.delta!=null && x.delta>0).sort((a,b)=>b.delta-a.delta);
    if (risingIssues.length){
      const r = risingIssues[0];
      insights.push(`전주 동요일 대비 가장 많이 증가한 이슈는 <b>${r.category}</b> (▲ ${Math.round(r.delta*100)}%)입니다.`);
    }
    if (peakHour2w >= 0 && hourly2wAvg[peakHour2w] > 0){
      insights.push(`최근 ${daysWithData}일 평균 기준 인입이 가장 몰리는 시간대는 <b>${peakHour2w}시</b>입니다 (평균 ${hourly2wAvg[peakHour2w].toFixed(1)}건).`);
    }
    if (spikeHour >= 0 && spikeDiff >= 1){
      insights.push(`오늘은 평소보다 <b>${spikeHour}시</b>에 인입이 유독 많았습니다 (오늘 ${hourlyToday[spikeHour]}건 · 평균 ${hourly2wAvg[spikeHour].toFixed(1)}건).`);
    }
  }

  if (agentDetailChart){ agentDetailChart.destroy(); agentDetailChart = null; }
  openAgentPanel = null;

  // 요일별 인당 목표 인입량 (최근 4주 · 팀장급 제외 · 변동성 큰 요일은 범위)
  const weekdayTargets = computeWeekdayInboundTargets(dates, sections, agents);

  // 아웃콜 카테고리별 담당자 목표 달성 (당일)
  const outcallCats = outcall?.categories || [];
  const outcallWeekdayTargets = {};
  const outcallAchToday = {};
  const outcallRateToday = {};
  outcallCats.forEach(cat => {
    const t = computeWeekdayOutcallTargets(dates, outcall, cat, agents);
    outcallWeekdayTargets[cat] = t;
    outcallAchToday[cat] = agentOutcallTargetAchievement(agents, [today], outcall, cat, schedule, t);
    outcallRateToday[cat] = agentOutcallRateForPeriod(agents, [today], outcall, cat, schedule);
  });

  // SKU 배송물량 지표 (요일별 평균 + 인입량 상관도 + 전주 동요일 비교)
  const inboundOfDate = (d) => totalInboundOn(d, totalRow, sections, agents, depMap);
  const skuToday = skuRow?.[today] ?? null;
  const skuWow = wowDate!=null ? (skuRow?.[wowDate] ?? null) : null;
  const skuWowDelta = (skuToday!=null && skuWow!=null && skuWow>0) ? (skuToday-skuWow)/skuWow : null;
  const skuWeekdayAvg = skuByWeekday(dates, skuRow, 4);
  const skuCorrAll = skuInboundCorrelation(dates, skuRow, inboundOfDate);
  const skuCorrByWeekday = {};
  for (let wd=1; wd<=6; wd++){
    const wdDates = dates.filter(d => weekdayOf(d) === wd);
    skuCorrByWeekday[wd] = skuInboundCorrelation(wdDates, skuRow, inboundOfDate);
  }
  const todayWd = weekdayOf(today);
  const todayTarget = weekdayTargets[todayWd];
  const targetPool = agents.filter(a => !TARGET_EXCLUDED_AGENTS.includes(a));
  const targetComparisonToday = targetPool.map(a => {
    const actual = sections["상담인입"]?.[a]?.[today] || 0;
    const st = schedule?.schedule?.[a]?.[today];
    const isOff = st && OFF_STATUSES.includes(st);
    let status = "neutral";
    if (!isOff && todayTarget){
      const floor = todayTarget.volatile ? todayTarget.min : todayTarget.median;
      status = actual >= floor ? "ok" : "low";
    }
    return { agent:a, actual, isOff, status };
  });
  if (todayTarget){
    insights.push(`오늘(${WEEKDAY_KO[todayWd]}) 인당 목표 CS처리량은 <b>${weekdayTargetLabel(todayTarget)}</b>입니다 (최근 4주 기준).`);
    const lowAgents = targetComparisonToday.filter(c => c.status === "low").map(c => c.agent);
    if (lowAgents.length){
      insights.push(`오늘 목표에 못 미친 상담원은 <b>${lowAgents.join(", ")}</b>입니다 — 쏠림 여부 확인이 필요합니다.`);

  }

  // MBO 공통 목표 달성 현황 (오늘 + 최근 기간 흐름)
  const mboAgents = agents.filter(a => MBO_WEIGHTS[a]);
  const mboToday = Object.fromEntries(mboAgents.map(a => [a, mboScoresForAgent(sections, delay30, outcall, a, today)]));
  const mboDetailToday = Object.fromEntries(mboAgents.map(a => [a, mboDetailForAgentPeriod(sections, delay30, outcall, a, [today])]));
  const hourlyStatsToday = outcallHourlyStats(onboardCalls, d => d.dateMD === today);
  const conversionAll = onboardConversion(onboardCalls);
  const mboTrend = recentDates.map(d => {
    const dayScores = mboAgents.map(a => mboScoresForAgent(sections, delay30, outcall, a, d).weighted).filter(v=>v!=null);
    return dayScores.length ? sum(dayScores)/dayScores.length : null;

  const app = document.getElementById("app");
  app.innerHTML = `

          <thead><tr><th>상담원</th>${weekDates.map(d=>`<th>${dateLabel(d, {html:true})}</th>`).join("")}</tr></thead>
          <tbody>
            ${agents.map(a => `<tr><td>${a}</td>${weekDates.map(d=>{
              const st = schedule?.schedule?.[a]?.[d];
              const color = scheduleStatusColor(st);
              return `<td style="color:${color}">${st || '-'}</td>`;
            }).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="footer-note">
      데이터 출처: CS_Tracking · 근무 스케줄 · Out Call_Tracking · 30분 지연 체크 · 응대지연_보류 (Google Sheets 실시간 조회) · ${REFRESH_MS/60000}분마다 변경 여부 확인 후 바뀐 경우에만 화면 갱신 · 일요일은 휴무로 인입 0건 처리됨 · 상단 날짜 선택기로 과거 특정일 조회 가능.
    </div>
  `;

  document.getElementById("refreshBtn").onclick = () => { refresh(true); refreshRawLog(true); };

  const workingAgentsToday = agents.filter(a => { const st = schedule?.schedule?.[a]?.[today]; return !(st && OFF_STATUSES.includes(st)); });
  const targetCompletedToday = workingAgentsToday.length
    ? sum(workingAgentsToday.map(a => sections["상담완료"]?.[a]?.[today] || 0)) / workingAgentsToday.length
    : 0;
  function productivityScoreOf(a){
    const st = schedule?.schedule?.[a]?.[today];
    if (st && OFF_STATUSES.includes(st)) return null; // 휴무자는 점수 대상에서 제외
    const comp = sections["상담완료"]?.[a]?.[today] || 0;
    const delay = sections["30분 이상 지연"]?.[a]?.[today] || 0;
    const volume = targetCompletedToday>0 ? Math.min(100, (comp/targetCompletedToday)*100) : 0;
    const speed = Math.max(0, 100 - delay*DELAY_PENALTY);
    return volume*0.6 + speed*0.4;
  }
  const productivityScores = agents.map(productivityScoreOf);

  const recentTotalsWithDep = recentDates.map(d => totalInboundOn(d, totalRow, sections, agents, depMap));
  drawCharts({ dates: recentDates, sections, agents, today, outcall, weekKeys: allWeekKeys, weeklyByCategory, issueTodayRanking, weeklyByIssue, issueWeekKeys, hourlyToday, productivityScores, mboTrend, recentTotalsWithDep });
  callSecDaily.draw();
  startCountdown();

  lastCtx = { dates: recentDates, sections, agents, today, yday, schedule, outcall, delay30, delayHold, targetCompletedToday, DELAY_PENALTY, rawLog };
  openAgentPanel = null;
  agentDetailChart = null;
}

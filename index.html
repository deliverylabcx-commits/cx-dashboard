              const color = st==null ? 'var(--ink-dim)' : isOff ? 'var(--accent)' : 'var(--good)';
              return `<td style="color:${color}">${st || '-'}</td>`;
            }).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="footer-note">
      데이터 출처: CS_Tracking · 근무 스케줄 · Out Call_Tracking · 30분 지연 체크 · 응대지연_보류 (Google Sheets 웹 게시 CSV) · ${REFRESH_MS/60000}분마다 자동 갱신 · 일요일은 휴무로 인입 0건 처리됨 · 상단 날짜 선택기로 과거 특정일 조회 가능.
    </div>
  `;

  document.getElementById("refreshBtn").onclick = () => { refresh(true); refreshRawLog(); };

  const workingAgentsToday = agents.filter(a => { const st = schedule?.schedule?.[a]?.[today]; return !(st && OFF_STATUSES.includes(st)); });
  const targetCompletedToday = workingAgentsToday.length
    ? sum(workingAgentsToday.map(a => sections["상담완료"]?.[a]?.[today] || 0)) / workingAgentsToday.length
    : 0;
  function productivityScoreOf(a){
    const st = schedule?.schedule?.[a]?.[today];
    if (st && OFF_STATUSES.includes(st)) return null; // 휴무자는 점수 대상에서 제외
    const comp = sections["상담완료"]?.[a]?.[today] || 0;
    const delay = sections["30분 이상 지연"]?.[a]?.[today] || 0;
    const volume = targetCompletedToday>0 ? Math.min(100, (comp/targetCompletedToday)*100) : 0;
    const speed = Math.max(0, 100 - delay*DELAY_PENALTY);
    return volume*0.6 + speed*0.4;
  }
  const productivityScores = agents.map(productivityScoreOf);

  drawCharts({ dates: recentDates, sections, agents, today, outcall, weekKeys: allWeekKeys, weeklyByCategory, issueTodayRanking, weeklyByIssue, issueWeekKeys, hourlyToday, productivityScores, mboTrend });
  startCountdown();

  lastCtx = { dates: recentDates, sections, agents, today, yday, schedule, outcall, delay30, delayHold, targetCompletedToday, DELAY_PENALTY, rawLog };
  openAgentPanel = null;
  agentDetailChart = null;
}

function destroyCharts(){
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

/* ===================== 주간 리포트 ===================== */
function renderWeekly(data){
  const { dates, sections, outcall, delay30, schedule, rawLog, onboardCalls } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);
  const weeks = buildWeekList(dates);
  const app = document.getElementById("app");
  if (!weeks.length){ app.innerHTML = '<div class="loading">주간 데이터가 없습니다.</div>'; return; }

  const completeWeeks = weeks.filter(w => w.dates.length === 6);
  const defaultWeek = completeWeeks.length ? completeWeeks[completeWeeks.length-1] : weeks[weeks.length-1];
  if (!selectedWeekMonday || !weeks.find(w => w.monday === selectedWeekMonday)){
    selectedWeekMonday = defaultWeek.monday;
  }
  const wIdx = weeks.findIndex(w => w.monday === selectedWeekMonday);
  const week = weeks[wIdx];
  const prevWeek = wIdx > 0 ? weeks[wIdx-1] : null;

  function wowText(cur, prev, unit, pctPoint){
    if (cur==null || prev==null) return '<span style="color:var(--ink-dim);">전주 데이터 없음</span>';
    const diff = cur - prev;
    const arrow = diff>=0 ? '▲' : '▼';
    const color = diff>=0 ? 'var(--good)' : 'var(--bad)';
    const diffTxt = pctPoint ? `${Math.abs(Math.round(diff*100))}%p` : `${fmtNum(Math.abs(diff))}${unit||'건'}`;
    const curTxt = pctPoint ? fmtPct(cur) : fmtNum(cur);
    const prevTxt = pctPoint ? fmtPct(prev) : fmtNum(prev);
    return `WoW 비교: 전주 ${prevTxt} → 이번 주 ${curTxt} (<span style="color:${color};">${arrow} ${diffTxt}</span>)`;
  }

  function cxStats(w){
    if (!w) return null;
    const inbound = sum(w.dates.map(d => sum(agents.map(a => sections["상담인입"][a][d] || 0))));
    const completed = sum(w.dates.map(d => sum(agents.map(a => sections["상담완료"]?.[a]?.[d] || 0))));
    return { inbound, completed, rate: inbound>0 ? completed/inbound : null };
  }
  const cx = cxStats(week);
  const cxPrev = cxStats(prevWeek);

  function outcallWeekStats(w){
    if (!w || !outcall?.categories?.length) return [];
    return outcall.categories.map(c => {
      const t = outcall.data[c]?.["Total"];
      const inbound = sum(w.dates.map(d => t?.["인입"]?.[d] || 0));
      const completed = sum(w.dates.map(d => t?.["통화완료"]?.[d] || 0));
      const absent = sum(w.dates.map(d => t?.["미처리"]?.[d] || 0));
      return { category:c, inbound, completed, completedRate: inbound>0?completed/inbound:null, absent, absentRate: inbound>0?absent/inbound:null };
    });
  }
  const outcallWeek = outcallWeekStats(week);
  const outcallWeekPrev = outcallWeekStats(prevWeek);

  function delayWeekStats(w){
    if (!w) return { total:0, byReason:[], rows:[] };
    const weekSet = new Set(w.dates);
    const rows = (delay30||[]).filter(r => weekSet.has(r.date));
    const reasonCount = {};
    rows.forEach(r => { const key = r.reason || "미분류"; reasonCount[key] = (reasonCount[key]||0)+1; });
    const byReason = Object.entries(reasonCount).map(([reason,count]) => ({reason,count})).sort((a,b)=>b.count-a.count);
    return { total: rows.length, byReason, rows };
  }
  const delayWeek = delayWeekStats(week);
  const delayWeekPrev = delayWeekStats(prevWeek);

  // 카테고리별 이슈 주간 집계
  const issueSection = sections["카테고리별 이슈"] || {};
  const issueCategories = Object.keys(issueSection);
  function issueWeekStats(w){
    if (!w) return [];
    return issueCategories.map(c => ({ category:c, total: sum(w.dates.map(d => issueSection[c][d] || 0)) }));
  }
  const issueWeek = issueWeekStats(week).sort((a,b)=>b.total-a.total);
  const issueWeekPrevMap = Object.fromEntries(issueWeekStats(prevWeek).map(x=>[x.category,x.total]));

  // 담당자별 생산성 주간 지표
  function agentWeekProductivity(w){
    if (!w) return {};
    const out = {};
    agents.forEach(a => { out[a] = { scores: [], unprocessed: 0 }; });
    w.dates.forEach(d => {
      const dayScores = dailyProductivityScores(sections, schedule, agents, d);
      agents.forEach(a => { if (dayScores[a] != null) out[a].scores.push(dayScores[a]); });
    });
    agents.forEach(a => {
      out[a].avg = out[a].scores.length ? sum(out[a].scores)/out[a].scores.length : null;
    });
    const weekSet = new Set(w.dates);
    (rawLog||[]).forEach(r => {
      if (weekSet.has(r.date) && r.direction === "INBOUND" && r.state && UNPROCESSED_STATES.includes(r.state.toLowerCase()) && out[r.agent]){
        out[r.agent].unprocessed++;
      }
    });
    return out;
  }
  const agentWeek = agentWeekProductivity(week);
  const agentWeekPrev = agentWeekProductivity(prevWeek);

  // MBO 공통 목표 주간 달성 현황 (일별 달성률의 주간 평균)
  const mboAgents = agents.filter(a => MBO_WEIGHTS[a]);
  function mboWeekStats(w){
    if (!w) return {};
    const out = {};
    mboAgents.forEach(a => {
      const daily = w.dates.map(d => mboScoresForAgent(sections, delay30, outcall, a, d)).filter(s => s.weighted!=null);
      out[a] = daily.length ? sum(daily.map(s=>s.weighted))/daily.length : null;
    });
    return out;
  }
  const mboWeek = mboWeekStats(week);
  const weekDateSet = new Set(week.dates);
  const hourlyStatsWeek = outcallHourlyStats(onboardCalls, d => weekDateSet.has(d.dateMD));
  const conversionAllW = onboardConversion(onboardCalls);
  const mboWeekPrev = mboWeekStats(prevWeek);

  const weeklyInsights = [];
  if (cx && cxPrev){
    const diff = cx.inbound - cxPrev.inbound;
    weeklyInsights.push(`전주(${dateLabel(prevWeek.monday)}~${dateLabel(prevWeek.saturday)}) 인입 ${fmtNum(cxPrev.inbound)}건 → 이번 주 ${fmtNum(cx.inbound)}건 (${diff>=0?'▲':'▼'} ${fmtNum(Math.abs(diff))}건)`);
  }
  if (cx && cx.rate!=null){
    weeklyInsights.push(`이번 주 응대율은 ${fmtPct(cx.rate)}입니다.`);
  }
  if (delayWeek.byReason.length){
    const top = delayWeek.byReason[0];
    const pct = delayWeek.total>0 ? Math.round((top.count/delayWeek.total)*100) : 0;
    weeklyInsights.push(`이번 주 30분 응대지연 총 ${delayWeek.total}건 중 "${top.reason}"가 ${top.count}건(${pct}%)으로 가장 많습니다.`);
  }
  if (outcallWeek.length){
    const worst = outcallWeek.slice().sort((a,b)=>(b.absentRate||0)-(a.absentRate||0))[0];
    if (worst && worst.absentRate!=null) weeklyInsights.push(`아웃콜 중 부재율이 가장 높은 카테고리는 <b>${catLabel(worst.category)}</b> (${fmtPct(worst.absentRate)})입니다.`);
    const wMet = outcallWeek.filter(o => o.completedRate!=null && o.completedRate >= OUTCALL_TARGET_RATE).map(o=>o.category);
    const wMiss = outcallWeek.filter(o => o.completedRate!=null && o.completedRate < OUTCALL_TARGET_RATE);
    if (wMet.length) weeklyInsights.push(`이번 주 아웃콜 성공률 타겟(${Math.round(OUTCALL_TARGET_RATE*100)}%)을 달성한 카테고리는 <b>${wMet.map(catLabel).join(", ")}</b>입니다.`);
    if (wMiss.length){
      const w = wMiss.reduce((a,b)=>b.completedRate<a.completedRate?b:a);
      const needed = Math.max(0, Math.ceil(w.inbound*OUTCALL_TARGET_RATE) - w.completed);
      weeklyInsights.push(`<b>${catLabel(w.category)}</b>은 성공률 ${fmtPct(w.completedRate)}로 타겟 미달이며, ${needed}건을 더 완료해야 타겟에 도달합니다.`);
    }
  }
  if (issueWeek.length && issueWeek[0].total>0){
    weeklyInsights.push(`이번 주 가장 많이 발생한 이슈 카테고리는 <b>${issueWeek[0].category}</b> (${fmtNum(issueWeek[0].total)}건)입니다.`);
  }
  {
    const productivityDiffs = agents
      .filter(a => agentWeek[a]?.avg!=null && agentWeekPrev[a]?.avg!=null)
      .map(a => ({ agent:a, diff: agentWeek[a].avg - agentWeekPrev[a].avg }));
    if (productivityDiffs.length){
      const best = productivityDiffs.reduce((x,y)=>y.diff>x.diff?y:x);
      const worst = productivityDiffs.reduce((x,y)=>y.diff<x.diff?y:x);
      if (best.diff > 0) weeklyInsights.push(`전주 대비 생산성이 가장 많이 오른 상담원은 <b>${best.agent}</b> (▲ ${best.diff.toFixed(1)}점)입니다.`);
      if (worst.diff < 0) weeklyInsights.push(`전주 대비 생산성이 가장 많이 떨어진 상담원은 <b>${worst.agent}</b> (▼ ${Math.abs(worst.diff).toFixed(1)}점)입니다.`);
    }
  }
  {
    const completedByAgent = agents.map(a => ({ agent:a, total: sum(week.dates.map(d => sections["상담완료"]?.[a]?.[d] || 0)) }));
    const topHandler = completedByAgent.filter(x=>x.total>0).sort((a,b)=>b.total-a.total)[0];
    if (topHandler) weeklyInsights.push(`이번 주 상담인입을 가장 많이 처리한 상담원은 <b>${topHandler.agent}</b> (${fmtNum(topHandler.total)}건)입니다.`);
  }
  (outcall?.categories||[]).forEach(c => {
    const perAgent = agents.map(a => {
      const completed = sum(week.dates.map(d => outcall.data[c]?.[a]?.["통화완료"]?.[d] || 0));
      const inbound = sum(week.dates.map(d => outcall.data[c]?.[a]?.["인입"]?.[d] || 0));
      return { agent:a, completed, rate: inbound>0 ? completed/inbound : null };
    });
    const topVolume = perAgent.filter(x=>x.completed>0).sort((a,b)=>b.completed-a.completed)[0];
    const topRate = perAgent.filter(x=>x.rate!=null && x.completed>0).sort((a,b)=>b.rate-a.rate)[0];
    if (topVolume) weeklyInsights.push(`${catLabel(c)} 아웃콜을 가장 많이 담당한 상담원은 <b>${topVolume.agent}</b> (통화완료 ${fmtNum(topVolume.completed)}건)이고, 완료율이 가장 높은 상담원은 <b>${topRate?topRate.agent:topVolume.agent}</b> (${fmtPct(topRate?topRate.rate:null)})입니다.`);
  });

  const weekOptions = weeks.map(w => `<option value="${w.monday}" ${w.monday===selectedWeekMonday?'selected':''}>${dateRangeLabel(w.monday, w.saturday)}</option>`).join("");

  app.innerHTML = `
    <header>
      <div>
        <h1>CX 생산성 · 주간 리포트</h1>
        <div class="sub">${dateLabel(week.monday)} ~ ${dateLabel(week.saturday)} (월~토 · 일요일 제외)</div>
      </div>
      <div class="status">
        <select id="weekPicker" onchange="onWeekChange(this.value)" style="background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;">
          ${weekOptions}
        </select>
        <button onclick="switchToMonthly()" style="background:#748FFC;color:#0F1420;font-weight:600;border:none;">월별 보기</button>
        <button onclick="switchToDaily()">일간 보기로 돌아가기</button>
      </div>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <h2>주간 인사이트</h2>
      <ul class="insight-list">
        ${renderInsightList(weeklyInsights)}
      </ul>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>채널톡 인입 및 응대현황</h2>
      <div class="kpis">
        <div class="kpi"><div class="label">상담인입 (채널톡/Call)</div><div class="val">${fmtNum(cx?.inbound)}</div></div>
        <div class="kpi"><div class="label">응대현황 (상담완료)</div><div class="val">${fmtNum(cx?.completed)}</div></div>
        <div class="kpi"><div class="label">응대율</div><div class="val">${fmtPct(cx?.rate)}</div></div>
      </div>
      <div style="margin-top:14px;font-size:13px;color:var(--ink-dim);line-height:1.9;">
        인입 ${wowText(cx?.inbound, cxPrev?.inbound)}<br>
        완료 ${wowText(cx?.completed, cxPrev?.completed)}<br>
        응대율 ${wowText(cx?.rate, cxPrev?.rate, null, true)}
      </div>
      <div style="margin-top:16px;">
        <canvas id="chartWeekDaily"></canvas>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>CX 아웃콜 운영현황 <span class="tag">성공률 타겟 ${Math.round(OUTCALL_TARGET_RATE*100)}%</span></h2>
      <div class="kpis">
        ${outcallWeek.map((o,i) => {
          const p = outcallWeekPrev[i];
          const gapPt = o.completedRate!=null ? (o.completedRate - OUTCALL_TARGET_RATE) : null;
          const needed = Math.max(0, Math.ceil(o.inbound*OUTCALL_TARGET_RATE) - o.completed);
          return `<div class="kpi"><div class="label">${catLabel(o.category)} 아웃 Call 응대현황</div><div class="val">${fmtNum(o.inbound)}건</div>
          <div class="delta">완료율 · ${fmtNum(o.completed)}건 ${fmtPct(o.completedRate)}</div>
          <div class="delta">부재율(서베이발송) · ${fmtNum(o.absent)}건 ${fmtPct(o.absentRate)}</div>
          <div class="delta" style="color:${gapPt==null?'var(--ink-dim)':(gapPt>=0?'var(--good)':'var(--bad)')};font-weight:700;margin-top:3px;">
            ${gapPt!=null ? (gapPt>=0?`타겟 달성 (+${Math.round(gapPt*100)}%p)`:`타겟 미달 (${Math.round(gapPt*100)}%p · ${needed}건 부족)`) : '타겟 비교 불가'}
          </div>
          <div class="delta" style="margin-top:4px;font-size:11px;">인입 ${wowText(o.inbound, p?.inbound)}</div>
          <div class="delta" style="font-size:11px;">완료 ${wowText(o.completed, p?.completed)}</div>
          <div class="delta" style="font-size:11px;">완료율 ${wowText(o.completedRate, p?.completedRate, null, true)}</div></div>`;
        }).join("") || '<div style="color:var(--ink-dim);font-size:13px;">아웃콜 데이터 없음</div>'}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>카테고리별 이슈 (주간)</h2>
      <div class="kpis">
        ${issueWeek.map(x => `<div class="kpi"><div class="label">${x.category}</div><div class="val">${fmtNum(x.total)}</div>
          <div class="delta" style="font-size:11px;">${wowText(x.total, issueWeekPrevMap[x.category])}</div></div>`).join("") || '<div style="color:var(--ink-dim);font-size:13px;">카테고리별 이슈 데이터 없음</div>'}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>30분 응대지연 현황</h2>
      <div class="kpis" style="margin-bottom:16px;">
        <div class="kpi"><div class="label">총 지연 건수</div><div class="val">${fmtNum(delayWeek.total)}</div>
          <div class="delta" style="font-size:11px;">${wowText(delayWeek.total, delayWeekPrev.total)}</div></div>
      </div>
      <table style="margin-bottom:20px;">
        <thead><tr><th>사유</th><th>건수</th><th>비중</th></tr></thead>
        <tbody>
          ${delayWeek.byReason.map(r => `<tr><td style="text-align:left;">${r.reason}</td><td>${fmtNum(r.count)}</td><td>${delayWeek.total>0?Math.round((r.count/delayWeek.total)*100):0}%</td></tr>`).join("") || '<tr><td colspan="3" style="color:var(--ink-dim);">데이터 없음</td></tr>'}
        </tbody>
      </table>
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;">30분 이상 지연 상세 (전체 상담원)</div>
      <table style="font-size:12px;">
        <thead><tr><th>날짜</th><th>담당자</th><th>사업장</th><th>소요시간</th><th>사유</th><th>링크</th></tr></thead>
        <tbody>
          ${delayWeek.rows.slice(0,50).map(r => `<tr>
            <td>${dateWithDay(r.date)}</td><td style="text-align:left;">${r.agent||'-'}</td><td style="text-align:left;">${r.store||'-'}</td>
            <td>${r.duration||'-'}</td><td style="text-align:left;">${r.reason||'-'}</td>
            <td>${r.url ? `<a href="${r.url}" target="_blank" style="color:var(--accent);">보기</a>` : '-'}</td>
          </tr>`).join("") || '<tr><td colspan="6" style="color:var(--ink-dim);">해당 주 30분 이상 지연 기록이 없습니다.</td></tr>'}
        </tbody>
      </table>
      ${delayWeek.rows.length > 50 ? `<div style="color:var(--ink-dim);font-size:11.5px;margin-top:6px;">전체 ${delayWeek.rows.length}건 중 50건 표시</div>` : ""}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>담당자별 생산성 (주간)</h2>
      <table>
        <thead><tr><th>상담원</th><th>주간 평균 생산성</th><th>전주 대비</th><th>주간 미처리</th></tr></thead>
        <tbody>
          ${agents.map(a => {
            const cur = agentWeek[a]?.avg;
            const prev = agentWeekPrev[a]?.avg;
            const diff = (cur!=null && prev!=null) ? cur-prev : null;
            return `<tr><td style="text-align:left;">${a}</td>
              <td>${cur!=null ? cur.toFixed(1) : '-'}</td>
              <td style="color:${diff==null?'var(--ink-dim)':(diff>=0?'var(--good)':'var(--bad)')}">${diff!=null ? (diff>=0?'▲ ':'▼ ')+Math.abs(diff).toFixed(1)+'점' : '전주 데이터 없음'}</td>
              <td>${fmtNum(agentWeek[a]?.unprocessed || 0)}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>아웃콜 시간대별 통화 결과 <span class="tag">${dateRangeLabel(week.monday, week.saturday)} · 타임스탬프 중복 30분 분산 보정 적용</span></h2>
      ${buildHourlyCardHTML(hourlyStatsWeek)}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>온보딩 → 발주 전환율 <span class="tag">전체 기간 누적 (리드타임 특성상 주간 단독 산정 불가)</span></h2>
      ${buildConversionCardHTML(conversionAllW)}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>MBO 공통 목표 달성 현황 (주간)</h2>
      <table>
        <thead><tr><th>상담원</th><th>주간 종합 가중점수</th><th>전주 대비</th></tr></thead>
        <tbody>
          ${mboAgents.map(a => {
            const cur = mboWeek[a];
            const prev = mboWeekPrev[a];
            const diff = (cur!=null && prev!=null) ? cur-prev : null;
            return `<tr><td style="text-align:left;">${a}</td>
              <td style="font-weight:700;color:var(--accent);">${cur!=null ? Math.round(cur*100)+'%' : '-'}</td>
              <td style="color:${diff==null?'var(--ink-dim)':(diff>=0?'var(--good)':'var(--bad)')}">${diff!=null ? (diff>=0?'▲ ':'▼ ')+Math.abs(Math.round(diff*100))+'%p' : '전주 데이터 없음'}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:10px;">데일리 클레임율(97%↑)·30분 지연율(3%↓)·온보딩 아웃콜(100%) 3개 목표의 일별 달성률을 주간 평균한 값입니다.</div>
    </div>

    <div class="footer-note">
      월~토 기준 주간 리포트 (일요일 휴무 제외) · CS_Tracking · Out Call_Tracking · 30분 지연 체크 데이터 기준
    </div>
  `;

  destroyCharts();
  const weekDailyCanvas = document.getElementById("chartWeekDaily");
  if (weekDailyCanvas){
    const perDay = week.dates.map(d => sum(agents.map(a => sections["상담인입"][a][d] || 0)));
    charts.weekDaily = new Chart(weekDailyCanvas, {
      type: "bar",
      data: {
        labels: week.dates.map(d => dateWithDay(d)),
        datasets: [{ data: perDay, backgroundColor: "#4C6EF588", borderRadius: 4 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:"#28324D"}}, x:{grid:{display:false}} } }
    });
  }
}

/* ===================== 월별 리포트 ===================== */
function renderMonthly(data){
  const { dates, sections, outcall, delay30, onboardCalls } = data;
  const agents = AGENT_ORDER.filter(a => sections["상담인입"] && sections["상담인입"][a]);
  const months = buildMonthList(dates);
  const app = document.getElementById("app");
  if (!months.length){ app.innerHTML = '<div class="loading">월간 데이터가 없습니다.</div>'; return; }

  if (!selectedMonthKey || !months.find(m => m.key === selectedMonthKey)){
    selectedMonthKey = months[months.length-1].key;
  }
  const mIdx = months.findIndex(m => m.key === selectedMonthKey);
  const month = months[mIdx];
  const prevMonth = mIdx > 0 ? months[mIdx-1] : null;

  function wowText(cur, prev, unit, pctPoint){
    if (cur==null || prev==null) return '<span style="color:var(--ink-dim);">전월 데이터 없음</span>';
    const diff = cur - prev;
    const arrow = diff>=0 ? '▲' : '▼';
    const color = diff>=0 ? 'var(--good)' : 'var(--bad)';
    const diffTxt = pctPoint ? `${Math.abs(Math.round(diff*100))}%p` : `${fmtNum(Math.abs(diff))}${unit||'건'}`;
    const curTxt = pctPoint ? fmtPct(cur) : fmtNum(cur);
    const prevTxt = pctPoint ? fmtPct(prev) : fmtNum(prev);
    return `전월 대비: ${prevTxt} → ${curTxt} (<span style="color:${color};">${arrow} ${diffTxt}</span>)`;
  }

  function cxStats(dSet){
    if (!dSet || !dSet.length) return null;
    const inbound = sum(dSet.map(d => sum(agents.map(a => sections["상담인입"][a][d] || 0))));
    const completed = sum(dSet.map(d => sum(agents.map(a => sections["상담완료"]?.[a]?.[d] || 0))));
    return { inbound, completed, rate: inbound>0 ? completed/inbound : null };
  }
  const cx = cxStats(month.dates);
  const cxPrev = cxStats(prevMonth?.dates);

  function outcallStats(dSet){
    if (!dSet || !outcall?.categories?.length) return [];
    return outcall.categories.map(c => {
      const t = outcall.data[c]?.["Total"];
      const inbound = sum(dSet.map(d => t?.["인입"]?.[d] || 0));
      const completed = sum(dSet.map(d => t?.["통화완료"]?.[d] || 0));
      const absent = sum(dSet.map(d => t?.["미처리"]?.[d] || 0));
      return { category:c, inbound, completed, completedRate: inbound>0?completed/inbound:null, absent, absentRate: inbound>0?absent/inbound:null };
    });
  }
  const outcallMonth = outcallStats(month.dates);
  const outcallMonthPrev = outcallStats(prevMonth?.dates);

  const mboAgents = agents.filter(a => MBO_WEIGHTS[a]);
  function mboMonthStats(dSet){
    if (!dSet) return {};
    const out = {};
    mboAgents.forEach(a => {
      const daily = dSet.map(d => mboScoresForAgent(sections, delay30, outcall, a, d)).filter(s => s.weighted!=null);
      out[a] = daily.length ? sum(daily.map(s=>s.weighted))/daily.length : null;
    });
    return out;
  }
  const mboMonth = mboMonthStats(month.dates);
  const mboMonthPrev = mboMonthStats(prevMonth?.dates);

  // 모바일 레터링 도입(8/11) 전후 아웃콜 성과 비교 - 전체 기간 기준
  function mdKey(md){ const [m,d] = md.split("/").map(Number); return m*100+d; }
  const letteringKey = mdKey(LETTERING_START);
  const beforeDates = dates.filter(d => mdKey(d) < letteringKey);
  const afterDates = dates.filter(d => mdKey(d) >= letteringKey);
  const letteringCompare = (outcall?.categories||[]).map(c => {
    const t = outcall.data[c]?.["Total"];
    const agg = (ds) => {
      const inbound = sum(ds.map(d => t?.["인입"]?.[d] || 0));
      const completed = sum(ds.map(d => t?.["통화완료"]?.[d] || 0));
      return { inbound, completed, rate: inbound>0 ? completed/inbound : null };
    };
    const b = agg(beforeDates), a = agg(afterDates);
    return {
      category: c,
      beforeInbound: b.inbound, beforeRate: b.rate,
      afterInbound: a.inbound, afterRate: a.rate,
      diff: (b.rate!=null && a.rate!=null) ? a.rate - b.rate : null
    };
  });

  function delayStats(dSet){
    if (!dSet) return { total:0, byReason:[] };
    const set = new Set(dSet);
    const rows = (delay30||[]).filter(r => set.has(r.date));
    const reasonCount = {};
    rows.forEach(r => { const key = r.reason || "미분류"; reasonCount[key] = (reasonCount[key]||0)+1; });
    return { total: rows.length, byReason: Object.entries(reasonCount).map(([reason,count])=>({reason,count})).sort((a,b)=>b.count-a.count) };
  }
  const delayMonth = delayStats(month.dates);
  const delayMonthPrev = delayStats(prevMonth?.dates);

  const issueSection = sections["카테고리별 이슈"] || {};
  const issueCategories = Object.keys(issueSection);
  function issueStats(dSet){
    if (!dSet) return [];
    return issueCategories.map(c => ({ category:c, total: sum(dSet.map(d => issueSection[c][d] || 0)) }));
  }
  const issueMonth = issueStats(month.dates).sort((a,b)=>b.total-a.total);
  const issueMonthPrevMap = Object.fromEntries(issueStats(prevMonth?.dates).map(x=>[x.category,x.total]));

  // 이번 달 내 주차별 breakdown (월별 vs 주차별 비교용)
  const weeksInMonth = buildWeekList(month.dates);
  const weekBreakdown = weeksInMonth.map(w => ({
    label: dateRangeLabel(w.monday, w.saturday),
    inbound: sum(w.dates.map(d => sum(agents.map(a => sections["상담인입"][a][d] || 0))))
  }));

  const monthlyInsights = [];
  if (cx && cxPrev){
    const diff = cx.inbound - cxPrev.inbound;
    monthlyInsights.push(`전월(${prevMonth.label}) 인입 ${fmtNum(cxPrev.inbound)}건 → 이번 달(${month.label}) ${fmtNum(cx.inbound)}건 (${diff>=0?'▲':'▼'} ${fmtNum(Math.abs(diff))}건)`);
  }
  if (cx && cx.rate!=null) monthlyInsights.push(`${month.label} 응대율은 ${fmtPct(cx.rate)}입니다.`);
  if (weekBreakdown.length){
    const peak = weekBreakdown.reduce((a,b)=>b.inbound>a.inbound?b:a);
    monthlyInsights.push(`${month.label} 중 인입이 가장 많았던 주는 <b>${peak.label}</b> (${fmtNum(peak.inbound)}건)입니다.`);
  }
  if (delayMonth.byReason.length){
    const top = delayMonth.byReason[0];
    const pct = delayMonth.total>0 ? Math.round((top.count/delayMonth.total)*100) : 0;
    monthlyInsights.push(`${month.label} 30분 응대지연 총 ${delayMonth.total}건 중 "${top.reason}"가 ${top.count}건(${pct}%)으로 가장 많습니다.`);
  }
  if (issueMonth.length && issueMonth[0].total>0){
    monthlyInsights.push(`${month.label} 가장 많이 발생한 이슈 카테고리는 <b>${issueMonth[0].category}</b> (${fmtNum(issueMonth[0].total)}건)입니다.`);
  }
  {
    const completedByAgent = agents.map(a => ({ agent:a, total: sum(month.dates.map(d => sections["상담완료"]?.[a]?.[d] || 0)) }));
    const topHandler = completedByAgent.filter(x=>x.total>0).sort((a,b)=>b.total-a.total)[0];
    if (topHandler) monthlyInsights.push(`${month.label} 상담인입을 가장 많이 처리한 상담원은 <b>${topHandler.agent}</b> (${fmtNum(topHandler.total)}건)입니다.`);
  }
  (outcall?.categories||[]).forEach(c => {
    const perAgent = agents.map(a => {
      const completed = sum(month.dates.map(d => outcall.data[c]?.[a]?.["통화완료"]?.[d] || 0));
      const inbound = sum(month.dates.map(d => outcall.data[c]?.[a]?.["인입"]?.[d] || 0));
      return { agent:a, completed, rate: inbound>0 ? completed/inbound : null };
    });
    const topVolume = perAgent.filter(x=>x.completed>0).sort((a,b)=>b.completed-a.completed)[0];
    const topRate = perAgent.filter(x=>x.rate!=null && x.completed>0).sort((a,b)=>b.rate-a.rate)[0];
    if (topVolume) monthlyInsights.push(`${catLabel(c)} 아웃콜을 가장 많이 담당한 상담원은 <b>${topVolume.agent}</b> (통화완료 ${fmtNum(topVolume.completed)}건)이고, 완료율이 가장 높은 상담원은 <b>${topRate?topRate.agent:topVolume.agent}</b> (${fmtPct(topRate?topRate.rate:null)})입니다.`);
  });
  {
    const mMet = outcallMonth.filter(o => o.completedRate!=null && o.completedRate >= OUTCALL_TARGET_RATE).map(o=>o.category);
    const mMiss = outcallMonth.filter(o => o.completedRate!=null && o.completedRate < OUTCALL_TARGET_RATE);
    if (mMet.length) monthlyInsights.push(`${month.label} 아웃콜 성공률 타겟(${Math.round(OUTCALL_TARGET_RATE*100)}%)을 달성한 카테고리는 <b>${mMet.map(catLabel).join(", ")}</b>입니다.`);
    if (mMiss.length){
      const w = mMiss.reduce((a,b)=>b.completedRate<a.completedRate?b:a);
      const needed = Math.max(0, Math.ceil(w.inbound*OUTCALL_TARGET_RATE) - w.completed);
      monthlyInsights.push(`<b>${catLabel(w.category)}</b>은 성공률 ${fmtPct(w.completedRate)}로 타겟 미달이며, ${needed}건을 더 완료해야 타겟에 도달합니다.`);
    }
    const improved = letteringCompare.filter(l => l.diff!=null && l.diff>0).sort((a,b)=>b.diff-a.diff);
    if (improved.length){
      const t = improved[0];
      monthlyInsights.push(`모바일 레터링 도입(${LETTERING_START}) 이후 <b>${catLabel(t.category)}</b> 통화완료율이 ${fmtPct(t.beforeRate)} → ${fmtPct(t.afterRate)}로 ▲ ${Math.round(t.diff*100)}%p 개선되었습니다.`);
    }
  }

  // 아웃콜 시간대별 성공률 + 온보딩 전환율 (전체 기간 기준)
  const hourlyStats = outcallHourlyStats(onboardCalls);
  const conversion = onboardConversion(onboardCalls);
  const hourlyCats = Object.keys(hourlyStats);
  hourlyCats.forEach(cat => {
    const hours = Object.keys(hourlyStats[cat]).map(Number).sort((a,b)=>a-b);
    const eligible = hours.filter(h => hourlyStats[cat][h].total >= 10);
    if (!eligible.length) return;
    const best = eligible.reduce((a,b) => (hourlyStats[cat][b].success/hourlyStats[cat][b].total) > (hourlyStats[cat][a].success/hourlyStats[cat][a].total) ? b : a);
    const bs = hourlyStats[cat][best];
    monthlyInsights.push(`<b>${catLabel(cat)}</b> 아웃콜은 <b>${best}시</b>에 통화 성공률이 가장 높습니다 (${Math.round(bs.success/bs.total*100)}% · ${bs.total}건 기준).`);
  });
  if (conversion.base > 0){
    const t2 = conversion.targets["2발주"], t5 = conversion.targets["5발주"];
    monthlyInsights.push(`온보딩 업장 ${fmtNum(conversion.base)}곳 중 <b>${fmtPct(t2.rate)}</b>가 2발주로 전환되었으며, 평균 <b>${t2.avgLead!=null?t2.avgLead.toFixed(1):'-'}일</b> 만에 전환되었습니다.`);
    monthlyInsights.push(`${catLabel("5발주")} 전환율은 <b>${fmtPct(t5.rate)}</b>이며, 평균 리드타임은 <b>${t5.avgLead!=null?t5.avgLead.toFixed(1):'-'}일</b>입니다.`);
  }

  const monthOptions = months.map(m => `<option value="${m.key}" ${m.key===selectedMonthKey?'selected':''}>${m.label}</option>`).join("");
  const weekBarMax = Math.max(1, ...weekBreakdown.map(w=>w.inbound));

  app.innerHTML = `
    <header>
      <div>
        <h1>CX 생산성 · 월별 트래킹</h1>
        <div class="sub">${month.label} (${dateRangeLabel(month.dates[0], month.dates[month.dates.length-1])})</div>
      </div>
      <div class="status">
        <select id="monthPicker" onchange="onMonthChange(this.value)" style="background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;">
          ${monthOptions}
        </select>
        <button onclick="switchToWeekly()" style="background:var(--accent);color:#1a1206;font-weight:600;border:none;">주간 보기</button>
        <button onclick="switchToDaily()">일간 보기로 돌아가기</button>
      </div>
    </header>

    <div class="card" style="margin-bottom:16px;">
      <h2>월간 인사이트</h2>
      <ul class="insight-list">
        ${renderInsightList(monthlyInsights)}
      </ul>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>채널톡 인입 및 응대현황 (월간)</h2>
      <div class="kpis">
        <div class="kpi"><div class="label">상담인입 (채널톡/Call)</div><div class="val">${fmtNum(cx?.inbound)}</div></div>
        <div class="kpi"><div class="label">응대현황 (상담완료)</div><div class="val">${fmtNum(cx?.completed)}</div></div>
        <div class="kpi"><div class="label">응대율</div><div class="val">${fmtPct(cx?.rate)}</div></div>
      </div>
      <div style="margin-top:14px;font-size:13px;color:var(--ink-dim);line-height:1.9;">
        인입 ${wowText(cx?.inbound, cxPrev?.inbound)}<br>
        완료 ${wowText(cx?.completed, cxPrev?.completed)}<br>
        응대율 ${wowText(cx?.rate, cxPrev?.rate, null, true)}
      </div>
      <div style="margin-top:16px;">
        <canvas id="chartMonthDaily"></canvas>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>주차별 인입 비교 <span class="tag">${month.label} 내 주차별</span></h2>
      <table>
        <thead><tr><th>주차</th><th>상담인입</th><th></th></tr></thead>
        <tbody>
          ${weekBreakdown.map(w => `<tr><td style="text-align:left;">${w.label}</td><td>${fmtNum(w.inbound)}</td>
            <td style="width:50%;"><div style="background:#4C6EF5;height:14px;border-radius:4px;width:${weekBarMax>0?Math.round((w.inbound/weekBarMax)*100):0}%;"></div></td></tr>`).join("") || '<tr><td colspan="3" style="color:var(--ink-dim);">데이터 없음</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>CX 아웃콜 운영현황 (월간) <span class="tag">성공률 타겟 ${Math.round(OUTCALL_TARGET_RATE*100)}%</span></h2>
      <div class="kpis">
        ${outcallMonth.map((o,i) => {
          const p = outcallMonthPrev[i];
          const gapPt = o.completedRate!=null ? (o.completedRate - OUTCALL_TARGET_RATE) : null;
          const needed = Math.max(0, Math.ceil(o.inbound*OUTCALL_TARGET_RATE) - o.completed);
          return `<div class="kpi"><div class="label">${catLabel(o.category)} 아웃 Call 응대현황</div><div class="val">${fmtNum(o.inbound)}건</div>
          <div class="delta">완료율 · ${fmtNum(o.completed)}건 ${fmtPct(o.completedRate)}</div>
          <div class="delta">부재율(서베이발송) · ${fmtNum(o.absent)}건 ${fmtPct(o.absentRate)}</div>
          <div class="delta" style="color:${gapPt==null?'var(--ink-dim)':(gapPt>=0?'var(--good)':'var(--bad)')};font-weight:700;margin-top:3px;">
            ${gapPt!=null ? (gapPt>=0?`타겟 달성 (+${Math.round(gapPt*100)}%p)`:`타겟 미달 (${Math.round(gapPt*100)}%p · ${needed}건 부족)`) : '타겟 비교 불가'}
          </div>
          <div class="delta" style="margin-top:4px;font-size:11px;">인입 ${wowText(o.inbound, p?.inbound)}</div>
          <div class="delta" style="font-size:11px;">완료 ${wowText(o.completed, p?.completed)}</div>
          <div class="delta" style="font-size:11px;">완료율 ${wowText(o.completedRate, p?.completedRate, null, true)}</div></div>`;
        }).join("") || '<div style="color:var(--ink-dim);font-size:13px;">아웃콜 데이터 없음</div>'}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>아웃콜 시간대별 통화 결과 <span class="tag">전체 기간 · 타임스탬프 중복 30분 분산 보정 적용</span></h2>
      ${buildHourlyCardHTML(hourlyStats)}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>온보딩 → 발주 전환율 <span class="tag">전체 기간</span></h2>
      ${buildConversionCardHTML(conversion)}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>모바일 레터링 도입 전후 비교 <span class="tag">${LETTERING_START} 운영 시작 기준 · 전체 기간</span></h2>
      <table>
        <thead><tr><th>카테고리</th><th>도입 전 인입</th><th>도입 전 완료율</th><th>도입 후 인입</th><th>도입 후 완료율</th><th>변화</th></tr></thead>
        <tbody>
          ${letteringCompare.map(l => `<tr>
            <td style="text-align:left;">${catLabel(l.category)}</td>
            <td>${fmtNum(l.beforeInbound)}</td><td>${fmtPct(l.beforeRate)}</td>
            <td>${fmtNum(l.afterInbound)}</td><td>${fmtPct(l.afterRate)}</td>
            <td style="color:${l.diff==null?'var(--ink-dim)':(l.diff>=0?'var(--good)':'var(--bad)')};font-weight:700;">${l.diff!=null ? (l.diff>=0?'▲ ':'▼ ')+Math.abs(Math.round(l.diff*100))+'%p' : '-'}</td>
          </tr>`).join("") || '<tr><td colspan="6" style="color:var(--ink-dim);">데이터 없음</td></tr>'}
        </tbody>
      </table>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:10px;">도입 전(~${LETTERING_START} 이전) vs 도입 후(${LETTERING_START} 이후) 전체 기간 아웃콜 통화완료율 비교입니다.</div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>카테고리별 이슈 (월간)</h2>
      <div class="kpis">
        ${issueMonth.map(x => `<div class="kpi"><div class="label">${x.category}</div><div class="val">${fmtNum(x.total)}</div>
          <div class="delta" style="font-size:11px;">${wowText(x.total, issueMonthPrevMap[x.category])}</div></div>`).join("") || '<div style="color:var(--ink-dim);font-size:13px;">데이터 없음</div>'}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>30분 응대지연 현황 (월간)</h2>
      <div class="kpis" style="margin-bottom:16px;">
        <div class="kpi"><div class="label">총 지연 건수</div><div class="val">${fmtNum(delayMonth.total)}</div>
          <div class="delta" style="font-size:11px;">${wowText(delayMonth.total, delayMonthPrev.total)}</div></div>
      </div>
      <table>
        <thead><tr><th>사유</th><th>건수</th><th>비중</th></tr></thead>
        <tbody>
          ${delayMonth.byReason.map(r => `<tr><td style="text-align:left;">${r.reason}</td><td>${fmtNum(r.count)}</td><td>${delayMonth.total>0?Math.round((r.count/delayMonth.total)*100):0}%</td></tr>`).join("") || '<tr><td colspan="3" style="color:var(--ink-dim);">데이터 없음</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>MBO 공통 목표 달성 현황 (월간)</h2>
      <table>
        <thead><tr><th>상담원</th><th>월간 종합 가중점수</th><th>전월 대비</th></tr></thead>
        <tbody>
          ${mboAgents.map(a => {
            const cur = mboMonth[a];
            const prev = mboMonthPrev[a];
            const diff = (cur!=null && prev!=null) ? cur-prev : null;
            return `<tr><td style="text-align:left;">${a}</td>
              <td style="font-weight:700;color:var(--accent);">${cur!=null ? Math.round(cur*100)+'%' : '-'}</td>
              <td style="color:${diff==null?'var(--ink-dim)':(diff>=0?'var(--good)':'var(--bad)')}">${diff!=null ? (diff>=0?'▲ ':'▼ ')+Math.abs(Math.round(diff*100))+'%p' : '전월 데이터 없음'}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:10px;">데일리 클레임율(97%↑)·30분 지연율(3%↓)·온보딩 아웃콜(100%) 3개 목표의 일별 달성률을 월간 평균한 값입니다.</div>
    </div>

    <div class="footer-note">
      월별 트래킹 · CS_Tracking · Out Call_Tracking · 30분 지연 체크 데이터 기준
    </div>
  `;

  destroyCharts();
  const monthDailyCanvas = document.getElementById("chartMonthDaily");
  if (monthDailyCanvas){
    const perDay = month.dates.map(d => sum(agents.map(a => sections["상담인입"][a][d] || 0)));
    const tickColor = (ctx) => { const d = month.dates[ctx.index]; return d && weekdayOf(d)===0 ? "#F0555B" : "#8B96AD"; };
    charts.monthDaily = new Chart(monthDailyCanvas, {
      type: "bar",
      data: {
        labels: month.dates.map(d => d),
        datasets: [{ data: perDay, backgroundColor: "#4C6EF588", borderRadius: 3 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:"#28324D"}}, x:{grid:{display:false}, ticks:{color:tickColor, maxRotation:90, minRotation:90}} } }
    });
  }
}

function drawCharts({ dates, sections, agents, today, outcall, weekKeys, weeklyByCategory, issueTodayRanking, weeklyByIssue, issueWeekKeys, hourlyToday, productivityScores, mboTrend }){
  destroyCharts();
  Chart.defaults.color = "#8B96AD";

  Chart.defaults.font.family = "Pretendard, sans-serif";

  const peakIdx = totals.indexOf(Math.max(...totals));

  const dateLabels = dates.map(d => dateLabel(d));

  charts.inbound = new Chart(document.getElementById("chartInbound"), {

  });

  const shareToday = agents.map(a => sections["상담인입"][a][today] || 0);
  const rankOrder = agents.map((a,i) => ({ agent:a, val: shareToday[i] }))
    .sort((a,b) => b.val - a.val);
  const TIER_COLORS = ["#E8A33D","#C9CDD6","#B08D57"]; // 금/은/동
  charts.share = new Chart(document.getElementById("chartShare"), {
    type: "bar",
    data: {
      labels: rankOrder.map((r,i) => `${i+1}위 ${r.agent}`),
      datasets: [{
        data: rankOrder.map(r => r.val),
        backgroundColor: rankOrder.map((r,i) => i<3 ? TIER_COLORS[i] : AGENT_COLORS[r.agent]+"AA"),

  });

  const hourlyCanvas = document.getElementById("chartHourlyToday");
  if (hourlyCanvas){
    charts.hourlyToday = new Chart(hourlyCanvas, {
      type: "bar",
      data: { labels: Array.from({length:24}, (_,h)=>`${h}시`), datasets: [{
        data: hourlyToday || [],

        borderRadius: 4
      }]},
      options: { plugins:{legend:{display:false}}, scales:{ y:{grid:{color:"#28324D"}}, x:{grid:{display:false}} } }

  charts.agentStack = new Chart(document.getElementById("chartAgentStack"), {
    type: "bar",
    data: { labels: dateLabels, datasets: agents.map(a => ({
      label: a, data: dates.map(d => sections["상담인입"][a][d] || 0),
      backgroundColor: AGENT_COLORS[a], stack: "s"
    }))},
    options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
      scales:{ x:{stacked:true, grid:{display:false}, ticks:{color:dateTickColor}}, y:{stacked:true, grid:{color:"#28324D"}} } }
  });

  const isClosedDay = (d) => sum(agents.map(a => sections["상담인입"]?.[a]?.[d] || 0)) === 0;
  charts.rates = new Chart(document.getElementById("chartRates"), {
    type: "line",
    data: { labels: dateLabels, datasets: [
      { label:"처리율(AVG)", data: dates.map(d=>{ if (isClosedDay(d)) return null; const v=sections["상담처리율_%"]?.["AVG"]?.[d]; return v==null?null:Math.max(0,Math.min(1,v))*100;}), borderColor:"#4C6EF5", borderWidth:2, tension:.3, pointRadius:3, spanGaps:true, order:2 },
      { label:"완료율(Total)", data: dates.map(d=>{ if (isClosedDay(d)) return null; const v=sections["상담완료율_%"]?.["Total"]?.[d]; return v==null?null:Math.max(0,Math.min(1,v))*100;}), borderColor:"#12B886", borderWidth:3, borderDash:[5,3], tension:.3, pointRadius:2, pointStyle:"rect", spanGaps:true, order:1 }
    ]},
    options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
      scales:{ y:{ min:0, max:105, ticks:{callback:v=>v<=100?v+"%":""}, grid:{color:"#28324D"} }, x:{grid:{display:false}, ticks:{color:dateTickColor}} } }
  });

  const delayAgentVals = agents.map(a => sections["30분 이상 지연"]?.[a]?.[today] || 0);
  charts.delay = new Chart(document.getElementById("chartDelay"), {
    type: "bar",
    data: { labels: agents, datasets: [{
      data: delayAgentVals,
      backgroundColor: agents.map(a=>AGENT_COLORS[a]),

    options: {
      indexAxis: "y",
      plugins: { legend: { display:false } },
      scales: { x:{ grid:{color:"#28324D"} }, y:{ grid:{display:false} } }

  if (productivityScores){
    const workingIdx = agents.map((a,i) => productivityScores[i] != null);
    const validScores = productivityScores.filter(v => v!=null);

    const offAgents = agents.filter((a,i) => productivityScores[i] == null);

    charts.cph = new Chart(document.getElementById("chartCPH"), {
      data: {
        labels: agents,
        datasets: [
          {
            type: "bar",
            data: productivityScores.map(v => v == null ? 0 : v),
            backgroundColor: agents.map((a,i) => {
              if (productivityScores[i] == null) return "#4A5568"; // 휴무 - 회색
              return productivityScores[i] < overallAvg ? "#F0555B99" : "#2FBF8F99";
            }),
            borderRadius: 4,
            order: 2
          },
          {
            type: "line",
            label: `근무자 평균 (${overallAvg.toFixed(1)})`,
            data: agents.map(() => overallAvg),
            borderColor: "#E8A33D",
            borderWidth: 2,
            borderDash: [6,4],
            pointRadius: 0,
            order: 1
          }
        ]
      },
      options: {
        indexAxis: "y",
        plugins: { legend: { display:true, position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}} } },
        scales: { x:{grid:{color:"#28324D"}, max:100}, y:{grid:{display:false}} }
      }
    });
    const noteEl = document.getElementById("cphBelowAvgNote");
    if (noteEl){
      const belowAvg = agents.filter((a,i) => productivityScores[i] != null && productivityScores[i] < overallAvg);
      const parts = [];
      if (belowAvg.length) parts.push(`평균(${overallAvg.toFixed(1)}) 미만: ${belowAvg.join(", ")}`);
      if (offAgents.length) parts.push(`휴무: ${offAgents.join(", ")}`);
      noteEl.textContent = parts.length ? parts.join(" · ") : "전 상담원이 평균 이상입니다.";
    }
  }

  const outcallCanvas = document.getElementById("chartOutcall");
  if (outcallCanvas && outcall?.categories?.length){
    const cats = outcall.categories;
    charts.outcall = new Chart(outcallCanvas, {
      data: {
        labels: cats.map(catLabel),
        datasets: [
          { type:"bar", label:"인입", data: cats.map(c => outcall.data[c]?.["Total"]?.["인입"]?.[today] ?? 0), backgroundColor:"#4C6EF588", borderRadius:4 },
          { type:"bar", label:"통화완료", data: cats.map(c => outcall.data[c]?.["Total"]?.["통화완료"]?.[today] ?? 0), backgroundColor:"#12B88688", borderRadius:4 },
          { type:"bar", label:"부재", data: cats.map(c => outcall.data[c]?.["Total"]?.["미처리"]?.[today] ?? 0), backgroundColor:"#F0555B88", borderRadius:4 }
        ]
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{grid:{display:false}}, y:{grid:{color:"#28324D"}} } }
    });
  }

  const weeklyCanvas = document.getElementById("chartOutcallWeekly");
  if (weeklyCanvas && weekKeys?.length && weeklyByCategory){
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC"];
    const cats = Object.keys(weeklyByCategory);
    charts.outcallWeekly = new Chart(weeklyCanvas, {
      type: "line",
      data: {
        labels: weekKeys.map(w => `${w} 주`),
        datasets: cats.map((c,i) => ({
          label: catLabel(c),
          data: weekKeys.map(w => weeklyByCategory[c][w]?.inbound ?? 0),
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          tension: .3,
          pointRadius: 3
        }))
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{grid:{display:false}}, y:{grid:{color:"#28324D"}, title:{display:true,text:"인입 건수",font:{size:10}} } } }
    });
  }

  const byAgentCanvas = document.getElementById("chartOutcallByAgent");
  if (byAgentCanvas && outcall?.categories?.length){
    const cats = outcall.categories;
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC"];
    charts.outcallByAgent = new Chart(byAgentCanvas, {
      type: "bar",
      data: {
        labels: agents,
        datasets: cats.map((c,i) => ({
          label: catLabel(c),
          data: agents.map(a => outcall.data[c]?.[a]?.["통화완료"]?.[today] ?? 0),
          backgroundColor: palette[i % palette.length],
          stack: "cat"
        }))
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, grid:{color:"#28324D"}} } }
    });
  }

  const issueRankCanvas = document.getElementById("chartIssueRank");
  if (issueRankCanvas && issueTodayRanking?.length){
    const TIER_COLORS = ["#E8A33D","#C9CDD6","#B08D57"];
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC","#20C997","#845EF7"];
    charts.issueRank = new Chart(issueRankCanvas, {
      type: "bar",
      data: {
        labels: issueTodayRanking.map((r,i) => `${i+1}위 ${r.category}`),
        datasets: [{
          data: issueTodayRanking.map(r => r.val),
          backgroundColor: issueTodayRanking.map((r,i) => i<3 ? TIER_COLORS[i] : palette[i % palette.length]+"AA"),
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: "y",
        plugins: { legend: { display:false } },
        scales: { x:{ grid:{color:"#28324D"} }, y:{ grid:{display:false} } }
      }
    });
  }

  const issueWeeklyCanvas = document.getElementById("chartIssueWeekly");
  if (issueWeeklyCanvas && issueWeekKeys?.length && weeklyByIssue){
    const palette = ["#4C6EF5","#12B886","#F76707","#BE4BDB","#FA5252","#748FFC","#20C997","#845EF7"];
    const cats = Object.keys(weeklyByIssue);
    charts.issueWeekly = new Chart(issueWeeklyCanvas, {
      type: "line",
      data: {
        labels: issueWeekKeys.map(w => `${w} 주`),
        datasets: cats.map((c,i) => ({
          label: catLabel(c),
          data: issueWeekKeys.map(w => weeklyByIssue[c][w] ?? 0),
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          tension: .3,
          pointRadius: 3
        }))
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:10,font:{size:11}}}},
        scales:{ x:{grid:{display:false}}, y:{grid:{color:"#28324D"}, title:{display:true,text:"이슈 건수",font:{size:10}} } } }
    });
  }

  const mboCanvas = document.getElementById("chartMboTrend");
  if (mboCanvas && mboTrend){
    const dateTickColor2 = (ctx) => { const d = dates[ctx.index]; return d && weekdayOf(d)===0 ? "#F0555B" : "#8B96AD"; };
    charts.mboTrend = new Chart(mboCanvas, {
      type: "line",
      data: {
        labels: dates.map(d => dateLabel(d)),
        datasets: [{
          label: "종합 가중점수(평균)",
          data: mboTrend.map(v => v==null ? null : Math.round(v*1000)/10),
          borderColor: "#E8A33D",
          backgroundColor: "#E8A33D",
          tension: .3,
          pointRadius: 3,
          spanGaps: true
        }]
      },
      options: { plugins:{legend:{display:false}},
        scales:{ y:{ min:0, max:100, ticks:{callback:v=>v+"%"}, grid:{color:"#28324D"} }, x:{grid:{display:false}, ticks:{color:dateTickColor2}} } }
    });
  }
}

/* ===================== 상담원별 상세 아코디언 ===================== */
function toggleAgent(agent){
  if (!lastCtx) return;
  const wasOpen = openAgentPanel === agent;

  // 다른 패널 모두 닫기
  document.querySelectorAll(".acc-body").forEach(b => { b.style.display = "none"; b.innerHTML = ""; });
  document.querySelectorAll(".acc-header").forEach(h => h.classList.remove("active"));
  if (agentDetailChart){ agentDetailChart.destroy(); agentDetailChart = null; }

  if (wasOpen){ openAgentPanel = null; return; }

  openAgentPanel = agent;
  const header = document.getElementById("acc-header-" + agent);
  const body = document.getElementById("acc-body-" + agent);
  header.classList.add("active");
  body.style.display = "block";
  body.innerHTML = buildAgentDetailHTML(agent);
}

function buildAgentDetailHTML(agent){
  const { sections, today, schedule, dates, delay30, delayHold, targetCompletedToday, DELAY_PENALTY, rawLog } = lastCtx;
  const inb = sections["상담인입"]?.[agent]?.[today];
  const comp = sections["상담완료"]?.[agent]?.[today];
  const procRate = clampPct(sections["상담처리율_%"]?.[agent]?.[today]);
  const compRate = clampPct(sections["상담완료율_%"]?.[agent]?.[today]);
  const delay = sections["30분 이상 지연"]?.[agent]?.[today];
  const cph = sections["CPH(생산성)"]?.[agent]?.[today];
  const cast = sections["Cast(평점)"]?.[agent]?.[today];
  const workStatus = schedule?.schedule?.[agent]?.[today];
  const isOff = workStatus && OFF_STATUSES.includes(workStatus);
  const unprocessedTickets = (rawLog||[]).filter(r => r.agent === agent && r.date === today && r.direction === "INBOUND" && r.state && UNPROCESSED_STATES.includes(r.state.toLowerCase()));
  const unprocessed = unprocessedTickets.length;

  // 근무일 기반 생산성: 최근 기간 중 근무일수 대비 평균 처리 건수
  const workDays = dates.filter(d => {
    const st = schedule?.schedule?.[agent]?.[d];
    return st && !OFF_STATUSES.includes(st);
  }).length;
  const totalCompleted = sum(dates.map(d => sections["상담완료"]?.[agent]?.[d] || 0));
  const productivity = workDays > 0 ? totalCompleted / workDays : null;

  // 생산성 점수(목표 기반) - 처리량(60%) + 신속성(40%), 휴무자는 대상 제외
  const scoreVolume = isOff ? null : (targetCompletedToday>0 ? Math.min(100, ((comp||0) / targetCompletedToday) * 100) : 0);
  const scoreSpeed = isOff ? null : Math.max(0, 100 - (delay||0)*DELAY_PENALTY);
  const scoreTotal = isOff ? null : (scoreVolume*0.6 + scoreSpeed*0.4);
  const castRefScore = (cast!=null) ? Math.min(100, (cast / 5.0) * 100) : null; // 참고용, 종합점수에는 미반영

  function mdSortKey(md){ const [m,d] = md.split("/").map(Number); return m*100+d; }
  const delay30Rows = delay30.filter(r => r.agent === agent && r.date === today).sort((a,b) => mdSortKey(b.date) - mdSortKey(a.date));
  const delayHoldRows = delayHold.filter(r => r.agent === agent && r.date === today).sort((a,b) => mdSortKey(b.date) - mdSortKey(a.date));

  function subTable(rows, emptyMsg){
    if (!rows.length) return `<div style="color:var(--ink-dim);font-size:12px;padding:8px 0;">${emptyMsg}</div>`;
    const shown = rows.slice(0, 10);
    return `
      <table style="font-size:12px;">
        <thead><tr><th>날짜</th><th>사업장</th><th>소요시간</th><th>사유</th><th>링크</th></tr></thead>
        <tbody>
          ${shown.map(r => `<tr>
            <td>${dateWithDay(r.date)}</td><td style="text-align:left;">${r.store||'-'}</td><td>${r.duration||'-'}</td>
            <td style="text-align:left;">${r.reason||'-'}</td>
            <td>${r.url ? `<a href="${r.url}" target="_blank" style="color:var(--accent);">보기</a>` : '-'}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      ${rows.length > 10 ? `<div style="color:var(--ink-dim);font-size:11.5px;margin-top:6px;">전체 ${rows.length}건 중 최근 10건 표시</div>` : ""}
    `;
  }

  const agentDelayRate = (comp!=null && comp>0 && delay!=null) ? delay/comp : null;
  const agentOverTarget = agentDelayRate!=null && agentDelayRate > 0.03;

  return `
    ${workStatus ? `<div style="margin-bottom:12px;font-size:12.5px;color:var(--ink-dim);">오늘 근무 상태: <span style="color:${isOff?'var(--accent)':'var(--good)'};font-weight:600;">${workStatus}</span></div>` : ""}
    <div class="acc-kpis">
      <div class="acc-kpi"><div class="l">상담인입</div><div class="v">${fmtNum(inb)}</div></div>
      <div class="acc-kpi"><div class="l">상담완료</div><div class="v">${fmtNum(comp)}</div></div>
      <div class="acc-kpi"><div class="l">미처리</div><div class="v">${fmtNum(unprocessed)}</div></div>
      <div class="acc-kpi"><div class="l">처리율</div><div class="v">${fmtPct(procRate)}</div></div>
      <div class="acc-kpi"><div class="l">완료율</div><div class="v">${fmtPct(compRate)}</div></div>
      <div class="acc-kpi"><div class="l">30분 이상 지연</div><div class="v">${fmtNum(delay)}</div></div>
      <div class="acc-kpi"><div class="l">지연율 (목표 3%)</div><div class="v" style="color:${agentDelayRate==null?'inherit':(agentOverTarget?'var(--bad)':'var(--good)')};">${agentDelayRate!=null ? fmtPct(agentDelayRate) : "-"}</div></div>
      <div class="acc-kpi"><div class="l">CPH(원본)</div><div class="v">${cph!=null ? fmtNum(cph) : "-"}</div></div>
      <div class="acc-kpi"><div class="l">근무일 기준 생산성</div><div class="v">${productivity!=null ? productivity.toFixed(1)+'건/일' : '-'}</div></div>
    </div>

    <div style="margin-top:6px;font-size:13px;font-weight:600;">생산성 점수 (목표 기반) <span style="font-weight:400;color:var(--ink-dim);font-size:11.5px;">· ${dateLabel(today)} 기준</span></div>
    ${isOff ? `
      <div style="margin-top:10px;padding:14px;background:var(--panel-2);border-radius:8px;color:var(--accent);font-size:13px;">오늘은 "${workStatus}"로 근무일이 아니라 생산성 점수 대상에서 제외됩니다.</div>
    ` : `
      <div class="acc-kpis" style="margin-top:10px;">
        <div class="acc-kpi"><div class="l">처리량 점수 (60%)</div><div class="v">${scoreVolume.toFixed(0)}</div></div>
        <div class="acc-kpi"><div class="l">신속성 점수 (40%)</div><div class="v">${scoreSpeed.toFixed(0)}</div></div>
        <div class="acc-kpi" style="background:var(--panel-2);"><div class="l">종합 점수</div><div class="v" style="color:var(--accent);">${scoreTotal.toFixed(1)}</div></div>
        <div class="acc-kpi"><div class="l">평점(Cast) <span style="font-size:9.5px;">참고·미반영</span></div><div class="v">${castRefScore!=null?castRefScore.toFixed(0):'-'}</div></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-dim);margin-top:8px;line-height:1.6;">
        처리량 = 완료건수 ÷ 근무자 평균 완료건수(${targetCompletedToday.toFixed(1)}, 목표) × 100 (최대 100) · 신속성 = 100 − (지연 건수 × ${DELAY_PENALTY})
      </div>
    `}

    <div style="margin-top:18px;font-size:13px;font-weight:600;">30분 이상 지연 상세</div>
    ${subTable(delay30Rows, "해당 상담원의 30분 이상 지연 기록이 없습니다.")}
    <div style="margin-top:18px;font-size:13px;font-weight:600;">응대지연(2시간 이상) 상세</div>
    ${subTable(delayHoldRows, "해당 상담원의 2시간 이상 응대지연 기록이 없습니다.")}

    <div style="margin-top:18px;font-size:13px;font-weight:600;">미처리 상세 <span style="font-weight:400;color:var(--ink-dim);font-size:11.5px;">(인바운드 · 미종결 건)</span></div>
    ${unprocessedTickets.length ? `
      <table style="font-size:12px;">
        <thead><tr><th>사업장</th><th>상태</th><th>시간</th><th>링크</th></tr></thead>
        <tbody>
          ${unprocessedTickets.slice(0,20).map(t => `<tr><td style="text-align:left;">${t.store||'-'}</td><td style="text-align:left;">${STATE_LABELS[t.state?.toLowerCase()] || t.state || '-'}</td><td>${String(t.hour).padStart(2,'0')}시</td>
            <td>${t.url ? `<a href="${t.url}" target="_blank" style="color:var(--accent);">보기</a>` : '-'}</td></tr>`).join("")}
        </tbody>
      </table>
      ${unprocessedTickets.length > 20 ? `<div style="color:var(--ink-dim);font-size:11.5px;margin-top:6px;">전체 ${unprocessedTickets.length}건 중 20건 표시</div>` : ""}
    ` : `<div style="color:var(--ink-dim);font-size:12px;padding:8px 0;">오늘 미처리 건이 없습니다.</div>`}
  `;
}

/* ===================== 갱신 로직 ===================== */
let secondsLeft = REFRESH_MS/1000;
function startCountdown(){
  clearInterval(countdownTimer);
  secondsLeft = REFRESH_MS/1000;
  countdownTimer = setInterval(() => {
    secondsLeft--;
    const el = document.getElementById("lastUpdated");
    if (el) el.textContent = `다음 자동 갱신까지 ${Math.max(0,secondsLeft)}초`;
    if (secondsLeft <= 0) refresh(false);
  }, 1000);
}

async function refresh(manual){
  try{
    const main = await loadMainData();
    const rawLog = lastLoadedData?.rawLog || [];
    lastLoadedData = { ...main, rawLog };
    render(lastLoadedData);
  }catch(e){
    console.error(e);
    if (manual) alert("데이터를 불러오지 못했습니다: " + e.message);
  }
}

async function refreshRawLog(){
  const rawLog = await loadRawLog();
  if (lastLoadedData){
    lastLoadedData.rawLog = rawLog;
    render(lastLoadedData);
  }
}

async function initialLoad(){
  await refresh(true);
  await refreshRawLog(); // RAW 로그(6MB+)는 최초 1회만 함께 로드, 이후 30분 주기로 별도 갱신
  setInterval(refreshRawLog, RAWLOG_REFRESH_MS);
}

initialLoad();
</script>
</body>
</html>
